<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nawah Briquette Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>:root {
  --paper:#f3f4f0; --panel:#ffffff; --ink:#1e1813; --ink2:#5a534c; --muted:#8c857d; --line:#e2e1da; --line2:#eceae4;
  --palm:#1d6b50; --palm2:#14523d; --palm-soft:#e3efe9; --amber:#b9770e; --amber-soft:#fbf1dd; --ember:#e8590c;
  --band:#22170f; --band-ink:#f4ede4; --band-mut:#b8a99a; --band-line:#3a2a1f;
  --good:#0ca30c; --fair:#fab219; --poor:#d03b3b; --good-ink:#0a7a0a; --poor-ink:#b42d2d; --fair-ink:#8a5a00;
  --r-lg:16px; --r-md:10px; --r-sm:7px;
  --font:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--palm); outline-offset: 2px; border-radius: 4px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top { display:flex; align-items:center; gap:16px; padding:12px 22px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-stretch:112%; font-size:18px; letter-spacing:-.01em; white-space:nowrap; }
.brand svg { flex:none; }
.brand small { font-weight:500; font-stretch:100%; color:var(--muted); font-size:13px; margin-left:2px; }
.recipe-name { flex:1; min-width:120px; max-width:420px; border:1px solid transparent; background:transparent; padding:6px 10px; border-radius:var(--r-sm); font-weight:600; }
.recipe-name:hover { border-color:var(--line); }
.recipe-name:focus { border-color:var(--palm); background:#fff; outline:none; }
.top .spacer { flex:1; }
.btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff; padding:7px 13px; border-radius:var(--r-sm); cursor:pointer; font-weight:600; font-size:14px; white-space:nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color:#cfcdc4; background:#fafaf7; }
.btn.primary { background:var(--palm); border-color:var(--palm); color:#fff; }
.btn.primary:hover { background:var(--palm2); }
.btn.ghost { border-color:transparent; background:transparent; }
.btn.small { padding:4px 9px; font-size:13px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.amber { background:var(--amber); border-color:var(--amber); color:#fff; }

/* ---------- readout band ---------- */
.band { background:var(--band); color:var(--band-ink); position:sticky; top:57px; z-index:25; }
.band-inner { display:grid; grid-template-columns: repeat(9, minmax(108px, 1fr)); overflow-x:auto; scrollbar-width:none; }
.band-inner::-webkit-scrollbar { display:none; }
.ro { padding:12px 16px 12px; border-right:1px solid var(--band-line); min-width:108px; cursor:default; }
.ro:last-child { border-right:0; }
.ro .k { font-size:12.5px; color:var(--band-mut); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.ro .v { font-size:27px; line-height:1.15; font-weight:620; font-stretch:118%; font-variant-numeric: tabular-nums; letter-spacing:-.01em; margin-top:3px; white-space:nowrap; }
.ro .v small { font-size:12.5px; font-weight:500; font-stretch:100%; color:var(--band-mut); margin-left:3px; letter-spacing:0; }
.ro .v.flash { animation: flash .6s ease; }
@keyframes flash { 0% { color:#ffd9b8; } 100% { color:var(--band-ink); } }
.ro.score .v { color:#ffd48a; }
.st { display:inline-flex; width:15px; height:15px; border-radius:50%; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex:none; }
.st.good { background:var(--good); } .st.fair { background:var(--fair); color:#1e1813; } .st.poor { background:var(--poor); } .st.na { background:#777; }

/* ---------- layout ---------- */
.shell { display:grid; grid-template-columns: 208px 1fr; min-height: calc(100vh - 140px); }
.nav { padding:18px 10px; border-right:1px solid var(--line); background:var(--paper); position:sticky; top:148px; align-self:start; height:calc(100vh - 148px); overflow:auto; }
.nav a { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--r-sm); color:var(--ink2); text-decoration:none; font-weight:550; font-size:14.5px; margin-bottom:2px; }
.nav a svg { flex:none; opacity:.75; }
.nav a:hover { background:#e9eae4; color:var(--ink); }
.nav a.on { background:var(--palm-soft); color:var(--palm2); }
.nav a.on svg { opacity:1; }
.nav .credit { margin:22px 12px 8px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.5; }
.nav .credit b { color:var(--ink); font-weight:650; }
.nav .credit a { color:var(--palm); text-decoration:none; font-weight:600; }
.nav .credit a:hover { text-decoration:underline; }
.nav .grp { font-size:12px; color:var(--muted); padding:14px 12px 4px; }
.main { padding:26px 30px 60px; min-width:0; }
.view-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.view-head h1 { margin:0; font-size:28px; line-height:1.15; font-weight:700; font-stretch:112%; letter-spacing:-.015em; }
.view-head p { margin:6px 0 0; color:var(--ink2); max-width:68ch; }
.cols { display:grid; grid-template-columns: minmax(330px, 420px) 1fr; gap:20px; align-items:start; }
.cols.even { grid-template-columns: 1fr 1fr; }
.cols.wide-left { grid-template-columns: 1.3fr 1fr; }
.stack-v { display:flex; flex-direction:column; gap:20px; min-width:0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 20px; min-width:0; }
.card h2 { margin:0 0 4px; font-size:17px; font-weight:680; font-stretch:106%; letter-spacing:-.005em; }
.card h3 { margin:16px 0 8px; font-size:14.5px; font-weight:650; }
.card .sub { color:var(--muted); font-size:13.5px; margin:0 0 14px; }
.card-h { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
.card-h h2 { margin:0; }
.muted { color:var(--muted); } .ink2 { color:var(--ink2); }
.hr { height:1px; background:var(--line2); margin:14px 0; }

/* ---------- controls ---------- */
.ctl { margin:12px 0; }
.ctl-h { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; margin-bottom:4px; }
.ctl-h label { font-weight:560; }
.ctl-h .val { font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap; }
.ctl-h .val small { color:var(--muted); font-weight:500; margin-left:2px; }
.ctl .hint { font-size:12.5px; color:var(--muted); margin-top:3px; }
input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; cursor:pointer; margin:0; }
input[type=range]::-webkit-slider-runnable-track { height:5px; border-radius:3px; background:linear-gradient(90deg, var(--palm) var(--p,50%), #dddcd4 var(--p,50%)); }
input[type=range]::-moz-range-track { height:5px; border-radius:3px; background:#dddcd4; }
input[type=range]::-moz-range-progress { height:5px; border-radius:3px; background:var(--palm); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--palm); margin-top:-6.5px; box-shadow:0 1px 3px rgba(30,24,19,.18); }
input[type=range]::-moz-range-thumb { width:15px; height:15px; border-radius:50%; background:#fff; border:2px solid var(--palm); }
.seg-ctl { display:inline-flex; background:#eeeee8; border-radius:var(--r-sm); padding:3px; gap:2px; flex-wrap:wrap; }
.seg-ctl button { border:0; background:transparent; padding:5px 11px; border-radius:5px; cursor:pointer; font-size:13.5px; font-weight:560; color:var(--ink2); }
.seg-ctl button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(30,24,19,.12); }
.seg-ctl.full { display:flex; } .seg-ctl.full button { flex:1; }
select.sel, input.inp { border:1px solid var(--line); background:#fff; border-radius:var(--r-sm); padding:6px 9px; font-size:14px; }
input.inp { width:100%; font-variant-numeric: tabular-nums; }
input.inp:focus, select.sel:focus { border-color:var(--palm); outline:none; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
.check { display:inline-flex; align-items:center; gap:7px; font-size:14px; cursor:pointer; }

/* ---------- ingredients ---------- */
.ing { display:grid; grid-template-columns: 12px 1fr 62px 28px 26px; gap:6px 10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line2); }
.ing:last-of-type { border-bottom:0; }
.ing .sw { width:12px; height:30px; border-radius:4px; }
.ing .nm { min-width:0; }
.ing .nm button { border:0; background:transparent; padding:0; text-align:left; cursor:pointer; font-weight:620; font-size:14.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
.ing .nm button:hover { color:var(--palm); }
.ing .nm .c { font-size:12px; color:var(--muted); }
.ing .slider { grid-column: 2 / 3; }
.ing input.pct { width:62px; text-align:right; padding:4px 6px; }
.icon-btn { width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; border:0; background:transparent; cursor:pointer; color:var(--muted); }
.icon-btn:hover { background:#efeee8; color:var(--ink); }
.icon-btn.on { color:var(--amber); }
.tag { display:inline-block; font-size:11.5px; padding:1px 7px; border-radius:999px; background:#efeee8; color:var(--ink2); font-weight:560; margin-left:4px; vertical-align:1px; }
.tag.local { background:var(--palm-soft); color:var(--palm2); }
.tag.est { background:var(--amber-soft); color:var(--fair-ink); }
.tag.bind { background:#ece8f8; color:#4a3aa7; }

/* ---------- results ---------- */
.kpis { display:grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap:10px; }
.kpi { border:1px solid var(--line2); border-radius:var(--r-md); padding:10px 12px; background:#fcfcfa; }
.kpi .k { font-size:12.5px; color:var(--ink2); display:flex; gap:6px; align-items:center; justify-content:space-between; }
.kpi .v { font-size:21px; font-weight:640; font-stretch:110%; font-variant-numeric: tabular-nums; line-height:1.2; margin-top:2px; }
.kpi .v small { font-size:12px; color:var(--muted); font-weight:500; font-stretch:100%; margin-left:3px; }
.kpi .n { font-size:12px; color:var(--muted); margin-top:1px; }
.group-t { font-size:13.5px; font-weight:650; margin:16px 0 8px; color:var(--ink); }
.group-t:first-child { margin-top:0; }
.stat-l { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
.stat-l.good { color:var(--good-ink); } .stat-l.fair { color:var(--fair-ink); } .stat-l.poor { color:var(--poor-ink); }
.tips { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
.tips li { display:grid; grid-template-columns: 22px 1fr; gap:8px; font-size:14px; }
.tips li .ic { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
.tips li.warn .ic { background:#fde9c4; color:#8a5a00; } .tips li.ok .ic { background:#d6f0d6; color:#0a6a0a; } .tips li.bad .ic { background:#f6d4d4; color:#a52a2a; }
.tips li b { font-weight:650; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x:auto; }
table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl th { text-align:left; font-weight:600; color:var(--ink2); font-size:13px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; background:#fafaf7; position:sticky; top:0; }
.tbl td { padding:8px 10px; border-bottom:1px solid var(--line2); font-variant-numeric: tabular-nums; vertical-align:middle; }
.tbl tr:hover td { background:#fafaf6; }
.tbl td.num, .tbl th.num { text-align:right; }
.tbl tr.sel td { background:var(--palm-soft); }
.tbl input.inp { padding:4px 6px; min-width:64px; }

/* ---------- charts ---------- */
.chart { display:block; overflow:visible; font-family:var(--font); }
.chart .grid { stroke:#e1e0d9; stroke-width:1; }
.chart .base { stroke:#c3c2b7; stroke-width:1; }
.chart .ax { fill:#898781; font-size:11.5px; font-variant-numeric: tabular-nums; }
.chart .ax-l { fill:#52514e; font-size:12px; }
.chart .band-l { fill:#0a7a0a; font-size:11px; }
.chart .marker { stroke:#898781; stroke-dasharray:3 4; stroke-width:1; }
.chart .mk-l { fill:#52514e; font-size:11.5px; }
.chart .dot-l { fill:#1e1813; font-size:12px; font-weight:600; }
.chart .cursor { stroke:var(--ember); stroke-width:2; }
.chart .hover-x { stroke:#b5b3aa; stroke-width:1; }
.chart .target { stroke:#1e1813; stroke-width:1.5; stroke-dasharray:4 3; }
.chart .bar-l { fill:#52514e; font-size:13px; }
.chart .bar-l.b { fill:#1e1813; font-weight:650; }
.chart .bar-v { fill:#1e1813; font-size:12.5px; font-variant-numeric: tabular-nums; font-weight:600; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink2); margin:2px 0 8px; }
.legend .lg { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:14px; height:4px; border-radius:2px; display:inline-block; }
.chart-tip { position:fixed; z-index:100; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px; box-shadow:0 6px 20px rgba(30,24,19,.12); pointer-events:none; display:none; max-width:280px; font-variant-numeric: tabular-nums; }
.chart-tip div { display:flex; align-items:center; gap:6px; margin-top:2px; }
.chart-tip i { width:10px; height:3px; border-radius:2px; display:inline-block; }
.stack { display:flex; height:22px; border-radius:6px; overflow:hidden; gap:2px; background:#fff; margin:6px 0 10px; }
.stack .seg { min-width:3px; transition:flex .35s ease; }
.stack .seg:first-child { border-radius:6px 0 0 6px; } .stack .seg:last-child { border-radius:0 6px 6px 0; }
.empty { padding:30px; text-align:center; color:var(--muted); }

/* ---------- simulation stages ---------- */
.stage { background:linear-gradient(#fbfbf9, #f1f1ec); border:1px solid var(--line); border-radius:var(--r-md); position:relative; overflow:hidden; }
.stage canvas, .stage svg.anim { display:block; width:100%; }
.stage.dark { background:radial-gradient(ellipse at 50% 85%, #2c1d14, #140d09 70%); border-color:#2b1f17; }
.stage-ctl { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.stage-ctl input[type=range] { flex:1; min-width:140px; }
.phase { display:inline-flex; gap:6px; align-items:center; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background:#efeee8; }
.phase i { width:8px; height:8px; border-radius:50%; }
.overlay-read { position:absolute; left:14px; top:12px; font-size:13px; color:var(--ink2); line-height:1.35; font-variant-numeric: tabular-nums; }
.overlay-read b { color:var(--ink); font-size:17px; font-weight:650; font-stretch:110%; }
.stage.dark .overlay-read { color:#cbb9a8; } .stage.dark .overlay-read b { color:#fff1e2; }

/* ---------- shapes ---------- */
.shape-pick { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
.shape-pick button { border:1px solid var(--line); background:#fff; border-radius:var(--r-md); padding:10px 4px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; font-weight:560; color:var(--ink2); line-height:1.2; text-align:center; }
.shape-pick button:hover { border-color:#c9c7bd; }
.shape-pick button.on { border-color:var(--palm); background:var(--palm-soft); color:var(--palm2); box-shadow: inset 0 0 0 1px var(--palm); }
.reco { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
.reco .rc { border:1px solid var(--line); border-radius:var(--r-md); padding:12px; background:#fff; display:flex; flex-direction:column; gap:6px; }
.reco .rc.best { border-color:var(--amber); box-shadow: inset 0 0 0 1px var(--amber); background:linear-gradient(#fffaf0, #fff 60%); }
.reco .rc .rank { font-size:12px; font-weight:700; color:var(--amber); }
.reco .rc .nm { font-weight:680; font-size:15px; }
.reco .rc .dims { font-size:13px; color:var(--ink2); }
.reco .rc .sc { font-size:26px; font-weight:650; font-stretch:115%; font-variant-numeric: tabular-nums; }
.reco .rc ul { margin:0; padding-left:16px; font-size:12.5px; color:var(--ink2); }

/* ---------- modal ---------- */
.modal-bg { position:fixed; inset:0; background:rgba(30,24,19,.42); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; }
.modal { background:#fff; border-radius:var(--r-lg); width:min(860px, 100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(30,24,19,.3); }
.modal-h { padding:16px 20px 10px; border-bottom:1px solid var(--line2); }
.modal-h h2 { margin:0 0 10px; font-size:18px; }
.modal-b { padding:10px 20px 20px; overflow:auto; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; font-weight:550; color:var(--ink2); }
.chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.pick-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:8px; margin-top:12px; }
.pick-item { border:1px solid var(--line); border-radius:var(--r-md); padding:9px 11px; cursor:pointer; display:grid; grid-template-columns: 18px 1fr; gap:4px 10px; text-align:left; background:#fff; }
.pick-item:hover { border-color:var(--palm); background:#fbfdfb; }
.pick-item .dot { width:18px; height:18px; border-radius:5px; border:1px solid rgba(0,0,0,.1); margin-top:2px; }
.pick-item .t { font-weight:620; font-size:14px; }
.pick-item .d { grid-column:2; font-size:12px; color:var(--muted); font-variant-numeric: tabular-nums; }
.pick-item:disabled { opacity:.45; cursor:not-allowed; }

/* ---------- lab ---------- */
.test { border:1px solid var(--line); border-radius:var(--r-lg); background:#fff; margin-bottom:14px; overflow:hidden; }
.test-h { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; }
.test-h:hover { background:#fbfbf8; }
.test-h .ttl { font-weight:660; font-size:15.5px; flex:1; }
.test-h .std { font-size:12.5px; color:var(--muted); }
.test-h .res { font-variant-numeric: tabular-nums; font-weight:650; text-align:right; white-space:nowrap; }
.test-b { padding:4px 18px 18px; border-top:1px solid var(--line2); display:none; }
.test.open .test-b { display:block; }
.test.open .chev { transform:rotate(90deg); }
.chev { transition:transform .2s; color:var(--muted); }
.formula { font-size:13.5px; background:#f6f6f2; border-radius:var(--r-sm); padding:8px 12px; display:inline-block; margin:6px 0 10px; color:var(--ink); }
.readings { font-variant-numeric: tabular-nums; }
.copy-ok { color:var(--good-ink); font-weight:600; font-size:13px; }
.note { font-size:13px; color:var(--ink2); background:#f6f6f2; border-radius:var(--r-md); padding:10px 12px; }
.note.amber { background:var(--amber-soft); }
.note b { font-weight:650; }

/* ---------- methods ---------- */
.prose { max-width:78ch; }
.prose h2 { font-size:19px; margin:26px 0 8px; font-stretch:106%; }
.prose p, .prose li { color:var(--ink2); }
.prose code, .eq { font-family: var(--font); background:#f1f1ec; padding:2px 6px; border-radius:5px; color:var(--ink); font-size:14px; }
.eq { display:block; padding:8px 12px; margin:8px 0; }

@media (max-width: 1180px) { .cols, .cols.wide-left { grid-template-columns: 1fr; } .reco { grid-template-columns:1fr; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position:sticky; top:136px; height:auto; display:flex; overflow-x:auto; padding:6px 8px; border-right:0; border-bottom:1px solid var(--line); z-index:20; gap:2px; }
  .nav .credit { margin:22px 12px 8px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.5; }
.nav .credit b { color:var(--ink); font-weight:650; }
.nav .credit a { color:var(--palm); text-decoration:none; font-weight:600; }
.nav .credit a:hover { text-decoration:underline; }
.nav .grp { display:none; }
  .nav a { white-space:nowrap; margin:0; padding:6px 10px; }
  .main { padding:18px 14px 50px; }
  .top { padding:10px 12px; gap:8px; }
  .brand small, .top .hide-s { display:none; }
  .band { top:53px; }
  .ro { padding:9px 12px; } .ro .v { font-size:22px; }
  .cols.even, .grid2 { grid-template-columns:1fr; }
  .shape-pick { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

.m-credit { display:none; text-align:center; font-size:12.5px; color:var(--muted); padding:20px 0 0; }
.m-credit a { color:var(--palm); font-weight:600; text-decoration:none; }

.sieves { display:grid; grid-template-columns: repeat(8, 1fr); gap:4px; }
.sv { border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 0; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink2); font-variant-numeric: tabular-nums; }
.sv:hover { border-color:#c9c7bd; }
.sv.on { background:var(--palm); border-color:var(--palm); color:#fff; }
.pack-vis { background:#f6f6f2; border-radius:var(--r-sm); padding:4px 6px; margin-top:2px; }
.pack-l { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); padding:2px 2px 0; }
.pack-l i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; }

a.btn { text-decoration:none; }
.best-prog { margin-top:12px; font-size:13.5px; color:var(--ink2); }
.best-prog .bar { height:6px; background:#e7e6df; border-radius:3px; overflow:hidden; margin-bottom:6px; }
.best-prog .bar i { display:block; height:100%; background:var(--amber); transition:width .3s ease; }
.steps { margin:0; padding-left:20px; color:var(--ink2); font-size:14px; display:flex; flex-direction:column; gap:6px; }
.steps b { color:var(--ink); }
.best-hero { display:grid; grid-template-columns: minmax(200px, 300px) 1fr; gap:18px; align-items:center; background:linear-gradient(#fffaf0, #fff); border:1px solid #f0dfbd; border-radius:var(--r-md); padding:10px 16px; }
.best-score { font-size:52px; font-weight:680; font-stretch:118%; line-height:1; color:var(--amber); font-variant-numeric: tabular-nums; }
.best-score small { font-size:16px; color:var(--muted); font-weight:500; margin-left:4px; }
.recipe-steps td:first-child { width:130px; }
.chg.up { color:var(--good-ink); font-weight:600; } .chg.down { color:var(--poor-ink); font-weight:600; }
@media (max-width: 860px) { .best-hero { grid-template-columns:1fr; } }
.best-shape svg { overflow:visible; }

.aq { display:flex; flex-direction:column; gap:4px; border-radius:var(--r-md); padding:10px 12px; font-size:13.5px; color:var(--ink2); margin-bottom:6px; }
.aq.good { background:#e5f4e5; } .aq.fair { background:#fdf3dc; } .aq.poor { background:#fbe3e3; }
.aq-l { display:flex; align-items:center; gap:7px; font-size:15px; color:var(--ink); }
.gas-tbl td { vertical-align:top; }
.gas-cmp { display:flex; flex-direction:column; gap:4px; }
.gas-tbl td:first-child { min-width:260px; }

/* ============================================================
   SIMULATION MODELS
   All functions are pure; UI calls evaluate().
   ============================================================ */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;

let MATS = {};               // id -> material (library + custom + overrides)
function rebuildMats(custom = [], overrides = {}) {
  MATS = {};
  for (const m of MATERIALS) MATS[m.id] = Object.assign({}, m, overrides[m.id] || {});
  for (const m of custom) MATS[m.id] = Object.assign({}, M(m), { custom: true });
  for (const id in MATS) { const m = MATS[id], c = CHEM[id] || CHEM_DEFAULT[m.c] || [0.6, 0.08, 0.1];
    if (m.N == null) m.N = c[0]; if (m.S == null) m.S = c[1]; if (m.Cl == null) m.Cl = c[2]; }
}
const getMat = (id) => MATS[id] || MATS.date_seed;
const isBinder = (m) => m.c === 'Binders';

/* ---------- Pre-treatment of feedstocks ---------- */
function pretreat(m, pre) {
  if (isBinder(m) || m.char || pre === 'raw') return m;
  const o = Object.assign({}, m);
  const vmOrg = m.vm / Math.max(1, 100 - m.ash);
  if (pre === 'torrefied') {
    const Y = 0.75, EY = 0.88;
    o.ash = Math.min(m.ash / Y, 60);
    o.vm = (100 - o.ash) * vmOrg * 0.85;
    o.hhv = m.hhv * EY / Y;
    o.N = m.N / Y * 0.9; o.S = m.S / Y * 0.85; o.Cl = m.Cl / Y * 0.7;
    o.h = m.h * 0.9; o.fib = m.fib * 0.6; o.hard = Math.min(1, m.hard + 0.1);
    o.sb = m.sb * 0.3; o.bulk = m.bulk * 0.9; o.rt = m.rt * 0.95; o.smk = m.smk * 0.6;
    o.oil = m.oil * 0.6; o.torr = true;
  } else if (pre === 'carbonized') {
    const Y = clamp(0.30 + 0.004 * m.ash, 0.25, 0.6);
    o.ash = Math.min(m.ash / Y, 85);
    o.vm = (100 - o.ash) * 0.24;
    const fc = 100 - o.ash - o.vm;
    o.hhv = 0.3536 * fc + 0.1559 * o.vm - 0.0078 * o.ash;   // Parikh et al. (2005)
    o.N = m.N / Y * 0.5; o.S = m.S / Y * 0.6; o.Cl = m.Cl / Y * 0.3;
    o.h = 3.0; o.fib = 0; o.hard = 0.72; o.sb = 0; o.lig = 0; o.oil = 0;
    o.bulk = m.bulk * 0.75; o.rt = m.rt * 0.72; o.ks = 0.6; o.char = true; o.smk = 0.05;
  }
  return o;
}

/* ---------- Mixture properties (mass-weighted, dry basis) ---------- */
function mixProps(recipe, pre) {
  const items = recipe.filter(r => r.pct > 0).map(r => ({ m: pretreat(getMat(r.id), pre), raw: getMat(r.id), w: r.pct }));
  const tot = items.reduce((s, i) => s + i.w, 0) || 1;
  items.forEach(i => i.w /= tot);
  const p = { N:0, S:0, Cl:0, hhv:0, vm:0, ash:0, h:0, lig:0, oil:0, fib:0, hard:0, sb:0, ks:0, smk:0, cost:0,
              B:0, Beff:0, paste:0, shrinkSum:0, hygW:0, charFrac:0, dateShare:0, wasteShare:0, localShare:0,
              b:0, spring:0, estShare:0 };
  let invBulk = 0, invRt = 0;
  for (const { m, raw, w } of items) {
    p.N += w * m.N; p.S += w * m.S; p.Cl += w * m.Cl;
    p.hhv += w * m.hhv; p.vm += w * m.vm; p.ash += w * m.ash; p.h += w * m.h;
    p.lig += w * m.lig; p.oil += w * m.oil; p.fib += w * m.fib; p.hard += w * m.hard;
    p.ks += w * m.ks; p.smk += w * m.smk; p.cost += w * m.cost;
    invBulk += w / m.bulk; invRt += w / m.rt;
    if (m.est) p.estShare += w;
    if (isBinder(m)) {
      p.B += w; p.Beff += w * m.bs; p.paste += w * m.wr; p.shrinkSum += w * m.shr; p.hygW += w * m.hyg;
      p.b += w * 0.55; p.spring += w * 0.02;
    } else {
      p.Beff += w * m.sb * 0.5; p.shrinkSum += w * m.sb * 0.3; p.sb += w * m.sb;
      p.b += w * (0.10 + 0.40 * (1 - m.hard) + 0.10 * m.fib);

      if (m.cost <= 0.05) p.wasteShare += w;

}

/* ---------- Shapes ---------- */
const SHAPES = {
  cyl:       { n:'Solid cylinder',        dims:['D','H'],          make:1.00, edge:1.00, roller:false },
  cylHole:   { n:'Cylinder, centre hole', dims:['D','H','d'],      make:0.90, edge:1.00, roller:false },
  multiHole: { n:'Honeycomb (multi-hole)',dims:['D','H','d','nh'], make:0.70, edge:1.00, roller:false },
  hexHole:   { n:'Hexagon with hole',     dims:['D','H','d'],      make:0.75, edge:1.10, roller:false },
  brick:     { n:'Rectangular block',     dims:['L','W','H'],      make:0.85, edge:1.25, roller:false },
  cube:      { n:'Cube',                  dims:['a'],              make:0.85, edge:1.30, roller:false },
  pillow:    { n:'Pillow / egg',          dims:['L','W','H'],      make:0.40, edge:0.80, roller:true  },
  sphere:    { n:'Ball',                  dims:['D'],              make:0.35, edge:0.80, roller:true  },
};
const DIM_LABEL = { D:'Diameter', H:'Height', d:'Hole diameter', nh:'Number of holes', L:'Length', W:'Width', a:'Side' };
const DIM_RANGE = { D:[25,120], H:[10,120], d:[5,40], nh:[7,19], L:[30,150], W:[20,100], a:[20,100] };

function shapeGeom(sh) {
  const t = sh.type, s = SHAPES[t], mm = 0.001;
  const D = sh.D * mm, H = sh.H * mm, d = sh.d * mm, L = sh.L * mm, W = sh.W * mm, a = sh.a * mm;
  let V, A, Aload, wall, maxDim, holeN = 0, valid = true, Deq;
  const circ = (x) => Math.PI * x * x / 4;
  switch (t) {
    case 'cyl':
      V = circ(D) * H; A = Math.PI * D * H + 2 * circ(D); Aload = circ(D); wall = D / 2; maxDim = Math.max(D, H); break;
    case 'cylHole': {
      const dd = Math.min(d, D * 0.6);
      V = (circ(D) - circ(dd)) * H; A = Math.PI * (D + dd) * H + 2 * (circ(D) - circ(dd));
      Aload = circ(D) - circ(dd); wall = (D - dd) / 2; maxDim = Math.max(D, H); holeN = 1; break;
    }
    case 'multiHole': {
      const n = sh.nh <= 9 ? 7 : sh.nh <= 15 ? 12 : 19, k = n === 7 ? 3 : n === 12 ? 4 : 5;
      const web = (D - k * d) / (k + 1);
      if (web < 0.003) valid = false;
      V = (circ(D) - n * circ(d)) * H; A = Math.PI * D * H + n * Math.PI * d * H + 2 * (circ(D) - n * circ(d));
      Aload = circ(D) - n * circ(d); wall = Math.max(web, 0.001); maxDim = Math.max(D, H); holeN = n; break;
    }
    case 'hexHole': {
      const hexA = Math.sqrt(3) / 2 * D * D, per = 2 * Math.sqrt(3) * D, dd = Math.min(d, D * 0.6);
      V = (hexA - circ(dd)) * H; A = per * H + Math.PI * dd * H + 2 * (hexA - circ(dd));
      Aload = hexA - circ(dd); wall = (D - dd) / 2; maxDim = Math.max(D * 1.155, H); holeN = 1; break;
    }
    case 'brick':
      V = L * W * H; A = 2 * (L * W + L * H + W * H); Aload = L * W; wall = Math.min(L, W, H) / 2; maxDim = Math.max(L, W, H); break;
    case 'cube':
      V = a * a * a; A = 6 * a * a; Aload = a * a; wall = a / 2; maxDim = a; break;
    case 'pillow': {
      const p = 1.6075, ea = L / 2, eb = W / 2, ec = H / 2;
      V = 4 / 3 * Math.PI * ea * eb * ec;
      A = 4 * Math.PI * Math.pow((Math.pow(ea * eb, p) + Math.pow(ea * ec, p) + Math.pow(eb * ec, p)) / 3, 1 / p);
      Aload = Math.PI * ea * eb * 0.55; wall = Math.min(ea, eb, ec); maxDim = Math.max(L, W, H); break;
    }

  }

  const pressH = t === 'cube' ? a : (t === 'sphere' ? D : H);
  const Hd = pressH / Math.max(Deq, 1e-6);
  const unif = s.roller ? 0.95 : Math.exp(-0.35 * Math.max(0, Hd - 0.6));
  const maxMm = maxDim / mm;
  const fit = maxMm < 20 ? 0 : maxMm < 40 ? (maxMm - 20) / 20 : maxMm <= 80 ? 1 : maxMm < 140 ? 1 - (maxMm - 80) / 60 : 0;
  const thinWall = wall < 0.008 ? 1 + (0.008 - wall) / 0.008 : 1;
  return { V, A, Aload, wall, Lc: V / A, unif, Hd, Deq, maxDim, fit, holeN, valid: valid && V > 0,
           make: s.make, edge: s.edge * thinWall, name: s.n, AV: A / V };
}

/* ---------- Grinding: one sieve size or two sizes mixed ---------- */
const SIEVES = [[0.1,'140'],[0.25,'60'],[0.5,'35'],[1,'18'],[2,'10'],[2.8,'7'],[4,'5'],[5.6,'3.5']];
const meshOf = (d) => (SIEVES.find(s => s[0] === d) || [0, '?'])[1];
function grindProps(proc) {
  const E = (d) => 1 / Math.sqrt(d * 1000) - 1 / Math.sqrt(20000);     // Bond's law, feed = whole seed (~20 mm)

  if (proc.grind !== 'two') { const d = proc.size; return { two:false, deff:d, gain:0, effort:E(d) / E2 }; }
  const df = Math.min(proc.fine, proc.coarse), dc = Math.max(proc.fine, proc.coarse), f = clamp(proc.fineShare, 0.05, 0.95);
  const r = df / dc;
  // binary packing: small particles fill the gaps between big ones; best near 30-40% fines and size ratio >= 4
  const gain = 0.15 * Math.pow(1 - r, 1.5) * Math.exp(-Math.pow((f - 0.35) / 0.22, 2));
  const deff = 1 / (f / df + (1 - f) / dc);
  return { two:true, deff, gain, effort:(f * E(df) + (1 - f) * E(dc)) / E2, df, dc, f, r };
}

/* ---------- Compaction (Kawakita equation) ---------- */
function compaction(mp, proc, geo) {
  const M0 = proc.moistMode === 'auto' ? Math.max(mp.Mnat, 0.12) : proc.moist;
  let X = M0 / (1 - M0);
  const gp = grindProps(proc);
  const D0 = clamp(mp.bulk / mp.rt * (0.9 + 0.1 * Math.min(1, gp.deff)) * (1 + gp.gain), 0.05, 0.8);
  const fs = Math.min(1.6, Math.pow(2 / Math.max(gp.deff, 0.15), 0.25));
  const fm = Math.exp(-Math.pow((M0 - mp.Mopt) / 0.12, 2));
  const fd = 1 + 0.08 * Math.log(1 + proc.dwell / 5);
  const fbind = 1 + 0.8 * Math.min(mp.Beff, 0.3);
  const b = mp.b * fs * (0.6 + 0.6 * fm) * fd * fbind;
  const a = 1 - D0;
  const kaw = (P) => { const C = a * b * P / (1 + b * P); return D0 / (1 - C); };
  let Dt = kaw(proc.P) * (0.88 + 0.12 * geo.unif);
  let squeezed = 0;
  const maxD = (Xw) => 0.97 / (1 + Xw * mp.rt / 1000);
  if (Dt > maxD(X)) {
    const Xcap = Math.max(0, (0.97 / Math.min(Dt, 0.96) - 1) * 1000 / mp.rt);
    const f = 0.5 + 0.5 * (1 - Math.exp(-proc.dwell / 15));
    const Xn = X - f * (X - Xcap);
    squeezed = X - Xn; X = Xn;
    Dt = Math.min(Dt, maxD(X));
  }
  const Mp = X / (1 + X);
  const rhoS = Dt * mp.rt;                          // solids per m3 at max pressure
  const spring = mp.spring * 2 * (proc.P / (proc.P + 3)) * (1 / (1 + 0.04 * proc.dwell))
               * (1 - 0.6 * Math.min(mp.Beff / 0.15, 1)) * (1 + 1.5 * Math.max(0, Mp - mp.Mopt));
  const RR = 1 + spring;
  return { D0, a, b, Dt, X, Mp, M0, squeezed, spring, RR, rhoS,
           rhoMax: rhoS * (1 + X), rhoEject: rhoS * (1 + X) / (1 + 0.6 * spring), rho24: rhoS * (1 + X) / RR,
           curve: (P) => kaw(P) * mp.rt * (0.88 + 0.12 * geo.unif) };
}

/* ---------- Drying ---------- */
const DRY_METHODS = {
  shade:   { n:'Shade / air drying', hours:96 },
  sun:     { n:'Sun drying',         hours:48 },
  oven60:  { n:'Oven 60 °C',         hours:24 },
  oven105: { n:'Oven 105 °C',        hours:8 },

function dryCond(method, tH, proc) {
  const Ta = proc.Tamb, rh = proc.rh;
  switch (method) {
    case 'shade': return { T: Ta, RH: rh };
    case 'sun': { const hod = (tH + 8) % 24; return hod >= 7 && hod < 18 ? { T: Ta + 18, RH: rh * 0.55 } : { T: Ta - 6, RH: Math.min(90, rh * 1.6) }; }
    case 'oven60': return { T: 60, RH: 8 };
    case 'oven105': return { T: 105, RH: 1 };
  }
}
function dryRun(mp, comp, geo, proc, method, hours, dt = 0.25) {
  const Deff = (T) => 6e-10 * Math.exp(-30000 / 8.314 * (1 / (T + 273.15) - 1 / 303.15)) * (1 + 0.8 * mp.fib);
  const k = (T) => Math.PI * Math.PI * Deff(T) / (4 * geo.Lc * geo.Lc) * 3600;   // 1/h
  const Xe = (T, RH) => { const Me = clamp(0.02 + 0.17 * Math.pow(RH / 100, 1.4) - 0.0015 * (T - 30) + 0.08 * mp.hyg * Math.min(1, mp.B / 0.1) * RH / 100, 0, 0.3); return Me / (1 - Me); };
  let X = comp.X, kmax = 0, t10 = null;
  const series = [{ t: 0, M: 100 * X / (1 + X) }];
  const n = Math.ceil(hours / dt);
  for (let i = 1; i <= n; i++) {
    const t = i * dt, c = dryCond(method, t, proc), kk = k(c.T);
    kmax = Math.max(kmax, kk);
    const xe = Xe(c.T, c.RH);
    X += -kk * (X > xe ? 1 : 0.12) * (X - xe) * dt;   // re-wetting from air is much slower than drying
    X = Math.max(X, 0);
    const Mw = X / (1 + X);
    if (t10 === null && Mw <= 0.10) t10 = t;
    if (i % Math.max(1, Math.round(1 / dt)) === 0 || i === n) series.push({ t, M: 100 * Mw });
  }
  const Mf = X / (1 + X);
  const shrink = clamp((comp.Mp - Mf) * (0.15 + 1.2 * mp.shrinkSum), 0, 0.35);
  const intensity = Math.sqrt(kmax / k(30)) * (method === 'sun' ? 1.2 : 1);
  const Z = 4.2 * (1 - 0.8 * grindProps(proc).gain) * shrink * intensity * Math.sqrt(geo.Lc / 0.006) * Math.max(0.2, 1 - 1.2 * mp.fib) * (1 + 0.5 * mp.hard) / (1 + 1.5 * Math.min(mp.Beff, 0.3));
  const crack = 100 * (1 - Math.exp(-Z));

}

/* ---------- Thermal properties ---------- */
function thermalProps(mp, rhoDry, Xf) {
  const rhoS = rhoDry / (1 + Xf);
  const phi = clamp(1 - rhoS / mp.rt, 0.02, 0.9);
  const S = clamp((Xf * rhoS / 1000) / phi, 0, 1);
  const kf = 0.026 + (0.6 - 0.026) * S;
  const k = Math.pow(mp.ks, 1 - phi) * Math.pow(kf, phi);
  const cpS = lerp(1350, 950, mp.charFrac);
  const cp = (cpS + 4180 * Xf) / (1 + Xf);
  return { k, cp, phi, alpha: k / (rhoDry * cp), krc: k * rhoDry * cp };
}

/* ---------- Ignition (thermally-thick piloted ignition) ---------- */
const IGN_SOURCES = { lighter:{ n:'Lighter / match', q:35000 }, starter:{ n:'Fire-starter gel', q:45000 }, bunsen:{ n:'Bunsen burner', q:60000 } };
function ignitionTime(mp, th, Mf, geo, proc) {
  const qnet = IGN_SOURCES[proc.ign].q - 10000;
  const Tig = 300 + 150 * mp.charFrac;
  let t = Math.PI / 4 * th.krc * Math.pow((Tig - 25) / qnet, 2);
  t *= (1 + 3.5 * Mf) * Math.pow(75 / Math.max(mp.vm, 8), 1.6) * Math.min(1, Math.sqrt(geo.Lc / 0.004));
  t *= proc.setup === 'stove' ? 0.7 : 1;
  return clamp(t, 2, 1200);
}

/* ---------- Combustion (mass-loss model, 4 pools) ---------- */
function burnSim(R, opts = {}) {
  const dt = opts.dt || 1, rec = opts.rec || 5, setup = opts.setup || R.proc.setup, maxT = opts.maxT || 4 * 3600;
  const g = R.geo, mp = R.mp;
  const m0 = R.rhoDry * g.V;                         // kg, as-fired
  const Mf = R.Mf;
  let mw = m0 * Mf, dry = m0 * (1 - Mf);
  let mv = dry * mp.vm / 100, mc = dry * mp.fc / 100;
  const ma = dry * mp.ash / 100, mv0 = mv, mc0 = mc, mw0 = mw;
  const stove = setup === 'stove';
  const fb = stove ? 1 : 0.32;
  const densF = Math.sqrt(600 / R.rhoDry);
  const holeAir = g.holeN > 0 ? 1.25 : 1;
  const Jv0 = 0.010 * fb * densF, Jc0 = 0.0022 * (stove ? 1 : 0.65) * densF * holeAir, Jw0 = 0.006 * fb;
  const Echar = 30e6, lhvRatio = R.lhvDry / Math.max(mp.hhv, 1);
  const hv = Math.max(5e6, (mp.hhv * 1e6 * dry - 32e6 * mc0) / Math.max(mv0, 1e-9)) * lhvRatio;
  const qmin = stove ? 1.0e-5 : 3.0e-5, rcMin = stove ? 0.8e-6 : 2.5e-6;

  const Cdry = mp.C / 100 * dry, Cchar = 0.85, Cvol = clamp((Cdry - Cchar * mc0) / Math.max(mv0, 1e-12), 0.3, 0.7);
  const mceDrop = 0.25 * Mf, oilF = 1 + mp.oil / 20;
  const E = { CO:0, PM:0, CH4:0, Cout:0, burned:0 };
  const s0 = mc0 + 0.6 * mv0 + 0.2 * ma;
  const series = [];
  let t = 0, flame = false, flameStart = null, flameEnd = null, glowEnd = null, out = false;
  let peak = 0, smoulderV = 0, Eflame = 0, Eglow = 0;
  while (t <= maxT) {
    const s = (mc + 0.6 * mv + 0.2 * ma) / s0;
    const A = g.A * Math.pow(Math.max(s, 1e-4), 2 / 3);
    let rw = 0, rv = 0, rc = 0, hrr = 0, phase = 'heating';
    if (t < tign) {

    } else if (!out) {
      const ramp = Math.min(1, (t - tign) / 8);
      const boost = 1 + (stove ? 0.25 : 1.5) * Math.exp(-(t - tign) / 15);   // igniter heat fades after it is removed
      rw = mw > 0 ? Jw0 * A : 0;
      const pv = mv / Math.max(mv0, 1e-12);
      const ashF = 1 / (1 + 3 * ma / Math.max(mc + ma, 1e-9));
      const wetF = 1 / (1 + 4 * mw / m0);

      rc = mc > 0 ? Jc0 * A * Math.pow(1 - pv, 1.2) * ashF : 0;

      if (flame && rv < qmin) { flame = false; flameEnd = t; }
      if (!flame && flameStart !== null && mv > 0.02 * mv0) {

      if (!flame && rc > 0) phase = rv > qmin * 0.3 ? 'smoulder' : 'glow';

    }

      coR = (rv * Cvol * (1 - mceV) + rc * Cchar * (1 - mceC)) / 12 * 28;

      const ch4R = rv * (phase === 'flame' ? 0.0015 : 0.008) + rc * 0.002;

    const T = 25 + 900 * q / (q + 25000);

      flame: flame ? clamp(rv / (Jv0 * g.A), 0, 1.2) : 0, ember: clamp(rc / (Jc0 * g.A * 0.6), 0, 1), smoke: clamp((phase === 'smoulder' ? 0.6 : 0) + (rw > 0 ? 0.3 : 0) + mp.smk * (flame ? 0.4 : 0), 0, 1),

  const fuelDry = dry * fb2;                                              // kg dry fuel consumed (approx.)

    CO2: Math.max(0, E.Cout - E.CO * 12 / 28 - E.CH4 * 12 / 16 - E.PM * 0.6) * 44 / 12 * 1000,
    CO: E.CO * 1000, PM: E.PM * 1000, CH4: E.CH4 * 1000,
    NOx: Nn * conv * 46 / 14 * 1000, SO2: Ss * 0.6 * 64 / 32 * 1000, HCl: Clc * 0.5 * 36.5 / 35.5 * 1000,

  const lam = stove ? 2.0 : 3.5, kC = mp.C / 1200, kH = mp.h / 200, kO = mp.O / 3200, kS = mp.S / 3200, kN = mp.N / 2800;
  const O2st = kC + kH / 2 - kO + kS, air = lam * O2st / 0.21;
  const fco = 1 - mce, gas = { CO2: kC * (1 - fco), H2O: kH + (Mf / (1 - Mf)) / 18, O2: (lam - 1) * O2st + kC * fco / 2, N2: 0.79 * air + kN, CO: kC * fco };
  const tot = Object.values(gas).reduce((a, b) => a + b, 0);
  const flue = {}; for (const k in gas) flue[k] = 100 * gas[k] / tot;

  return {
    series, m0: m0 * 1000, tign, flameStart, flameEnd,
    flameDur: flameStart !== null ? (flameEnd - flameStart) : 0,
    glowDur: Math.max(0, end - (flameEnd || tign)),
    total: end, burnRate: (m0 - mEnd) * 1000 / Math.max((end - tign) / 60, 1e-6),
    peak, residue: 100 * mEnd / (m0 * (1 - Mf)), unburnt: 100 * mc / Math.max(mc0, 1e-12),
    smoke: clamp(100 * (0.6 * smoulderV / Math.max(mv0, 1e-12) + 0.5 * mp.smk + 1.5 * Mf), 0, 100),
    energy: (Eflame + Eglow) / 1e6, mw0,
    em, perMJ, perKg, mce, flue, lam

}

/* ---------- Water boiling test ---------- */
const STOVES = { three:{ n:'Three-stone fire', eta:0.15 }, improved:{ n:'Improved cookstove', eta:0.28 }, charcoal:{ n:'Charcoal stove', eta:0.30 }, gasifier:{ n:'Gasifier stove', eta:0.38 } };
function boilTest(R, stoveId, litres, nBriq) {
  const b = burnSim(R, { setup:'stove', rec: 10, dt: 2, tign: R.tignStove });
  const eta = STOVES[stoveId].eta, mW = litres, UA = 3 + 1.5 * litres;
  const run = (powerAt, tmax) => {
    let T = 25, tb = null; const s = [];
    for (let t = 0; t <= tmax; t += 10) {
      const P = powerAt(t);
      T += (eta * P - UA * (T - 25)) * 10 / (mW * 4186);
      if (T >= 100) { T = 100; if (tb === null) tb = t; }
      if (t % 30 === 0) s.push({ t: t / 60, T });
    }
    return { s, tb };
  };
  const hrrAt = (t) => { const i = Math.min(b.series.length - 1, Math.floor(t / 10)); return nBriq * (b.series[i] ? b.series[i].hrr : 0); };
  const mine = run(hrrAt, Math.max(b.total + 600, 1800));
  const massTot = nBriq * b.m0 / 1000;
  let fuelUsed = null;
  if (mine.tb !== null) { const i = Math.min(b.series.length - 1, Math.floor(mine.tb / 10)); fuelUsed = nBriq * (b.m0 - b.series[i].m); }
  const flat = (lhv, dur) => (t) => t < 300 ? (t / 300) * massTot * lhv * 1e6 / dur : t < dur + 300 ? massTot * lhv * 1e6 / dur : 0;
  const char = run(flat(28.5, 50 * 60), mine.s.length * 30);
  const wood = run(flat(15, 25 * 60), mine.s.length * 30);
  return { mine, char, wood, fuelUsed, sfc: fuelUsed != null ? fuelUsed / litres : null, burn: b, eta };
}

/* ---------- Full evaluation ---------- */
function evaluate(recipe, proc, shape, opt = {}) {
  const mp = mixProps(recipe, proc.pre);
  const geo = shapeGeom(shape);
  const comp = compaction(mp, proc, geo);
  const dry = dryRun(mp, comp, geo, proc, proc.dry, proc.dryH, opt.quick ? 1 : 0.25);
  const RR7 = 1 + 0.15 * comp.spring;
  let rhoDry = comp.rhoS / comp.RR * (1 + dry.Xf) / (1 - dry.shrink) / RR7;
  const Mf = dry.Mf;
  // Calorific values
  const lhvDry = mp.hhv - 2.443 * 8.936 * mp.h / 100;
  const lhvAr = mp.hhv * (1 - Mf) - 2.443 * (Mf + 8.936 * mp.h / 100 * (1 - Mf));
  // Strength
  const rhoSolid = rhoDry / (1 + dry.Xf), Drel = rhoSolid / mp.rt;
  const P = proc.P;
  const bindT = 3.0 * (1 - Math.exp(-mp.Beff / 0.08));
  const natT = 1.5 * (mp.lig / 100) * (P / (P + 20)) + 0.8 * mp.fib * (P / (P + 15));
  const oilF = Math.max(0.4, 1 - 1.5 * mp.oil / 100);
  const gp = grindProps(proc);
  const sizeF = Math.min(2, Math.pow(2 / Math.max(gp.deff, 0.15), 0.3)) * (1 + 1.2 * gp.gain);
  const densF = Math.pow(Drel / 0.55, 2.5);
  const moistF = Mf > 0.10 ? Math.max(0.3, 1 - 2.5 * (Mf - 0.10)) : (Mf < 0.03 ? 0.9 : 1);
  const crackF = 1 - 0.5 * dry.crack / 100;
  const charF = 1 - 0.4 * mp.charFrac;
  let strength = 0.9 * (bindT + natT + 0.05) * oilF * sizeF * densF * moistF * crackF * Math.sqrt(geo.unif) * charF;
  const C = opt.calib || {};
  if (C.density) rhoDry *= C.density;
  if (C.strength) strength *= C.strength;
  const hhv = mp.hhv * (C.hhv || 1), ash = mp.ash * (C.ash || 1);
  const mass = rhoDry * geo.V * 1000;  // g
  const Fmax = strength * 1e6 * geo.Aload;
  const durability = clamp(100 - 55 * Math.exp(-strength / 0.7) * geo.edge, 0, 100);
  const shatter = clamp(100 - 45 * Math.exp(-strength / 0.55) * Math.pow(Math.max(mass, 1) / 100, 0.3) * geo.edge, 0, 100);
  const waterRes = clamp(mp.B > 0.01 ? 100 * (1 - 0.8 * mp.hyg) * (0.6 + 0.4 * Math.min(1, Drel / 0.6)) : 35 + 30 * mp.charFrac, 0, 100);
  // Thermal & ignition
  const th = thermalProps(mp, rhoDry, dry.Xf);
  if (C.k) th.k *= C.k;
  const base = { mp, geo, comp, dry, proc, rhoDry, Mf, lhvDry, lhvAr };
  let tign = ignitionTime(mp, th, Mf, geo, proc) * (C.ignition || 1);
  const tignStove = ignitionTime(mp, th, Mf, geo, Object.assign({}, proc, { setup:'stove' }));
  const R = Object.assign(base, {
    grind: gp, hhv, ash, vm: mp.vm, fc: mp.fc, mass, strength, Fmax, durability, shatter, waterRes, th, tign, tignStove,
    energyMJ: lhvAr * mass / 1000, energyDensity: lhvAr * rhoDry / 1000,
    cost: mp.cost * 1.15 + 0.01, // materials + ~15% processing allowance + energy
  });
  R.costMJ = R.cost / Math.max(lhvAr, 1);
  if (!opt.noBurn) {
    R.burn = burnSim(R, { dt: opt.quick ? 4 : 1, rec: opt.quick ? 20 : 5 });
    if (C.burnRate) R.burn.burnRate *= C.burnRate;
  }
  R.score = qualityScore(R, opt.targets || TARGETS);
  return R;
}

/* ---------- Gas ratings (per MJ of fuel energy) ---------- */
const GAS_INFO = {
  CO2: { n:'Carbon dioxide (CO₂)', good:Infinity, fair:Infinity, what:'Greenhouse gas, but the carbon is biogenic: the plant took it from the air while growing. Counted as close to carbon-neutral when the waste would otherwise rot or be burned in the open.', neutral:true },
  H2O: { n:'Water vapour (H₂O)', good:Infinity, fair:Infinity, what:'Harmless. Comes from moisture and from hydrogen in the fuel.', neutral:true },
  CO:  { n:'Carbon monoxide (CO)', good:3.0, fair:6.0, what:'Toxic gas from incomplete burning. Cook with good ventilation or a chimney.' },
  PM:  { n:'Fine smoke particles (PM2.5)', good:0.25, fair:0.6, what:'Smoke that harms lungs and eyes. Rises sharply when the briquette smoulders or is wet.' },
  CH4: { n:'Methane (CH₄)', good:0.2, fair:0.5, what:'Strong greenhouse gas released mainly while smouldering.' },
  NOx: { n:'Nitrogen oxides (NOx)', good:0.10, fair:0.25, what:'Irritating gases from nitrogen (protein) in the fuel. Seeds and oil cakes give more than wood.' },
  SO2: { n:'Sulphur dioxide (SO₂)', good:0.03, fair:0.10, what:'Acidic, irritating gas from sulphur in the fuel. Most biomass is low.' },
  HCl: { n:'Hydrogen chloride (HCl)', good:0.02, fair:0.06, what:'Corrosive gas from chlorine (salts) in the fuel. Corrodes stoves and chimneys.' },
};
function gasStatus(k, perMJ) { const g = GAS_INFO[k]; if (g.neutral) return 'na'; return perMJ <= g.good ? 'good' : perMJ <= g.fair ? 'fair' : 'poor'; }
function airQuality(b) {
  const ks = ['CO', 'PM', 'NOx', 'SO2', 'HCl', 'CH4'], st = {}; ks.forEach(k => st[k] = gasStatus(k, b.perMJ[k]));
  const worst = ks.map(k => [k, b.perMJ[k] / GAS_INFO[k].fair]).sort((a, b2) => b2[1] - a[1])[0][0];
  const nFair = ks.filter(k => st[k] === 'fair').length, anyPoor = ks.some(k => st[k] === 'poor');
  return { st: (st.CO === 'poor' || st.PM === 'poor') ? 'poor' : anyPoor || nFair >= 3 ? 'fair' : 'good', worst };
}

/* ---------- Status vs targets ---------- */
function metricValue(R, key) {
  switch (key) {
    case 'hhv': return R.hhv; case 'moisture': return R.Mf * 100; case 'density': return R.rhoDry;
    case 'strength': return R.strength; case 'durability': return R.durability; case 'shatter': return R.shatter;
    case 'ash': return R.ash; case 'ignition': return R.tign; case 'crack': return R.dry.crack;
  }
}
function statusOf(key, v, targets = TARGETS) {
  const T = targets[key]; if (!T || v == null || isNaN(v)) return 'na';
  if (T.dir > 0) return v >= T.good ? 'good' : v >= T.min ? 'fair' : 'poor';
  return v <= T.good ? 'good' : v <= T.max ? 'fair' : 'poor';
}
function qualityScore(R, targets) {
  const w = { hhv:1.2, moisture:0.6, density:1, strength:1.2, durability:1, shatter:0.6, ash:0.8, ignition:0.6, crack:1 };
  let s = 0, ws = 0;
  for (const k in w) {
    const T = targets[k], v = metricValue(R, k);
    let x;
    if (T.dir > 0) { const lo = T.min * 0.6; x = (v - lo) / (T.good - lo); }
    else { const hi = T.max * 1.6; x = (hi - v) / (hi - T.good); }
    s += w[k] * clamp(x, 0, 1); ws += w[k];
  }
  return Math.round(100 * s / ws);
}

/* ---------- Shape recommendation ---------- */
const GOALS = {
  allround: { n:'All-round home cooking', w:{ power:.12, burn:.15, ign:.15, dur:.15, crack:.12, dry:.10, make:.12, fit:.09 } },
  fast:     { n:'Fast, hot cooking fire', w:{ power:.30, ign:.25, dur:.10, crack:.10, dry:.10, make:.10, fit:.05 } },
  long:     { n:'Long, steady burn',      w:{ burn:.35, steady:.10, ign:.05, dur:.15, crack:.10, make:.10, fit:.10, dry:.05 } },
  strong:   { n:'Strongest for transport',w:{ dur:.40, crack:.20, unif:.15, make:.15, fit:.10 } },
  easy:     { n:'Easiest to make by hand', w:{ make:.35, crack:.25, dry:.20, unif:.10, dur:.10 } },
};
function candidateShapes(base) {
  const out = [];
  const push = (o) => out.push(Object.assign({}, base, o));
  for (let D = 30; D <= 100; D += 5) for (const r of [0.3, 0.45, 0.6, 0.8, 1.0, 1.25]) {
    const H = Math.round(D * r);
    push({ type:'cyl', D, H });
    for (const f of [0.18, 0.28]) push({ type:'cylHole', D, H, d: Math.round(D * f) });
    if (D >= 50) for (const nh of [7, 12]) { const k = nh === 7 ? 3 : 4; const d = Math.round(D * (nh === 7 ? 0.14 : 0.10)); if ((D - k * d) / (k + 1) >= 3) push({ type:'multiHole', D, H, d, nh }); }
    if (D <= 85) push({ type:'hexHole', D, H, d: Math.round(D * 0.22) });
  }
  for (let L = 40; L <= 140; L += 10) for (const wr of [0.5, 0.7]) for (const hr of [0.3, 0.5]) push({ type:'brick', L, W: Math.round(L * wr), H: Math.round(L * hr) });
  for (let a = 25; a <= 80; a += 5) push({ type:'cube', a });
  for (let L = 35; L <= 90; L += 5) push({ type:'pillow', L, W: Math.round(L * 0.75), H: Math.round(L * 0.45) });
  for (let D = 25; D <= 80; D += 5) push({ type:'sphere', D });
  return out;
}
function recommendShapes(recipe, proc, baseShape, goalId, calib) {
  const goal = GOALS[goalId].w;
  const cands = candidateShapes(baseShape).map(sh => {
    const geo = shapeGeom(sh); if (!geo.valid) return null;
    const R = evaluate(recipe, proc, sh, { quick: true, calib });
    if (R.mass < 40 || R.mass > 500) return null;
    const b = R.burn;
    return { sh, R, m: {
      power: b.peak / Math.max(R.mass, 1), burn: b.total / 60, ign: R.tign, dur: R.durability, crack: R.dry.crack,
      dry: R.dry.t10 != null ? R.dry.t10 : proc.dryH * 1.5, make: geo.make, fit: geo.fit, unif: geo.unif,
      steady: b.glowDur / Math.max(b.total, 1) } };
  }).filter(Boolean);
  const keys = ['power','burn','ign','dur','crack','dry','make','fit','unif','steady'];
  const lowerBetter = { ign:1, crack:1, dry:1 };
  const rng = {};
  for (const k of keys) { const v = cands.map(c => c.m[k]); rng[k] = [Math.min(...v), Math.max(...v)]; }
  for (const c of cands) {
    let s = 0, ws = 0;
    for (const k in goal) {
      const [lo, hi] = rng[k]; let x = hi > lo ? (c.m[k] - lo) / (hi - lo) : 0.5;
      if (lowerBetter[k]) x = 1 - x;
      s += goal[k] * x; ws += goal[k];
    }
    c.score = Math.round(100 * s / ws);
  }
  cands.sort((a, b) => b.score - a.score);
  const bestByType = {};
  for (const c of cands) if (!bestByType[c.sh.type]) bestByType[c.sh.type] = c;
  return { cands, bestByType, rng };
}

/* ---------- Mix optimiser (random search on the simplex) ---------- */
function optimiseMix(ids, bounds, proc, shape, weights, calib, n = 2500) {
  const rnd = () => -Math.log(Math.random() + 1e-12);
  const res = [];
  for (let i = 0; i < n; i++) {
    let w = ids.map(() => rnd());
    const s = w.reduce((a, b) => a + b, 0); w = w.map(x => 100 * x / s);
    // apply bounds by clamping then renormalising a few times
    for (let it = 0; it < 6; it++) {
      w = w.map((x, j) => clamp(x, bounds[j][0], bounds[j][1]));
      const t = w.reduce((a, b) => a + b, 0); w = w.map(x => 100 * x / t);
    }
    if (w.some((x, j) => x < bounds[j][0] - 0.6 || x > bounds[j][1] + 0.6)) continue;
    const recipe = ids.map((id, j) => ({ id, pct: w[j] }));
    const R = evaluate(recipe, proc, shape, { quick: true, noBurn: true, calib });
    res.push({ recipe, R, m: { hhv: R.hhv, strength: R.strength, ash: R.ash, crack: R.dry.crack, cost: R.cost, waste: R.mp.wasteShare * 100, durability: R.durability } });
  }
  const keys = ['hhv','strength','ash','crack','cost','waste','durability'];
  const lower = { ash:1, crack:1, cost:1 };
  const rng = {};
  for (const k of keys) { const v = res.map(r => r.m[k]); rng[k] = [Math.min(...v), Math.max(...v)]; }
  for (const r of res) {
    let s = 0, ws = 0;
    for (const k in weights) { if (!weights[k]) continue; const [lo, hi] = rng[k]; let x = hi > lo ? (r.m[k] - lo) / (hi - lo) : .5; if (lower[k]) x = 1 - x; s += weights[k] * x; ws += weights[k]; }
    r.score = ws ? 100 * s / ws : 0;
  }
  res.sort((a, b) => b.score - a.score);
  return res;
}

/* ---------- 1-D transient conduction through a disc ---------- */
function conductionSim(k, rho, cp, L, Th, Tc, T0, tEnd, N = 40) {
  const dx = L / (N - 1), alpha = k / (rho * cp);
  const dt = Math.min(0.4 * dx * dx / alpha, tEnd / 400);
  let T = new Array(N).fill(T0); T[0] = Th; T[N - 1] = Tc;
  const frames = []; let t = 0, tss = null;
  const qss = k * (Th - Tc) / L;
  const snapEvery = tEnd / 120;
  let nextSnap = 0;
  while (t <= tEnd) {
    if (t >= nextSnap) { const qc = k * (T[N - 2] - T[N - 1]) / dx; frames.push({ t, T: T.slice(), qc }); nextSnap += snapEvery;
      if (tss === null && qc >= 0.95 * qss) tss = t; }
    const Tn = T.slice();
    for (let i = 1; i < N - 1; i++) Tn[i] = T[i] + alpha * dt / (dx * dx) * (T[i + 1] - 2 * T[i] + T[i - 1]);
    T = Tn; t += dt;
  }
  return { frames, qss, tss, alpha };
}

/* ============================================================
   Tiny SVG chart kit: line, bars, stacked bar, heatmap, scatter
   Hover tooltips on every chart. Re-renders on resize.
   ============================================================ */
const Chart = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const SEQ = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
  let tip;
  const ensureTip = () => {
    if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; document.body.appendChild(tip); }
    return tip;
  };
  const showTip = (html, ev) => {
    const t = ensureTip(); t.innerHTML = html; t.style.display = 'block';
    const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
    if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  };
  const hideTip = () => { if (tip) tip.style.display = 'none'; };
  const el = (tag, attrs = {}, parent) => {

    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const nice = (lo, hi, n = 5) => {
    if (hi === lo) { hi = lo + 1; }
    const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const r = step0 / mag, step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
    const ticks = []; for (let v = a; v <= b + step * 0.001; v += step) ticks.push(+v.toFixed(10));
    return { lo: a, hi: b, ticks, step };
  };
  const fmtDefault = (v) => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Math.abs(v) >= 10 ? (+v.toFixed(1)).toString() : (+v.toFixed(2)).toString();
  const observe = (node, render) => {
    if (node._ro) node._ro.disconnect();
    let lastW = node.clientWidth;
    node._ro = new ResizeObserver(() => { const w = node.clientWidth; if (Math.abs(w - lastW) > 2) { lastW = w; render(); } });

    '<div class="legend">' + series.map(s => `<span class="lg"><i style="background:${s.color}${s.dash ? ';background:repeating-linear-gradient(90deg,' + s.color + ' 0 4px,transparent 4px 7px)' : ''}"></i>${s.name}</span>`).join('') + '</div>';

  /* ---------- LINE ---------- */
  function line(node, cfg) {
    const render = () => {
      const W = Math.max(260, node.clientWidth), H = cfg.height || 220;
      const m = { l: 52, r: 18, t: 12, b: cfg.xLabel ? 40 : 26 };
      const all = cfg.series.flatMap(s => s.data);
      if (!all.length) { node.innerHTML = '<div class="empty">No data</div>'; return; }
      const xs = all.map(d => d[0]), ys = all.map(d => d[1]);
      const X = nice(cfg.xMin ?? Math.min(...xs), cfg.xMax ?? Math.max(...xs), 6);

      const Y = nice(cfg.yMin ?? Math.min(0, ...ys), cfg.yMax ?? Math.max(...ys), 4);

      const sy = (v) => H - m.b - (v - Y.lo) / (Y.hi - Y.lo || 1) * (H - m.t - m.b);
      node.innerHTML = legendHTML(cfg.series);
      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': cfg.title || 'chart' }, node);
      const fx = cfg.xFmt || fmtDefault, fy = cfg.yFmt || fmtDefault;
      for (const b of (cfg.bands || [])) {
        const y0 = sy(Math.min(Y.hi, b.y1)), y1 = sy(Math.max(Y.lo, b.y0));
        el('rect', { x: m.l, y: y0, width: W - m.l - m.r, height: Math.max(0, y1 - y0), fill: b.color || 'rgba(12,163,12,.08)' }, svg);
        if (b.label) { const t = el('text', { x: W - m.r - 4, y: y0 + 13, 'text-anchor': 'end', class: 'ax band-l' }, svg); t.textContent = b.label; }
      }
      for (const v of Y.ticks) {
        el('line', { x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), class: v === Y.lo ? 'base' : 'grid' }, svg);
        const t = el('text', { x: m.l - 8, y: sy(v) + 4, 'text-anchor': 'end', class: 'ax' }, svg); t.textContent = fy(v);
      }
      const xt = X.ticks.filter(v => v >= X.lo - 1e-9 && v <= X.hi + 1e-9);
      for (const v of xt) { const t = el('text', { x: sx(v), y: H - m.b + 16, 'text-anchor': 'middle', class: 'ax' }, svg); t.textContent = fx(v); }
      if (cfg.xLabel) { const t = el('text', { x: m.l + (W - m.l - m.r) / 2, y: H - 4, 'text-anchor': 'middle', class: 'ax-l' }, svg); t.textContent = cfg.xLabel; }
      if (cfg.yLabel) { const t = el('text', { x: 12, y: m.t + (H - m.t - m.b) / 2, transform: `rotate(-90 12 ${m.t + (H - m.t - m.b) / 2})`, 'text-anchor': 'middle', class: 'ax-l' }, svg); t.textContent = cfg.yLabel; }
      for (const mk of (cfg.markers || [])) {

        const t = el('text', { x: sx(mk.x) + 4, y: m.t + 11 + (mk.row || 0) * 13, class: 'mk-l' }, svg); t.textContent = mk.label;

      for (const s of cfg.series) {

        if (s.area) el('path', { d: d + `L${sx(s.data[s.data.length - 1][0])} ${sy(Y.lo)}L${sx(s.data[0][0])} ${sy(Y.lo)}Z`, fill: s.color, opacity: 0.10 }, svg);

        if (s.points) for (const p of s.data) el('circle', { cx: sx(p[0]), cy: sy(p[1]), r: 4, fill: s.color, stroke: '#fff', 'stroke-width': 2 }, svg);
      }
      for (const p of (cfg.dots || [])) {
        el('circle', { cx: sx(p.x), cy: sy(p.y), r: 6, fill: p.color || '#1d6b50', stroke: '#fff', 'stroke-width': 2 }, svg);

  inp.addEventListener('input', () => { let v = fromPos(inp.value); if (o.round) v = o.round(v); setRangeFill(inp); show(v); o.onInput(v); });
  parent.appendChild(w);
  return { set, el: w, input: inp, setHint: (t) => { const h = w.querySelector('.hint'); if (h) h.innerHTML = t; } };
}
function seg(parent, o) {
  const w = node(`<div class="ctl">${o.label ? `<div class="ctl-h"><label>${o.label}</label></div>` : ''}<div class="seg-ctl ${o.full ? 'full' : ''}" role="group" aria-label="${o.label || ''}"></div>${o.hint ? `<div class="hint">${o.hint}</div>` : ''}</div>`);
  const box = w.querySelector('.seg-ctl');

  const set = (v) => btns.forEach(([bv, b]) => { b.classList.toggle('on', bv === v); b.setAttribute('aria-pressed', bv === v); });

}
function kpi(label, value, unit, st, note) {

/* ---------- grinding control (used in Mix designer and Compaction) ---------- */
function grindControls(parent) {
  const w = node('<div></div>'); parent.appendChild(w);
  let info, vis;
  const chips = (label, val, onPick, hint) => {
    const c = node(`<div class="ctl"><div class="ctl-h"><label>${label}</label><span class="val">${val} mm<small>mesh ${meshOf(val)}</small></span></div><div class="sieves" role="group" aria-label="${label}"></div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`);
    const box = c.querySelector('.sieves');
    for (const [d] of SIEVES) { const b = node(`<button type="button" class="sv ${d === val ? 'on' : ''}" aria-pressed="${d === val}" title="Sieve mesh ${meshOf(d)}">${d}</button>`); b.addEventListener('click', () => onPick(d)); box.appendChild(b); }
    w.appendChild(c);
  };
  const render = () => {
    w.innerHTML = '';
    seg(w, { label:'Grinding', full:true, options:[['one','One size'],['two','Two sizes mixed']], value:S.proc.grind, onChange: v => { S.proc.grind = v; render(); recompute(); } });
    if (S.proc.grind !== 'two') {
      chips('Sieve size (particles pass)', S.proc.size, d => { S.proc.size = d; render(); recompute(); }, 'Sizes in mm. Your report uses 2 mm (mesh 10).');
    } else {
      chips('Fine part', S.proc.fine, d => { S.proc.fine = d; if (S.proc.coarse <= d) S.proc.coarse = SIEVES[Math.min(SIEVES.length - 1, SIEVES.findIndex(s => s[0] === d) + 2)][0]; render(); recompute(); });
      chips('Coarse part', S.proc.coarse, d => { S.proc.coarse = d; if (S.proc.fine >= d) S.proc.fine = SIEVES[Math.max(0, SIEVES.findIndex(s => s[0] === d) - 2)][0]; render(); recompute(); });
      const sl = slider(w, { label:'Fine part share', min:10, max:90, step:5, value:Math.round(S.proc.fineShare * 100), unit:'%', onInput: v => { S.proc.fineShare = v / 100; drawVis(); recompute(); } });
      vis = node('<div class="pack-vis" aria-hidden="true"></div>'); w.appendChild(vis);
      const best = node('<button type="button" class="btn small" style="margin-top:6px">Use the best share (35% fine)</button>');
      best.addEventListener('click', () => { S.proc.fineShare = 0.35; sl.set(35); drawVis(); recompute(); }); w.appendChild(best);
      drawVis();
    }
    info = node('<div class="note" style="margin-top:10px;font-size:13px"></div>'); w.appendChild(info);
    update();
  };
  function drawVis() {
    if (!vis) return;
    const df = Math.min(S.proc.fine, S.proc.coarse), dc = Math.max(S.proc.fine, S.proc.coarse), f = S.proc.fineShare;
    const W = 320, rc = 10, rh = rc * Math.sqrt(3), rows = 3, H = Math.round(2 * rc + (rows - 1) * rh + 2);
    const rf = clamp(rc * df / dc, 1.3, rc * 0.7);
    let s = 9; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const fillGap = Math.min(1, f / 0.35), dropCoarse = Math.max(0, (f - 0.45) / 0.55);
    let coarse = '', fines = '';
    for (let j = 0; j < rows; j++) {
      const y = rc + 1 + j * rh, off = (j % 2) * rc;
      for (let x = rc + off; x < W + rc; x += 2 * rc) {
        if (rnd() < dropCoarse) { for (let k = 0; k < 4; k++) fines += `<circle cx="${(x + (rnd() - .5) * rc * 1.2).toFixed(1)}" cy="${(y + (rnd() - .5) * rc * 1.2).toFixed(1)}" r="${rf}" fill="#e0a83a"/>`; }
        else coarse += `<circle cx="${x}" cy="${y.toFixed(1)}" r="${rc - 0.4}" fill="#7a5538"/>`;
        if (j < rows - 1) {
          if (rnd() < fillGap) fines += `<circle cx="${x + rc}" cy="${(y + rh / 3).toFixed(1)}" r="${rf}" fill="#e0a83a"/>`;
          if (rnd() < fillGap) fines += `<circle cx="${x + (off ? 0 : 2 * rc)}" cy="${(y + 2 * rh / 3).toFixed(1)}" r="${rf}" fill="#e0a83a"/>`;
        }
      }
    }
    vis.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:90px">${coarse}${fines}</svg>
      <div class="pack-l"><span><i style="background:#7a5538"></i>Coarse ${dc} mm</span><span><i style="background:#e0a83a"></i>Fine ${df} mm fills the gaps${rf > rc * 0.3 ? ' (too big to fit well)' : ''}</span></div>`;
  }
  function update() {
    if (!info || !S.R) return;
    const g = S.R.grind;
    info.innerHTML = g.two
      ? `Effective size <b>${f2(g.deff)} mm</b>. Packing boost <b>+${f1(g.gain * 100)}%</b>${g.gain < 0.03 ? (g.r > 0.3 ? ' (pick sizes further apart: coarse at least 4× fine)' : ' (try about 35% fine)') : ''}. Grinding effort <b>×${f1(g.effort)}</b> compared with 2 mm.`
      : `Grinding effort <b>×${f1(g.effort)}</b> compared with 2 mm. Finer powder binds better but takes longer to grind. Mixing a fine and a coarse size packs denser.`;
  }
  render();
  return { update };
}

/* ---------- colours of the mix ---------- */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r) { return '#' + r.map(x => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function mixColor(recipe, pre) {
  let acc = [0, 0, 0], tot = 0;
  for (const r of recipe) { const m = getMat(r.id); const c = hexToRgb(m.col).map(x => Math.pow(x / 255, 2.2)); acc = acc.map((a, i) => a + c[i] * r.pct); tot += r.pct; }
  let c = acc.map(a => Math.pow(a / (tot || 1), 1 / 2.2) * 255);
  if (pre === 'carbonized') c = c.map(x => x * 0.22 + 18);
  else if (pre === 'torrefied') c = c.map(x => x * 0.6);
  return rgbToHex(c);
}
function shade(hex, f) { return rgbToHex(hexToRgb(hex).map(x => f > 0 ? x + (255 - x) * f : x * (1 + f))); }

/* ---------- recipe editing ---------- */
function markCustom() { if (PRESETS.some(p => p.name === S.name) || S.name === 'Optimised blend') S.name = 'My mix'; }
function setPct(i, v) {
  markCustom();
  const r = S.recipe;
  v = clamp(v, 0, 100);
  const others = r.map((x, j) => j).filter(j => j !== i);
  const lockedSum = others.filter(j => r[j].lock).reduce((s, j) => s + r[j].pct, 0);
  const free = others.filter(j => !r[j].lock);
  v = Math.min(v, 100 - lockedSum);
  if (!free.length) v = 100 - lockedSum;
  const rest = 100 - lockedSum - v;
  const freeSum = free.reduce((s, j) => s + r[j].pct, 0);
  free.forEach(j => { r[j].pct = freeSum > 0 ? r[j].pct / freeSum * rest : rest / free.length; });
  r[i].pct = v;
}
function normalise() { const t = S.recipe.reduce((s, r) => s + r.pct, 0) || 1; S.recipe.forEach(r => r.pct = r.pct * 100 / t); }
function loadRecipe(items, name) {
  S.recipe = items.map(([id, pct]) => ({ id, pct, lock: false }));
  if (name) S.name = name;
  normalise();
}

function adviceFor(R) {
  const T = targets(), tips = [];
  const quick = (mut) => { const s = JSON.parse(JSON.stringify({ recipe:S.recipe, proc:S.proc, shape:S.shape })); mut(s); return evaluate(s.recipe, s.proc, s.shape, { quick:true, noBurn:true, calib:S.calib }); };
  if (R.dry.crack > T.crack.max) {
    const a = quick(s => { s.proc.dry = 'shade'; s.proc.dryH = 96; });
    const holeable = S.shape.type === 'cyl';
    const b = holeable ? quick(s => { s.shape.type = 'cylHole'; s.shape.d = Math.round(s.shape.D * 0.25); }) : null;
    const main = S.recipe.slice().sort((x, y) => y.pct - x.pct)[0];
    const c = quick(s => { const m = s.recipe.find(r => r.id === main.id); const take = Math.min(10, m.pct - 5); m.pct -= take; const f = s.recipe.find(r => r.id === 'palm_fibre'); if (f) f.pct += take; else s.recipe.push({ id:'palm_fibre', pct:take }); });
    tips.push({ t:'bad', h:`Crack risk is high (${f0(R.dry.crack)}%).`, b:`Shade drying would bring it to ${f0(a.dry.crack)}%${b ? `, a centre hole to ${f0(b.dry.crack)}%` : ''}, and swapping 10% of ${getMat(main.id).n.toLowerCase()} for date palm fibre to ${f0(c.dry.crack)}%.` });
  }
  if (R.strength < T.strength.min) {
    const a = quick(s => { const bi = s.recipe.find(r => isBinder(getMat(r.id))); if (bi) { bi.pct += 5; } else s.recipe.push({ id:'wheat_flour', pct:8 }); const t = s.recipe.reduce((q, r) => q + r.pct, 0); s.recipe.forEach(r => r.pct = r.pct * 100 / t); });
    const b = quick(s => { s.proc.grind = 'one'; s.proc.size = Math.min(s.proc.size, 1); });
    const c = quick(s => { s.proc.grind = 'two'; s.proc.fine = 0.5; s.proc.coarse = 2; s.proc.fineShare = 0.35; });
    tips.push({ t:'bad', h:`Too weak to handle (${f2(R.strength)} MPa).`, b:`More binder (+5%) gives ${f2(a.strength)} MPa; grinding to under 1 mm gives ${f2(b.strength)} MPa; mixing 35% fine (0.5 mm) with 65% coarse (2 mm) gives ${f2(c.strength)} MPa.` });
  } else if (R.strength < T.strength.good) {
    tips.push({ t:'warn', h:`Strength is acceptable but not high (${f2(R.strength)} MPa).`, b:'Finer particles, a longer hold time or a little more binder will make it tougher for transport.' });
  }
  if (!R.grind.two && R.strength < T.strength.good * 1.6) {
    const c = quick(s => { s.proc.grind = 'two'; s.proc.fine = 0.5; s.proc.coarse = Math.max(2, s.proc.size); s.proc.fineShare = 0.35; });
    if (c.strength > R.strength * 1.05) tips.push({ t:'warn', h:'Try mixing two grind sizes.', b:`About 35% fine powder (0.5 mm) with 65% coarse (${Math.max(2, S.proc.size)} mm) packs tighter: density ${f0(c.rhoDry)} kg/m³ and strength ${f2(c.strength)} MPa instead of ${f0(R.rhoDry)} and ${f2(R.strength)}.` });
  }
  if (R.comp.squeezed > 0.03) tips.push({ t:'warn', h:'Water is being squeezed out of the mould.', b:`About ${f0(R.comp.squeezed * R.mass / (1 + R.comp.X))} g per briquette. The mix is wetter than it needs to be; use a thicker binder paste.` });
  if (R.comp.M0 - R.mp.Mopt > 0.08) tips.push({ t:'warn', h:`The mix is wet (${f0(R.comp.M0 * 100)}% moisture).`, b:'Wet mixes shrink more while drying, which causes cracks. Cook the paste thicker or pre-dry the mix for an hour.' });
  if (R.Mf > T.moisture.max / 100) tips.push({ t:'warn', h:`Not dry enough yet (${f1(R.Mf * 100)}% after ${S.proc.dryH} h).`, b:`Dry longer, or use a warmer method. It reaches 10% after ${fmtHours(R.dry.t10)}.` });
  if (R.ash > T.ash.max) tips.push({ t:'bad', h:`High ash (${f1(R.ash)}%).`, b:'Ash lowers the useful heat and leaves residue. Add low-ash materials such as date seed, sawdust or coconut shell.' });
  if (R.tign > T.ignition.max) tips.push({ t:'warn', h:`Hard to light (${f0(R.tign)} s).`, b: R.mp.charFrac > 0.3 ? 'Charred briquettes have little volatile matter. Use a fire-starter or add 10–20% raw sawdust.' : 'Add a quick-burning material (sawdust, coffee grounds) or lower the density.' });
  if (R.mp.oil > 6 && R.strength < T.strength.good) tips.push({ t:'warn', h:`Oil content is ${f1(R.mp.oil)}%.`, b:'Seed oils coat particles and weaken binding. Some teams de-oil date seeds or add a fibrous material.' });
  if (R.mp.hyg > 0.8 && R.mp.B > 0.03) tips.push({ t:'warn', h:'The binder absorbs moisture from humid air.', b:'Sugary binders (date syrup, molasses) soften in humidity. Store the briquettes in sealed bags.' });
  { const aq = airQuality(R.burn);
    if (aq.st === 'poor') tips.push({ t:'bad', h:`Smoky or high in harmful gases (${GAS_INFO[aq.worst].n}).`, b: S.proc.setup === 'open' ? 'Most smoke and CO come from smouldering in open air. Burn in a stove with other briquettes and make sure they are fully dry.' : 'Dry the briquettes fully, lower oily or high-nitrogen ingredients, and burn with plenty of air.' });
    else if (gasStatus('NOx', R.burn.perMJ.NOx) !== 'good') tips.push({ t:'warn', h:`NOx is ${gasStatus('NOx', R.burn.perMJ.NOx) === 'poor' ? 'high' : 'moderate'} (fuel nitrogen ${f2(R.mp.N)}%).`, b:'Seeds and flours contain protein, which turns into NOx. Mixing in low-nitrogen material (sawdust, palm fibre, coconut shell) lowers it.' });
    if (gasStatus('HCl', R.burn.perMJ.HCl) === 'poor') tips.push({ t:'warn', h:'High chlorine.', b:`Fuel chlorine ${f2(R.mp.Cl)}% forms HCl, which corrodes stoves. Palm leaflets, molasses and banana peel are high; use less of them.` }); }
  if (R.mp.estShare > 0.15) tips.push({ t:'warn', h:'Some ingredient values are estimates.', b:'Materials marked "est." use values from similar materials. Check them with your own lab tests.' });
  if (!tips.some(t => t.t === 'bad')) tips.unshift({ t:'ok', h:'This recipe meets the main targets.', b:`Quality score ${R.score}/100. Run the test lab to confirm with real measurements.` });
  return tips;
}

function shapeSVG(sh, col, W = 300, H = 210, labels = true, cracks = 0) {
  const t = sh.type, light = shade(col, 0.18), lighter = shade(col, 0.32), dark = shade(col, -0.35), darker = shade(col, -0.6);
  const gid = 'g' + Math.random().toString(36).slice(2, 7);
  let body = '', lab = '';
  const defs = `<defs><linearGradient id="${gid}s" x1="0" x2="1"><stop offset="0" stop-color="${dark}"/><stop offset=".35" stop-color="${light}"/><stop offset="1" stop-color="${darker}"/></linearGradient>
    <radialGradient id="${gid}r" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${lighter}"/><stop offset=".6" stop-color="${col}"/><stop offset="1" stop-color="${darker}"/></radialGradient></defs>`;
  const txt = (x, y, s, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12" fill="#52514e" font-family="Archivo, sans-serif">${s}</text>`;
  const crackPaths = (cx, cy, rx, ry) => {
    if (cracks < 8) return '';
    let s = '', seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const n = Math.round(cracks / 9);
    for (let i = 0; i < n; i++) { let a = rnd() * Math.PI * 2, r = rnd() * 0.3; let x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r; let d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
      const len = 3 + Math.round(cracks / 18); for (let k = 0; k < len; k++) { a += (rnd() - 0.5) * 1.3; const st = rx * 0.12; x += Math.cos(a) * st; y += Math.sin(a) * st * (ry / rx); if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 > 0.92) break; d += `L${x.toFixed(1)} ${y.toFixed(1)}`; }
      s += `<path d="${d}" stroke="${darker}" stroke-width="${1.3 + cracks / 45}" fill="none" stroke-linecap="round" opacity=".9"/>`; }
    return s;
  };
  if (['cyl', 'cylHole', 'multiHole'].includes(t)) {
    const D = sh.D, h = sh.H, s = Math.min((W - 90) / D, (H - 56) / (h + D * 0.38));
    const rx = D * s / 2, ry = rx * 0.38, bh = h * s, cx = W / 2, ty = (H - (bh + 2 * ry)) / 2 + ry;
    body += `<path d="M${cx - rx} ${ty}L${cx - rx} ${ty + bh}A${rx} ${ry} 0 0 0 ${cx + rx} ${ty + bh}L${cx + rx} ${ty}Z" fill="url(#${gid}s)"/>`;
    body += `<ellipse cx="${cx}" cy="${ty}" rx="${rx}" ry="${ry}" fill="${light}"/>`;
    body += crackPaths(cx, ty, rx, ry);
    if (t === 'cylHole') { const r = Math.min(sh.d, D * 0.6) / D; body += `<ellipse cx="${cx}" cy="${ty}" rx="${rx * r}" ry="${ry * r}" fill="${darker}"/><path d="M${cx - rx * r} ${ty}A${rx * r} ${ry * r} 0 0 1 ${cx + rx * r} ${ty}" stroke="${dark}" stroke-width="2" fill="none"/>`; }
    if (t === 'multiHole') {
      const n = sh.nh <= 9 ? 7 : sh.nh <= 15 ? 12 : 19, k = n === 7 ? 3 : n === 12 ? 4 : 5, p = (D - k * sh.d) / (k + 1) + sh.d;
      const pts = [];
      if (n === 7) { pts.push([0, 0]); for (let i = 0; i < 6; i++) pts.push([Math.cos(i * Math.PI / 3) * p, Math.sin(i * Math.PI / 3) * p]); }
      else if (n === 12) { for (let i = 0; i < 4; i++) pts.push([Math.cos(i * Math.PI / 2 + Math.PI / 4) * p * 0.6, Math.sin(i * Math.PI / 2 + Math.PI / 4) * p * 0.6]); for (let i = 0; i < 8; i++) pts.push([Math.cos(i * Math.PI / 4) * p * 1.42, Math.sin(i * Math.PI / 4) * p * 1.42]); }
      else { pts.push([0, 0]); for (let i = 0; i < 6; i++) pts.push([Math.cos(i * Math.PI / 3) * p, Math.sin(i * Math.PI / 3) * p]); for (let i = 0; i < 12; i++) pts.push([Math.cos(i * Math.PI / 6) * p * 1.9, Math.sin(i * Math.PI / 6) * p * 1.9]); }
      for (const [x, y] of pts) body += `<ellipse cx="${cx + x * s}" cy="${ty + y * s * 0.38}" rx="${sh.d * s / 2}" ry="${sh.d * s / 2 * 0.38}" fill="${darker}"/>`;
    }
    if (labels) lab += txt(cx, ty + bh + ry + 22, `Ø ${D} mm`) + txt(cx + rx + 10, ty + bh / 2 + 4, `${h} mm`, 'start') + (t === 'cylHole' ? txt(cx, ty - ry - 8, `hole Ø ${sh.d} mm`) : t === 'multiHole' ? txt(cx, ty - ry - 8, `${sh.nh <= 9 ? 7 : sh.nh <= 15 ? 12 : 19} holes, Ø ${sh.d} mm`) : '');
  } else if (t === 'hexHole') {
    const D = sh.D, h = sh.H, Rv = D / Math.sqrt(3), s = Math.min((W - 90) / (2 * Rv), (H - 56) / (h + 2 * Rv * 0.42));
    const cx = W / 2, ty = (H - (h * s + 2 * Rv * s * 0.42)) / 2 + Rv * s * 0.42, k = 0.42;
    const V = [...Array(6)].map((_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return [cx + Math.cos(a) * Rv * s, ty + Math.sin(a) * Rv * s * k]; });
    const bh = h * s;
    for (let i = 0; i < 6; i++) { const a = V[i], b = V[(i + 1) % 6]; if ((a[1] + b[1]) / 2 < ty - 0.1) continue;
      const shadeF = (a[0] + b[0]) / 2 < cx - 2 ? light : (a[0] + b[0]) / 2 > cx + 2 ? darker : col;
      body += `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}L${b[0]} ${b[1] + bh}L${a[0]} ${a[1] + bh}Z" fill="${shadeF}" stroke="${dark}" stroke-width=".6"/>`; }
    body += `<path d="${V.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('')}Z" fill="${lighter}" stroke="${dark}" stroke-width=".6"/>`;
    const r = Math.min(sh.d, D * 0.6) / 2 * s; body += `<ellipse cx="${cx}" cy="${ty}" rx="${r}" ry="${r * k}" fill="${darker}"/>`;
    if (labels) lab += txt(cx, ty + bh + Rv * s * k + 22, `${D} mm across flats`) + txt(cx + Rv * s + 10, ty + bh / 2 + 4, `${h} mm`, 'start');
  } else if (t === 'brick' || t === 'cube') {
    const L = t === 'cube' ? sh.a : sh.L, Wd = t === 'cube' ? sh.a : sh.W, h = t === 'cube' ? sh.a : sh.H;
    const c30 = Math.cos(Math.PI / 6), s30 = 0.5;
    const s = Math.min((W - 80) / ((L + Wd) * c30), (H - 50) / ((L + Wd) * s30 + h));
    const P = (x, y, z) => [W / 2 + (x - y) * c30 * s, (H - ((L + Wd) * s30 + h) * s) / 2 + h * s + (x + y) * s30 * s - z * s];
    const poly = (pts, f) => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')}Z" fill="${f}" stroke="${dark}" stroke-width=".7" stroke-linejoin="round"/>`;
    body += poly([P(0, Wd, 0), P(L, Wd, 0), P(L, Wd, h), P(0, Wd, h)], light);
    body += poly([P(L, 0, 0), P(L, Wd, 0), P(L, Wd, h), P(L, 0, h)], darker);
    body += poly([P(0, 0, h), P(L, 0, h), P(L, Wd, h), P(0, Wd, h)], lighter);
    if (labels) { const a = P(L / 2, Wd, 0), b = P(L, Wd / 2, 0), c = P(L, 0, h / 2); lab += txt(a[0] - 10, a[1] + 20, `${L} mm`) + txt(b[0] + 18, b[1] + 16, `${Wd} mm`, 'start') + txt(c[0] + 10, c[1], `${h} mm`, 'start'); }
  } else if (t === 'pillow') {
    const s = Math.min((W - 80) / sh.L, (H - 60) / (sh.W * 0.55 + sh.H * 0.6));
    const rx = sh.L * s / 2, ry = (sh.W * 0.55 + sh.H * 0.6) * s / 2, cx = W / 2, cy = H / 2 - 6;
    body += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${gid}r)"/><path d="M${cx - rx * 0.92} ${cy + 2}Q${cx} ${cy - ry * 0.25} ${cx + rx * 0.92} ${cy + 2}" stroke="${dark}" stroke-width="1.2" fill="none" opacity=".6"/>`;
    if (labels) lab += txt(cx, cy + ry + 22, `${sh.L} × ${sh.W} × ${sh.H} mm`);
  } else if (t === 'sphere') {
    const s = (Math.min(W, H) - 70) / sh.D, r = sh.D * s / 2, cx = W / 2, cy = H / 2 - 6;
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${gid}r)"/>`;
    if (labels) lab += txt(cx, cy + r + 22, `Ø ${sh.D} mm`);
  }
  return `<svg class="anim" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${SHAPES[t].n} preview">${defs}<ellipse cx="${W / 2}" cy="${H - 26}" rx="${W * 0.28}" ry="7" fill="rgba(30,24,19,.08)"/>${body}${lab}</svg>`;
}
const shapeIcon = (t) => shapeSVG(Object.assign({}, { D:60, H:t === 'cube' ? 40 : 36, d:16, nh:7, L:80, W:55, a:44 }, t === 'multiHole' ? { d:10 } : {}, t === 'sphere' ? { D:60 } : {}, { type:t }), '#8d6a4c', 120, 84, false).replace('class="anim"', 'class=""');
const dimText = (sh) => { const s = SHAPES[sh.type]; return s.dims.map(k => k === 'nh' ? `${sh.nh} holes` : `${DIM_LABEL[k].toLowerCase()} ${sh[k]} mm`).join(', '); };
