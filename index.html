    const a = quick(s => { s.proc.dry = 'shade'; s.proc.dryH = 96; });
    const holeable = S.shape.type === 'cyl';
    const b = holeable ? quick(s => { s.shape.type = 'cylHole'; s.shape.d = Math.round(s.shape.D * 0.25); }) : null;
    const main = S.recipe.slice().sort((x, y) => y.pct - x.pct)[0];
    const c = quick(s => { const m = s.recipe.find(r => r.id === main.id); const take = Math.min(10, m.pct - 5); m.pct -= take; const f = s.recipe.find(r => r.id === 'palm_fibre'); if (f) f.pct += take; else s.recipe.push({ id:'palm_fibre', pct:take }); });
    tips.push({ t:'bad', h:`Crack risk is high (${f0(R.dry.crack)}%).`, b:`Shade drying would bring it to ${f0(a.dry.crack)}%${b ? `, a centre hole to ${f0(b.dry.crack)}%` : ''}, and swapping 10% of ${getMat(main.id).n.toLowerCase()} for date palm fibre to ${f0(c.dry.crack)}%.` });
  }
  if (R.strength < T.strength.min) {
    const a = quick(s => { const bi = s.recipe.find(r => isBinder(getMat(r.id))); if (bi) { bi.pct += 5; } else s.recipe.push({ id:'wheat_flour', pct:8 }); const t = s.recipe.reduce((q, r) => q + r.pct, 0); s.recipe.forEach(r => r.pct = r.pct * 100 / t); });
    const b = quick(s => { s.proc.grind = 'one'; s.proc.size = Math.min(s.proc.size, 1); });
    const c = quick(s => { s.proc.grind = 'two'; s.proc.fine = 0.5; s.proc.coarse = 2; s.proc.fineShare = 0.35; });
    tips.push({ t:'bad', h:`Too weak to handle (${f2(R.strength)} MPa).`, b:`More binder (+5%) gives ${f2(a.strength)} MPa; grinding to under 1 mm gives ${f2(b.strength)} MPa; mixing 35% fine (0.5 mm) with 65% coarse (2 mm) gives ${f2(c.strength)} MPa.` });
  } else if (R.strength < T.strength.good) {
    tips.push({ t:'warn', h:`Strength is acceptable but not high (${f2(R.strength)} MPa).`, b:'Finer particles, a longer hold time or a little more binder will make it tougher for transport.' });
  }
  if (!R.grind.two && R.strength < T.strength.good * 1.6) {
    const c = quick(s => { s.proc.grind = 'two'; s.proc.fine = 0.5; s.proc.coarse = Math.max(2, s.proc.size); s.proc.fineShare = 0.35; });
    if (c.strength > R.strength * 1.05) tips.push({ t:'warn', h:'Try mixing two grind sizes.', b:`About 35% fine powder (0.5 mm) with 65% coarse (${Math.max(2, S.proc.size)} mm) packs tighter: density ${f0(c.rhoDry)} kg/m³ and strength ${f2(c.strength)} MPa instead of ${f0(R.rhoDry)} and ${f2(R.strength)}.` });
  }
  if (R.comp.squeezed > 0.03) tips.push({ t:'warn', h:'Water is being squeezed out of the mould.', b:`About ${f0(R.comp.squeezed * R.mass / (1 + R.comp.X))} g per briquette. The mix is wetter than it needs to be; use a thicker binder paste.` });
  if (R.comp.M0 - R.mp.Mopt > 0.08) tips.push({ t:'warn', h:`The mix is wet (${f0(R.comp.M0 * 100)}% moisture).`, b:'Wet mixes shrink more while drying, which causes cracks. Cook the paste thicker or pre-dry the mix for an hour.' });
  if (R.Mf > T.moisture.max / 100) tips.push({ t:'warn', h:`Not dry enough yet (${f1(R.Mf * 100)}% after ${S.proc.dryH} h).`, b:`Dry longer, or use a warmer method. It reaches 10% after ${fmtHours(R.dry.t10)}.` });
  if (R.ash > T.ash.max) tips.push({ t:'bad', h:`High ash (${f1(R.ash)}%).`, b:'Ash lowers the useful heat and leaves residue. Add low-ash materials such as date seed, sawdust or coconut shell.' });
  if (R.tign > T.ignition.max) tips.push({ t:'warn', h:`Hard to light (${f0(R.tign)} s).`, b: R.mp.charFrac > 0.3 ? 'Charred briquettes have little volatile matter. Use a fire-starter or add 10–20% raw sawdust.' : 'Add a quick-burning material (sawdust, coffee grounds) or lower the density.' });
  if (R.mp.oil > 6 && R.strength < T.strength.good) tips.push({ t:'warn', h:`Oil content is ${f1(R.mp.oil)}%.`, b:'Seed oils coat particles and weaken binding. Some teams de-oil date seeds or add a fibrous material.' });
  if (R.mp.hyg > 0.8 && R.mp.B > 0.03) tips.push({ t:'warn', h:'The binder absorbs moisture from humid air.', b:'Sugary binders (date syrup, molasses) soften in humidity. Store the briquettes in sealed bags.' });
  { const aq = airQuality(R.burn);
    if (aq.st === 'poor') tips.push({ t:'bad', h:`Smoky or high in harmful gases (${GAS_INFO[aq.worst].n}).`, b: S.proc.setup === 'open' ? 'Most smoke and CO come from smouldering in open air. Burn in a stove with other briquettes and make sure they are fully dry.' : 'Dry the briquettes fully, lower oily or high-nitrogen ingredients, and burn with plenty of air.' });
    else if (gasStatus('NOx', R.burn.perMJ.NOx) !== 'good') tips.push({ t:'warn', h:`NOx is ${gasStatus('NOx', R.burn.perMJ.NOx) === 'poor' ? 'high' : 'moderate'} (fuel nitrogen ${f2(R.mp.N)}%).`, b:'Seeds and flours contain protein, which turns into NOx. Mixing in low-nitrogen material (sawdust, palm fibre, coconut shell) lowers it.' });
    if (gasStatus('HCl', R.burn.perMJ.HCl) === 'poor') tips.push({ t:'warn', h:'High chlorine.', b:`Fuel chlorine ${f2(R.mp.Cl)}% forms HCl, which corrodes stoves. Palm leaflets, molasses and banana peel are high; use less of them.` }); }
  if (R.mp.estShare > 0.15) tips.push({ t:'warn', h:'Some ingredient values are estimates.', b:'Materials marked "est." use values from similar materials. Check them with your own lab tests.' });
  if (!tips.some(t => t.t === 'bad')) tips.unshift({ t:'ok', h:'This recipe meets the main targets.', b:`Quality score ${R.score}/100. Run the test lab to confirm with real measurements.` });
  return tips;
}

/* ============================================================
   VIEW: Shape & size (with recommendation engine)
   ============================================================ */
function shapeSVG(sh, col, W = 300, H = 210, labels = true, cracks = 0) {
  const t = sh.type, light = shade(col, 0.18), lighter = shade(col, 0.32), dark = shade(col, -0.35), darker = shade(col, -0.6);
  const gid = 'g' + Math.random().toString(36).slice(2, 7);
  let body = '', lab = '';
  const defs = `<defs><linearGradient id="${gid}s" x1="0" x2="1"><stop offset="0" stop-color="${dark}"/><stop offset=".35" stop-color="${light}"/><stop offset="1" stop-color="${darker}"/></linearGradient>
    <radialGradient id="${gid}r" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${lighter}"/><stop offset=".6" stop-color="${col}"/><stop offset="1" stop-color="${darker}"/></radialGradient></defs>`;
  const txt = (x, y, s, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12" fill="#52514e" font-family="Archivo, sans-serif">${s}</text>`;
  const crackPaths = (cx, cy, rx, ry) => {
    if (cracks < 8) return '';
    let s = '', seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const n = Math.round(cracks / 9);
    for (let i = 0; i < n; i++) { let a = rnd() * Math.PI * 2, r = rnd() * 0.3; let x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r; let d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
      const len = 3 + Math.round(cracks / 18); for (let k = 0; k < len; k++) { a += (rnd() - 0.5) * 1.3; const st = rx * 0.12; x += Math.cos(a) * st; y += Math.sin(a) * st * (ry / rx); if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 > 0.92) break; d += `L${x.toFixed(1)} ${y.toFixed(1)}`; }
      s += `<path d="${d}" stroke="${darker}" stroke-width="${1.3 + cracks / 45}" fill="none" stroke-linecap="round" opacity=".9"/>`; }
    return s;
  };
  if (['cyl', 'cylHole', 'multiHole'].includes(t)) {
    const D = sh.D, h = sh.H, s = Math.min((W - 90) / D, (H - 56) / (h + D * 0.38));
    const rx = D * s / 2, ry = rx * 0.38, bh = h * s, cx = W / 2, ty = (H - (bh + 2 * ry)) / 2 + ry;
    body += `<path d="M${cx - rx} ${ty}L${cx - rx} ${ty + bh}A${rx} ${ry} 0 0 0 ${cx + rx} ${ty + bh}L${cx + rx} ${ty}Z" fill="url(#${gid}s)"/>`;
    body += `<ellipse cx="${cx}" cy="${ty}" rx="${rx}" ry="${ry}" fill="${light}"/>`;
    body += crackPaths(cx, ty, rx, ry);
    if (t === 'cylHole') { const r = Math.min(sh.d, D * 0.6) / D; body += `<ellipse cx="${cx}" cy="${ty}" rx="${rx * r}" ry="${ry * r}" fill="${darker}"/><path d="M${cx - rx * r} ${ty}A${rx * r} ${ry * r} 0 0 1 ${cx + rx * r} ${ty}" stroke="${dark}" stroke-width="2" fill="none"/>`; }
    if (t === 'multiHole') {
      const n = sh.nh <= 9 ? 7 : sh.nh <= 15 ? 12 : 19, k = n === 7 ? 3 : n === 12 ? 4 : 5, p = (D - k * sh.d) / (k + 1) + sh.d;
      const pts = [];
      if (n === 7) { pts.push([0, 0]); for (let i = 0; i < 6; i++) pts.push([Math.cos(i * Math.PI / 3) * p, Math.sin(i * Math.PI / 3) * p]); }
      else if (n === 12) { for (let i = 0; i < 4; i++) pts.push([Math.cos(i * Math.PI / 2 + Math.PI / 4) * p * 0.6, Math.sin(i * Math.PI / 2 + Math.PI / 4) * p * 0.6]); for (let i = 0; i < 8; i++) pts.push([Math.cos(i * Math.PI / 4) * p * 1.42, Math.sin(i * Math.PI / 4) * p * 1.42]); }
      else { pts.push([0, 0]); for (let i = 0; i < 6; i++) pts.push([Math.cos(i * Math.PI / 3) * p, Math.sin(i * Math.PI / 3) * p]); for (let i = 0; i < 12; i++) pts.push([Math.cos(i * Math.PI / 6) * p * 1.9, Math.sin(i * Math.PI / 6) * p * 1.9]); }
      for (const [x, y] of pts) body += `<ellipse cx="${cx + x * s}" cy="${ty + y * s * 0.38}" rx="${sh.d * s / 2}" ry="${sh.d * s / 2 * 0.38}" fill="${darker}"/>`;
    }
    if (labels) lab += txt(cx, ty + bh + ry + 22, `Ø ${D} mm`) + txt(cx + rx + 10, ty + bh / 2 + 4, `${h} mm`, 'start') + (t === 'cylHole' ? txt(cx, ty - ry - 8, `hole Ø ${sh.d} mm`) : t === 'multiHole' ? txt(cx, ty - ry - 8, `${sh.nh <= 9 ? 7 : sh.nh <= 15 ? 12 : 19} holes, Ø ${sh.d} mm`) : '');
  } else if (t === 'hexHole') {
    const D = sh.D, h = sh.H, Rv = D / Math.sqrt(3), s = Math.min((W - 90) / (2 * Rv), (H - 56) / (h + 2 * Rv * 0.42));
    const cx = W / 2, ty = (H - (h * s + 2 * Rv * s * 0.42)) / 2 + Rv * s * 0.42, k = 0.42;
    const V = [...Array(6)].map((_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return [cx + Math.cos(a) * Rv * s, ty + Math.sin(a) * Rv * s * k]; });
    const bh = h * s;
    for (let i = 0; i < 6; i++) { const a = V[i], b = V[(i + 1) % 6]; if ((a[1] + b[1]) / 2 < ty - 0.1) continue;
      const shadeF = (a[0] + b[0]) / 2 < cx - 2 ? light : (a[0] + b[0]) / 2 > cx + 2 ? darker : col;
      body += `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}L${b[0]} ${b[1] + bh}L${a[0]} ${a[1] + bh}Z" fill="${shadeF}" stroke="${dark}" stroke-width=".6"/>`; }
    body += `<path d="${V.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('')}Z" fill="${lighter}" stroke="${dark}" stroke-width=".6"/>`;
    const r = Math.min(sh.d, D * 0.6) / 2 * s; body += `<ellipse cx="${cx}" cy="${ty}" rx="${r}" ry="${r * k}" fill="${darker}"/>`;
    if (labels) lab += txt(cx, ty + bh + Rv * s * k + 22, `${D} mm across flats`) + txt(cx + Rv * s + 10, ty + bh / 2 + 4, `${h} mm`, 'start');

function makeAnim(step) {
  let id = null, last = 0;

    start() { if (a.running) return; a.running = true; last = performance.now(); ANIMS.add(a);
      const loop = (now) => { if (!a.running) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); id = requestAnimationFrame(loop); };
      id = requestAnimationFrame(loop); },
    stop() { a.running = false; cancelAnimationFrame(id); } };
  return a;
}

      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const n = 26; let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < n; i++) { const ex = cx + (rnd() - 0.5) * bw * 0.9, ey = top + rnd() * bh * 0.95; const fl = 0.55 + 0.45 * Math.sin(performance.now() / (180 + i * 23) + i);
        const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 6 + 7 * f.ember); g.addColorStop(0, `rgba(255,${150 + 60 * fl},60,${0.75 * f.ember * fl})`); g.addColorStop(1, 'rgba(255,80,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 6 + 7 * f.ember, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    // particles
    const spawn = (arr, n, mkp) => { for (let i = 0; i < n; i++) arr.push(mkp()); };
    if (dt > 0) {
      if (f.flame > 0.01) spawn(this.flames, Math.round(f.flame * 7 + 1), () => ({ x: cx + (Math.random() - 0.5) * bw * 0.85, y: top + 4, vx: (Math.random() - 0.5) * 12, vy: -(40 + Math.random() * 50) * (0.6 + f.flame), life: 0, max: 0.6 + Math.random() * 0.7, r: 7 + Math.random() * 12 * (0.5 + f.flame) }));
      if (f.smoke > 0.05) spawn(this.smoke, Math.random() < f.smoke ? 1 : 0, () => ({ x: cx + (Math.random() - 0.5) * bw * 0.6, y: top, vx: (Math.random() - 0.5) * 8, vy: -(14 + Math.random() * 12), life: 0, max: 3 + Math.random() * 2, r: 8 + Math.random() * 6 }));
      if (f.ember > 0.3 && Math.random() < 0.06) spawn(this.sparks, 1, () => ({ x: cx + (Math.random() - 0.5) * bw * 0.6, y: top, vx: (Math.random() - 0.5) * 40, vy: -(60 + Math.random() * 60), life: 0, max: 0.8 }));
    }
    const upd = (arr, d) => { for (const p of arr) { p.life += d; p.x += p.vx * d + Math.sin(p.life * 9 + p.r) * 0.4; p.y += p.vy * d; } return arr.filter(p => p.life < p.max && p.y > -20); };
    this.smoke = upd(this.smoke, dt); this.flames = upd(this.flames, dt); this.sparks = upd(this.sparks, dt);
    for (const p of this.smoke) { const a = (1 - p.life / p.max) * 0.16; ctx.fillStyle = `rgba(170,160,150,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.life * 1.4), 0, Math.PI * 2); ctx.fill(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of this.flames) { const u = p.life / p.max, r = p.r * (1 - u * 0.6);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, `rgba(255,${235 - 120 * u},${150 - 140 * u},${0.55 * (1 - u)})`); g.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); }
    for (const p of this.sparks) { ctx.fillStyle = `rgba(255,200,90,${1 - p.life / p.max})`; ctx.fillRect(p.x, p.y, 2, 2); }
    ctx.restore();
    const [pl, pc] = PHASE_INFO[f.phase] || PHASE_INFO.heating;
    const ph = $('#bPhase'); if (ph) ph.innerHTML = `<i style="background:${pc}"></i>${pl}`;
    const mm = Math.floor(this.simT / 60), ss = Math.floor(this.simT % 60);
    $('#bRead').innerHTML = `Time <b>${mm}:${String(ss).padStart(2, '0')}</b><br>Mass <b>${f1(f.m)} g</b><br>Surface <b>${f0(f.T)} °C</b><br>Heat <b>${f0(f.hrr)} W</b>`;
  }
};

      Chart.bars(d.lastElementChild, { items: scen.map(s => ({ label: s.name.length > 22 ? s.name.slice(0, 21) + '…' : s.name, value: fn(s.R), color: s.color })), fmt: v => (+v).toFixed(dp), rowH: 26, labelW: 150 });
    }
    this.sweep();
  },
  sweep() {
    const box = $('#cSweep'); if (!box) return;
    const v = this.sweepVar, xs = [], out = { strength: [], rho: [], crack: [], hhv: [], ign: [], dur: [] };
    let label, unit, mk = [];
    const binderIdx = S.recipe.findIndex(r => isBinder(getMat(r.id)));
    for (let i = 0; i <= 24; i++) {
      const rec = JSON.parse(JSON.stringify(S.recipe)), proc = Object.assign({}, S.proc); let x;
      if (v === 'binder') { x = i; label = 'Binder share (%)'; unit = '%';
        let bi = binderIdx; if (bi < 0) { rec.push({ id:'wheat_flour', pct:0 }); bi = rec.length - 1; }
        const others = rec.reduce((s, r, j) => j === bi ? s : s + r.pct, 0) || 1;
        rec.forEach((r, j) => { r.pct = j === bi ? x : r.pct / others * (100 - x); }); }
      else if (v === 'P') { x = 0.5 * Math.pow(300, i / 24); proc.P = x; label = 'Pressure (MPa)'; }
      else if (v === 'size') { x = 0.1 + i * (5.5 / 24); proc.grind = 'one'; proc.size = x; label = 'Particle size (mm)'; }
      else if (v === 'fine') { x = 5 + i * (90 / 24); proc.grind = 'two'; if (S.proc.grind !== 'two') { proc.fine = 0.5; proc.coarse = 2; } proc.fineShare = x / 100; label = `Fine share (%), ${proc.fine} mm + ${proc.coarse} mm`; }
      else if (v === 'moist') { x = 8 + i * 1.5; proc.moistMode = 'manual'; proc.moist = x / 100; label = 'Mix moisture (%)'; }
      else if (v === 'dwell') { x = i * 5; proc.dwell = x; label = 'Hold time (s)'; }
      else { x = 4 + i * 8; proc.dryH = x; label = 'Drying time (h)'; }
      const R = evaluate(rec, proc, S.shape, { quick: true, noBurn: true, calib: S.calib });
      xs.push(x); out.strength.push([x, R.strength]); out.rho.push([x, R.rhoDry]); out.crack.push([x, R.dry.crack]); out.hhv.push([x, R.hhv]); out.dur.push([x, R.durability]); out.ign.push([x, R.tign]);
    }
    if (v === 'binder') mk = [{ x:5, label:'B5' }, { x:10, label:'B10' }, { x:15, label:'B15' }];
    const cur = { binder: binderIdx >= 0 ? S.recipe[binderIdx].pct : 0, P: S.proc.P, size: S.proc.grind === 'two' ? R0deff() : S.proc.size, fine: S.proc.grind === 'two' ? S.proc.fineShare * 100 : 35, moist: S.R.comp.M0 * 100, dwell: S.proc.dwell, dryH: S.proc.dryH }[v];
    mk.push({ x: cur, label:'now', row: 1 });
    box.innerHTML = '';
    const charts = [['Strength (MPa)', out.strength, '#2a78d6', 'MPa', 'strength'], ['Dry density (kg/m³)', out.rho, '#1baf7a', 'kg/m³', 'density'], ['Crack risk (%)', out.crack, '#e34948', '%', 'crack'], ['Durability (%)', out.dur, '#6250d6', '%', 'durability'], ['Ignition time (s)', out.ign, '#eda100', 's', 'ignition'], ['Calorific value (MJ/kg)', out.hhv, '#eb6834', 'MJ/kg', 'hhv']];
    for (const [t, data, col, u, tk] of charts) {
      const d = node(`<div><h3 style="margin:8px 0 4px">${t}</h3><div></div></div>`); box.appendChild(d);
      const T = targets()[tk];
      Chart.line(d.lastElementChild, { series:[{ name:t, color:col, data }], xLabel:label, unit:u, xName:label, markers:mk, height:170,
        bands: T ? [T.dir > 0 ? { y0:T.min, y1:1e9, label:'meets target' } : { y0:-1e9, y1:T.max, label:'meets target' }] : [] });
    }
  },
  renderOpt() {
    const box = $('#oCtl'); if (!box) return;
    this.opt = this.opt || { w: { hhv:1, strength:1, crack:1, ash:0.5, cost:0.5, waste:0.5, durability:0.5 } };
    box.innerHTML = '<h3 style="margin-top:0">Limits for each ingredient (% of dry mass)</h3>';
    const tbl = node(`<table class="tbl"><thead><tr><th>Ingredient</th><th class="num">Min</th><th class="num">Max</th></tr></thead><tbody></tbody></table>`);
    this.bounds = S.recipe.map(r => { const m = getMat(r.id); return isBinder(m) ? [3, 15] : r.id === 'date_seed' ? [40, 95] : [0, 40]; });
    S.recipe.forEach((r, i) => { const tr = node(`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${SLOT[i]};margin-right:8px"></i>${esc(getMat(r.id).n)}</td><td class="num"><input class="inp" type="number" min="0" max="100" value="${this.bounds[i][0]}" style="width:70px"></td><td class="num"><input class="inp" type="number" min="0" max="100" value="${this.bounds[i][1]}" style="width:70px"></td></tr>`);
      const [a, b] = $$('input', tr); a.addEventListener('input', () => this.bounds[i][0] = +a.value); b.addEventListener('input', () => this.bounds[i][1] = +b.value); tbl.querySelector('tbody').appendChild(tr); });
    box.appendChild(tbl);
    box.appendChild(node('<h3>How much each goal matters</h3>'));
    const names = { hhv:'High energy', strength:'Strong', durability:'Durable', crack:'Few cracks', ash:'Low ash', cost:'Low cost', waste:'Uses more waste' };
    for (const k of Object.keys(names)) slider(box, { label:names[k], min:0, max:2, step:0.25, value:this.opt.w[k], fmt: v => v === 0 ? 'off' : f2(v).replace(/0$/, ''), onInput: v => { this.opt.w[k] = v; } });
    if (this.opt.must === undefined) this.opt.must = true;
    const mc = node(`<label class="check" style="margin-top:6px"><input type="checkbox" ${this.opt.must ? 'checked' : ''}> Only blends that meet every target (strength, durability, ash, crack risk, calorific value)</label>`);
    mc.querySelector('input').addEventListener('change', e => this.opt.must = e.target.checked); box.appendChild(mc);
    const go = node('<button class="btn amber" style="margin-top:12px;display:flex">Find the best blend</button>'); box.appendChild(go);
    go.addEventListener('click', () => { $('#oOut').innerHTML = '<p class="muted">Searching…</p>'; setTimeout(() => this.runOpt(), 30); });
    if (S.recipe.length < 2) go.disabled = true;
  },
  runOpt() {
    const ids = S.recipe.map(r => r.id);
    let res = optimiseMix(ids, this.bounds, S.proc, S.shape, this.opt.w, S.calib, 2500);
    const T = targets(), all = res.length;
    const passing = res.filter(r => r.R.strength >= T.strength.min && r.R.durability >= T.durability.min && r.R.ash <= T.ash.max && r.R.dry.crack <= T.crack.max && r.R.hhv >= T.hhv.min);
    const usedFilter = this.opt.must && passing.length > 0;
    if (usedFilter) res = passing;
    const out = $('#oOut');
    if (!res.length) { out.innerHTML = '<p class="muted">No blend fits those limits. Widen the min/max values so they can add up to 100%.</p>'; return; }
    const best = res[0], R = best.R;
    out.innerHTML = `<h3 style="margin-top:0">Best blend found (score ${f0(best.score)})</h3>
      <p class="muted" style="font-size:12.5px;margin:-4px 0 8px">${this.opt.must ? (usedFilter ? `${passing.length} of ${all} blends meet every target; the best of those is shown.` : `None of the ${all} blends meet every target, so the best overall is shown. Try a drier mix, shade drying or a centre hole.`) : `Best of ${all} blends, targets not enforced.`}</p>
      <div id="oStack"></div>
      <div class="kpis">${kpi('Calorific value', f1(R.hhv), 'MJ/kg')}${kpi('Strength', f2(R.strength), 'MPa')}${kpi('Crack risk', f0(R.dry.crack), '%')}${kpi('Ash', f1(R.ash), '%')}${kpi('Cost', f2(R.cost), 'OMR/kg')}${kpi('Durability', f1(R.durability), '%')}</div>
      <div class="row" style="margin:12px 0"><button class="btn primary" id="oUse">Use this blend</button></div>
      <h3>Every blend tested</h3><p class="muted" style="font-size:12.5px;margin:0 0 6px">Darker = higher score. The black dot is the best. Click any dot to use it.</p><div id="oScatter"></div>`;
    Chart.stack($('#oStack'), { segments: best.recipe.map((r, i) => ({ label: getMat(r.id).n, value: r.pct, color: SLOT[i] })), dp: 1 });
    const apply = (rec) => { S.recipe = rec.map(r => ({ id: r.id, pct: r.pct, lock: false })); S.name = 'Optimised blend'; recompute(true); };
    $('#oUse').addEventListener('click', () => apply(best.recipe));
    Chart.scatter($('#oScatter'), { points: res.slice(0, 1500).map((r, i) => ({ x: r.m.hhv, y: r.m.strength, c: r.score, hi: i === 0, r })), xLabel:'Calorific value (MJ/kg)', yLabel:'Strength (MPa)', height:260,
      tip: p => `<b>Score ${f0(p.c)}</b><div>${esc(recipeText(p.r.recipe))}</div><div>HHV ${f1(p.x)} MJ/kg, strength ${f2(p.y)} MPa, crack ${f0(p.r.m.crack)}%</div>`, onClick: p => apply(p.r.recipe) });
  }
};

}

VIEWS.methods = {
  render(root) {
    viewHead(root, 'Methods & sources', 'How every number on this site is estimated, so you can explain it to judges.');
    const c = card(root, '', '');
    c.innerHTML = `<div class="prose">
      <div class="note amber"><b>Please read.</b> These are model estimates built from published correlations and typical material data. They are good for planning and for choosing what to test, but they are not measurements. Real date seeds vary by variety and storage. Confirm every number in the lab, and use the Test lab page to calibrate the model with your own results.</div>
      <h2>1. Mixture properties</h2>
      <p>Calorific value, volatile matter, ash, hydrogen, lignin and oil are averaged by dry mass share. Bulk and particle density are combined by volume. A cross-check uses the Parikh correlation from proximate analysis:</p>
      <span class="eq">HHV = 0.3536 FC + 0.1559 VM − 0.0078 Ash  (MJ/kg, dry)</span>
      <p>The lower heating value as burned subtracts the heat used to evaporate moisture and the water formed from hydrogen:</p>
      <span class="eq">LHV<sub>ar</sub> = HHV (1 − M) − 2.443 [M + 8.936 H (1 − M)]</span>
      <p>Torrefied and carbonised options change the composition using typical mass and energy yields (carbonised: about 30% mass yield at 450–500 °C; HHV then from the Parikh correlation).</p>
      <h2>2. Grinding and mixing two sizes</h2>
      <p>Choose one sieve size (0.1 to 5.6 mm, mesh 140 to 3.5) or mix a fine and a coarse fraction. In a mix, the small particles fill the gaps between the big ones, so the powder packs tighter before pressing. The packing gain is largest when the coarse size is at least four times the fine size and the fine share is about 30–40%; it disappears when the two sizes are equal. The effective size used for bonding is the surface-weighted mean:</p>
      <span class="eq">d<sub>eff</sub> = 1 / (f / d<sub>fine</sub> + (1 − f) / d<sub>coarse</sub>)</span>
      <p>Grinding effort is shown relative to 2 mm using Bond's law (energy ∝ 1/√P − 1/√F, with whole seeds of about 20 mm as feed). Report reference [23] found that combining particle-size fractions improved briquette quality.</p>
      <h2>2b. Compaction</h2>
      <p>Density in the mould follows the Kawakita equation, where C is the volume reduction, P the pressure, a the initial porosity and b a plasticity constant that depends on particle hardness, fibre, size, moisture, binder and hold time:</p>
      <span class="eq">C = a b P / (1 + b P)</span>
      <p>If the pores fill with water before full pressure, the extra water is squeezed out. Spring-back after ejection grows with fibre, hardness, pressure and wetness, and falls with binder and longer hold times. Report Eqs. 3.1–3.2 give the nominal pressure P = F / A.</p>
      <h2>3. Drying and cracking</h2>
      <p>Moisture loss uses the first term of Fick's diffusion solution for a body with half-thickness equal to volume ÷ surface area, with diffusivity rising with temperature (Arrhenius). Sun drying alternates hot days and cool, humid nights. Equilibrium moisture depends on humidity and on sugary binders.</p>
      <span class="eq">dX/dt = −(π² D<sub>eff</sub> / 4L²)(X − X<sub>e</sub>)</span>
      <p>The crack risk index combines drying shrinkage, drying speed, thickness, particle hardness and fibre content. It is a relative index to compare options, not a probability.</p>
      <h2>4. Strength and durability</h2>
      <p>Compressive strength grows with binder bonding (with diminishing returns), relative density (power 2.5), finer particles and natural lignin or fibre interlocking at high pressure. It falls with seed oil, excess moisture and cracks. Durability and shatter index are estimated from strength, briquette mass and edge sharpness. Report Eq. 3.7: σ = F<sub>max</sub> / A<sub>0</sub>.</p>
      <h2>5. Ignition</h2>
      <p>Piloted ignition of a thermally thick solid:</p>
      <span class="eq">t<sub>ig</sub> = (π/4) k ρ c [(T<sub>ig</sub> − T<sub>0</sub>) / q″<sub>net</sub>]²</span>
      <p>adjusted for moisture and volatile matter. Low-volatile chars take much longer to light.</p>
      <h2>6. Combustion</h2>
      <p>The briquette is split into water, volatiles, fixed carbon and ash. Volatiles burn as a flame from the surface, then char burns as glowing combustion, both proportional to the shrinking surface area. A single briquette in open air gets little heat back from its own flame, so the flame can die soon after the igniter is removed and the briquette smoulders. That matches the short flame (about 17 s) in your Phase I trial. Burning rate uses report Eq. 3.8.</p>
      <h2>6b. Gases and smoke</h2>
      <p>Carbon in the fuel is found from the calorific value with the Channiwala–Parikh correlation. As the briquette burns, every gram released is split into CO₂ and CO using a combustion efficiency (MCE) for each phase: flaming in a stove about 95%, in open air about 93%, smouldering about 80%, glowing char about 88%, lower when the briquette is wet. Smoke particles (PM2.5) and methane use emission factors that are low for flaming and high for smouldering, rising with oil and moisture. NOx comes from fuel nitrogen with a conversion that falls as nitrogen rises; SO₂ and HCl come from fuel sulphur and chlorine, with part kept in the ash. Chimney gas composition assumes 2× the minimum air in a stove and 3.5× in open air.</p>
      <p>Levels (per MJ of fuel energy): CO low ≤ 3, moderate ≤ 6 g/MJ; PM2.5 low ≤ 0.25, moderate ≤ 0.6 g/MJ; NOx low ≤ 0.10, moderate ≤ 0.25 g/MJ; SO₂ low ≤ 0.03, moderate ≤ 0.10 g/MJ; HCl low ≤ 0.02, moderate ≤ 0.06 g/MJ. These are guide levels set for this tool from typical cookstove data, not legal limits. Biogenic CO₂ is shown but not rated.</p>
      <h2>7. Heat conduction</h2>
      <p>Effective conductivity is the geometric mean of solid and pore conductivity weighted by porosity, with pores partly filled with water. The transient profile uses an explicit finite-difference solution of the 1-D heat equation. Report Eq. 3.9: k = Q L / [A (T<sub>hot</sub> − T<sub>cold</sub>)], with Q measured from the cooling water as ṁ c<sub>p</sub> ΔT.</p>
      <h2>8. Shape recommendation</h2>
      <p>About 500 shapes and sizes are simulated with your mix. Each is scored on burn time, peak power per gram, ignition, durability, crack risk, drying time, ease of pressing in a die, density evenness (height ÷ diameter) and fit in a household stove. The goal you pick sets the weights.</p>
      <h2>9. Best briquette finder</h2>
      <p>Runs in stages so it stays fast: about 1,500 blends of your ingredients (binder 3–16%), then 200 process combinations for the 3 best blends (5 grinding options, normal or thick paste, 10 or 30 s hold, 5 drying plans), then about 400 shapes and sizes. Options that meet every target are preferred; within those, the quality score and your goal decide. Pressure is set to the highest your press can reach.</p>
      <h2>10. Date varieties and oil extraction</h2>
      <p>Each variety has an oil content, protein, seed share of the fruit and a fatty-acid profile. Where a published value exists it is marked "measured" in the Date varieties table; the others use the typical 5–13% range reported for date seeds and are marked "estimated". Seed heating value is the date-seed base value adjusted for oil content (oil ≈ 39.5 MJ/kg).</p>
      <p>Extraction follows first-order kinetics: the share of oil removed after time t is</p>
      <span class="eq">E(t) = E<sub>max</sub> [1 − exp(−t / τ)]</span>
      <p>E<sub>max</sub> depends on the method (Soxhlet with hexane about 96%, ultrasound about 93%, cold screw press about 55%, supercritical CO₂ about 90%). τ grows with particle size, because oil has to diffuse out of each particle, and shrinks with more solvent. Seed cake left = seeds − oil removed; its heating value is recalculated with the oil that stays in it.</p>
      <h2>11. Biodiesel reactor (transesterification)</h2>
      <p>Oil + 3 methanol → 3 biodiesel (FAME) + glycerol, with KOH, NaOH or CaO as catalyst. Conversion rises with time as</p>
      <span class="eq">X(t) = X<sub>eq</sub> [1 − exp(−k (t − t<sub>lag</sub>))]</span>
      <p>X<sub>eq</sub> rises with the methanol-to-oil ratio (3:1 is the exact chemistry; about 6:1 is needed to push the reaction close to 100%). The rate k follows the Arrhenius law (doubles about every 10 °C), scaled by the active catalyst. Free fatty acids and water use up catalyst and make soap, which lowers the yield. Slow stirring adds a start-up delay t<sub>lag</sub> because oil and methanol do not mix. Crude glycerol ≈ 10% of the oil mass plus the excess methanol, catalyst and soap that settle with it.</p>
      <h2>12. Fuel properties and standards</h2>
      <p>Cetane number, viscosity, density, heating value and iodine value are averaged from the fatty-acid profile using values for each pure methyl ester (Knothe). Oxidation stability uses the Park et al. correlation with the share of linoleic plus linolenic acid: OS = 117.93 / (C18:2 + C18:3) + 2.59 h. Unconverted oil raises viscosity (log mixing with about 35 mm²/s for triglycerides), and methanol left after poor washing lowers the flash point strongly. Results are checked against EN 14214 and ASTM D6751. Blends are mixed by volume: density and heating value linearly, viscosity by log mixing.</p>
      <h2>13. Diesel engine simulation</h2>
      <p>A single-zone model calculates pressure and temperature every degree from inlet valve closing (145° before TDC) to exhaust valve opening (145° after TDC), with slider-crank geometry. The default engine is a typical single-cylinder lab engine (87.5 mm bore, 110 mm stroke, compression ratio 17.5, 1500 rpm, 3.5 kW, injection 23° before TDC); change it to match yours.</p>
      <ul>
        <li><b>Ignition delay:</b> Hardenberg–Hase correlation, which uses the fuel's cetane number, so higher-cetane biodiesel ignites sooner.</li>
        <li><b>Heat release:</b> double Wiebe function (premixed spike + slower diffusion burning). The premixed share follows Watson's correlation (longer delay → bigger spike).</li>
        <li><b>Heat loss to the walls:</b> Woschni correlation. <b>Friction:</b> Chen–Flynn correlation.</li>
        <li><b>Load:</b> the fuel mass per cycle is adjusted until the brake power matches the chosen load.</li>
        <li><b>Emissions:</b> NOx from the peak gas temperature (thermal NO, Zeldovich-type exponential); CO, unburnt fuel (HC) and smoke follow the fuel–air ratio, with the reductions commonly reported for biodiesel because it contains about 11% oxygen. These are trends: measure them with a gas analyser and smoke meter.</li>
      </ul>
      <h2>14. Zero-waste plan</h2>
      <p>Mass balance: seeds → oil + seed cake; oil + methanol → biodiesel + crude glycerol. Seed cake (with the leftover oil) plus a chosen share of glycerol and a little cassava binder become briquettes, which are then simulated with the same models as above. Energy recovered = useful heat (LHV) of the biodiesel + briquettes ÷ heat in the seeds. Diesel and charcoal replaced use equal energy (diesel ${f1(DIESEL.lhv)} MJ/kg, charcoal 28.5 MJ/kg); fossil CO₂ avoided uses 2.68 kg CO₂ per litre of diesel.</p>

        const ok = res.filter(r => meetsAll(r.R, T));
        recs = (ok.length ? ok : res).slice(0, 3);

      this.step(2, 'Step 2 of 4: tuning grinding, paste and drying…');
      tick(() => {
        const grinds = [{ grind:'one', size:2 }, { grind:'one', size:1 }, { grind:'one', size:0.5 }, { grind:'two', fine:0.5, coarse:2, fineShare:0.35 }, { grind:'two', fine:0.25, coarse:2.8, fineShare:0.35 }];
        const drys = [{ dry:'shade', dryH:72 }, { dry:'shade', dryH:120 }, { dry:'sun', dryH:48 }, { dry:'oven60', dryH:24 }, { dry:'oven105', dryH:8 }];
        let best = null;
        for (const rc of recs) for (const g of grinds) for (const d of drys) for (const dwell of [10, 30]) for (const mm of ['auto', 'thick']) {
          const proc = Object.assign({}, baseProc, g, d, { dwell });
          if (mm === 'thick') { const mp = mixProps(rc.recipe, proc.pre); proc.moistMode = 'manual'; proc.moist = clamp(mp.Mopt, 0.10, 0.4); } else proc.moistMode = 'auto';

          });
        });
      });
    });

function fitH(cv, h, vw) { return Math.round(h * Math.min(1, cv.parentElement.clientWidth / vw)); }
function fitDraw(view, vw) {
  if (!view.cv) return; const c = view.cv, k = Math.min(1, c.w / vw);
  c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.save(); c.ctx.scale(k, k);
  view.cv = { ctx: c.ctx, w: c.w / k, h: c.h / k };
  try { view._draw(); } finally { view.cv = c; c.ctx.restore(); }
}

  _draw() {
    if (!this.cv) return;
    const { ctx, w, h } = this.cv, X = S.B.ex, t = this.t, hrs = t * S.bio.hours;
    const prog = X.m.eff * (1 - Math.exp(-hrs / X.tau)) / Math.max(X.m.eff, 1e-9);
    ctx.clearRect(0, 0, w, h);
    const cx = w * 0.42, now = performance.now() / 1000;
    const oilCol = mixc('#f5efdc', '#d9961c', prog * 0.9);
    if (S.bio.method === 'soxhlet' || S.bio.method === 'ultrasound') {
      if (S.bio.method === 'soxhlet') {
        // heating mantle
        ctx.fillStyle = '#5b4a3f'; ctx.beginPath(); ctx.roundRect(cx - 70, h - 62, 140, 46, 12); ctx.fill();
        ctx.fillStyle = `rgba(255,90,30,${0.35 + 0.15 * Math.sin(now * 3)})`; ctx.fillRect(cx - 50, h - 60, 100, 4);

        ctx.save(); ctx.beginPath(); ctx.arc(cx, fy, fr, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = oilCol; ctx.fillRect(cx - fr, fy - 6, 2 * fr, fr + 10); ctx.restore();
        ctx.strokeStyle = '#8fa6ad'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, fy, fr, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 6; i++) { const bx = cx - 30 + i * 12, by = fy + 30 - ((now * 40 + i * 17) % 34); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(bx, by, 2, 0, 7); ctx.fill(); }
        // chamber + thimble
        const chx = cx - 38, chy = 70, chw = 76, chh = 130;
        ctx.strokeStyle = '#8fa6ad'; ctx.strokeRect(chx, chy, chw, chh); ctx.beginPath(); ctx.moveTo(cx, chy + chh); ctx.lineTo(cx, fy - fr); ctx.stroke();
        const cyc = (now / 2.6) % 1, fill = cyc < 0.85 ? cyc / 0.85 : 1 - (cyc - 0.85) / 0.15;
        ctx.fillStyle = 'rgba(232,210,150,.55)'; ctx.fillRect(chx + 2, chy + chh - fill * (chh - 14), chw - 4, fill * (chh - 14));
        ctx.fillStyle = '#fbfaf6'; ctx.fillRect(cx - 22, chy + 20, 44, chh - 30);
        ctx.fillStyle = mixc('#6b4226', '#c9a882', prog * 0.8); ctx.fillRect(cx - 18, chy + 34, 36, chh - 48);
        // siphon
        ctx.strokeStyle = cyc > 0.85 ? '#e0b85a' : '#8fa6ad'; ctx.lineWidth = cyc > 0.85 ? 4 : 2.5; ctx.beginPath(); ctx.moveTo(chx, chy + chh - 4); ctx.lineTo(chx - 14, chy + chh - 4); ctx.lineTo(chx - 14, chy + 16); ctx.lineTo(chx - 26, chy + 16); ctx.lineTo(chx - 26, fy - fr + 8); ctx.lineTo(cx - 20, fy - fr + 8); ctx.stroke();
        // vapour arm
        ctx.strokeStyle = '#8fa6ad'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx + 20, fy - fr + 6); ctx.lineTo(chx + chw + 18, fy - fr + 6); ctx.lineTo(chx + chw + 18, chy - 4); ctx.lineTo(cx + 10, chy - 4); ctx.stroke();
        for (let i = 0; i < 5; i++) { const u = (now * 0.6 + i / 5) % 1; ctx.fillStyle = 'rgba(160,190,200,.8)'; ctx.beginPath(); ctx.arc(chx + chw + 18, fy - fr + 6 - u * (fy - fr - chy + 10), 2.4, 0, 7); ctx.fill(); }
        // condenser
        ctx.fillStyle = 'rgba(42,120,214,.18)'; ctx.fillRect(cx - 14, 8, 28, chy - 12); ctx.strokeStyle = '#2a78d6'; ctx.lineWidth = 1.5; ctx.strokeRect(cx - 14, 8, 28, chy - 12);
        ctx.strokeStyle = '#8fa6ad'; ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, chy); ctx.stroke();
        const dy = ((now * 90) % 30); ctx.fillStyle = '#c9b88a'; ctx.beginPath(); ctx.ellipse(cx, chy + 4 + dy, 2.4, 3.4, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('Condenser (cold water)', cx + 22, 30); ctx.fillText('Thimble with seed powder', chx + chw + 26, chy + 60); ctx.fillText('Flask: hexane + oil', cx + fr + 10, fy + 4); ctx.fillText('Heater', cx + 76, h - 34);
      } else {
        const by = h - 70, bw = 150, bh = 170;
        ctx.fillStyle = '#5b4a3f'; ctx.fillRect(cx - 90, by, 180, 40);
        for (let i = 0; i < 4; i++) { const r2 = ((now * 60 + i * 30) % 120); ctx.strokeStyle = `rgba(42,120,214,${0.5 - r2 / 260})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, by, r2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
        ctx.fillStyle = oilCol; ctx.fillRect(cx - bw / 2, by - bh * 0.7, bw, bh * 0.7);
        ctx.strokeStyle = '#8fa6ad'; ctx.lineWidth = 2.5; ctx.strokeRect(cx - bw / 2, by - bh, bw, bh);
        for (let i = 0; i < 26; i++) { const x = cx - bw / 2 + 8 + ((i * 37) % (bw - 16)), y = by - 10 - ((now * 30 + i * 13) % (bh * 0.6)); ctx.fillStyle = mixc('#6b4226', '#c9a882', prog * 0.8); ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Ultrasound waves break the seed cells', cx + 88, by + 24);
      }

      const y = h * 0.45, x0 = cx - 140, x1 = cx + 120;
      ctx.fillStyle = '#9aa0a3'; ctx.fillRect(x0, y - 26, x1 - x0, 52);
      ctx.save(); ctx.beginPath(); ctx.rect(x0, y - 24, x1 - x0, 48); ctx.clip(); ctx.strokeStyle = '#5e6467'; ctx.lineWidth = 6;
      for (let x = x0 - 40 + (now * 40) % 28; x < x1 + 20; x += 28) { ctx.beginPath(); ctx.moveTo(x, y - 24); ctx.lineTo(x + 18, y + 24); ctx.stroke(); } ctx.restore();
      ctx.fillStyle = '#7f8689'; ctx.beginPath(); ctx.moveTo(x0 + 10, y - 26); ctx.lineTo(x0 - 20, y - 90); ctx.lineTo(x0 + 70, y - 90); ctx.lineTo(x0 + 50, y - 26); ctx.fill();
      for (let i = 0; i < 10; i++) { const sx = x0 + 6 + ((i * 23) % 50), sy = y - 86 + ((now * 50 + i * 15) % 60); ctx.fillStyle = '#6b4226'; ctx.beginPath(); ctx.ellipse(sx, sy, 5, 3, 0.5, 0, 7); ctx.fill(); }
      for (let i = 0; i < 6; i++) { const dx = x0 + 60 + i * 30, dy = y + 30 + ((now * 70 + i * 11) % 60); ctx.fillStyle = '#d9961c'; ctx.beginPath(); ctx.ellipse(dx, dy, 3, 4.5, 0, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#d9961c'; ctx.fillRect(x0 + 40, y + 96, 200, 12 + prog * 10);
      const len = 30 + ((now * 20) % 60); ctx.fillStyle = '#7a5236'; ctx.fillRect(x1, y - 10, len, 20);
      ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Seeds in', x0 - 10, y - 98); ctx.fillText('Oil drips out', x0 + 250, y + 70); ctx.fillText('Seed cake out', x1 + 8, y - 18);
    } else {
      const vx = cx - 40, vy = 60;
      ctx.fillStyle = '#c4c9cb'; ctx.beginPath(); ctx.roundRect(vx, vy, 80, 200, 20); ctx.fill(); ctx.strokeStyle = '#7f8689'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = mixc('#6b4226', '#c9a882', prog * 0.8); ctx.fillRect(vx + 12, vy + 40, 56, 120);
      ctx.beginPath(); ctx.arc(vx + 130, vy + 30, 26, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      const a = Math.PI * 0.8 + Math.PI * 1.4 * 0.75; ctx.strokeStyle = '#e34948'; ctx.beginPath(); ctx.moveTo(vx + 130, vy + 30); ctx.lineTo(vx + 130 + 20 * Math.cos(a), vy + 30 + 20 * Math.sin(a)); ctx.stroke();
      for (let i = 0; i < 5; i++) { const u = (now * 0.5 + i / 5) % 1; ctx.fillStyle = 'rgba(42,120,214,.6)'; ctx.beginPath(); ctx.arc(vx + 40, vy + 210 - u * 190, 3, 0, 7); ctx.fill(); }
      ctx.fillStyle = oilCol; ctx.fillRect(vx + 120, vy + 180, 60, 40); ctx.strokeRect(vx + 120, vy + 150, 60, 70);
      ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('CO₂ at ~300 bar', vx + 160, vy + 34); ctx.fillText('Oil separator', vx + 186, vy + 200);
    }
    const oilNow = X.oilIn * X.m.eff * (1 - Math.exp(-hrs / X.tau));
    $('#xRead').innerHTML = `Time <b>${f1(hrs)} h</b><br>Oil out <b>${fmtMass(oilNow)}</b><br>${X.siphons ? `Solvent cycle <b>${Math.max(1, Math.round(t * X.siphons))} / ${X.siphons}</b>` : `Removed <b>${f0(prog * X.m.eff * 100)}%</b>`}`;
    const ph = $('#xPhase'); if (ph) ph.innerHTML = `<i style="background:${t >= 1 ? '#0ca30c' : '#e0a83a'}"></i>${t >= 1 ? 'Finished' : 'Extracting'}`;
  }
};

    const stroke = th < -180 ? 'Intake' : th < 0 ? 'Compression' : th < 180 ? 'Power' : 'Exhaust';
    const hrrMax = Math.max(...r.trace.map(p => p.hrr), 1), flame = clamp((st.hrr || 0) / hrrMax, 0, 1);
    let gas;
    if (stroke === 'Intake') gas = '#cfe3f7';
    else if (stroke === 'Compression') gas = mixc('#cfe3f7', '#f3d3a6', clamp((st.T - 320) / 600, 0, 1));
    else if (stroke === 'Power') gas = mixc('#f6b26b', '#d9d4cc', clamp(th / 180, 0, 1));
    else gas = '#d9d4cc';
    // cylinder walls
    ctx.fillStyle = '#c4c9cb'; ctx.fillRect(cx - bw / 2 - 16, cylTop, 16, yc - rc - 40 - cylTop); ctx.fillRect(cx + bw / 2, cylTop, 16, yc - rc - 40 - cylTop);
    // gas
    ctx.fillStyle = gas; ctx.fillRect(cx - bw / 2, cylTop, bw, pistonTop - cylTop);
    if (flame > 0.02) { const gr = ctx.createRadialGradient(cx, cylTop + 10, 4, cx, cylTop + 10, 90); gr.addColorStop(0, `rgba(255,230,120,${0.95 * flame})`); gr.addColorStop(0.5, `rgba(255,120,30,${0.7 * flame})`); gr.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.save(); ctx.beginPath(); ctx.rect(cx - bw / 2, cylTop, bw, pistonTop - cylTop); ctx.clip(); ctx.fillStyle = gr; ctx.fillRect(cx - bw / 2, cylTop, bw, pistonTop - cylTop); ctx.restore(); }
    // injector + spray
    ctx.fillStyle = '#5e6467'; ctx.fillRect(cx - 5, headY - 18, 10, headH + 22);
    const injDur = 8 + 18 * clamp(r.phi / 0.6, 0, 1.2);
    if (th >= r.SOI && th <= r.SOI + injDur) { ctx.fillStyle = 'rgba(224,168,58,.75)'; for (const s2 of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx, cylTop + 2); ctx.lineTo(cx + s2 * 52, cylTop + 34); ctx.lineTo(cx + s2 * 40, cylTop + 42); ctx.closePath(); ctx.fill(); } }
    // head + valves
    ctx.fillStyle = '#9aa0a3'; ctx.fillRect(cx - bw / 2 - 24, headY, bw + 48, headH);
    const lI = (th >= -360 && th <= -145) ? Math.sin(Math.PI * (th + 370) / 225) * 12 : th > 350 ? Math.sin(Math.PI * (th - 350) / 225) * 12 : 0;
    const lE = (th >= 145 && th <= 360) ? Math.sin(Math.PI * (th - 145) / 225) * 12 : th < -350 ? Math.sin(Math.PI * (th + 360 + 215) / 225) * 12 : 0;
    for (const [vx, lv, col] of [[cx - 34, Math.max(0, lI), '#2a78d6'], [cx + 34, Math.max(0, lE), '#8c857d']]) {
      ctx.fillStyle = '#5e6467'; ctx.fillRect(vx - 3, headY - 26 + lv, 6, headH + 24);
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(vx - 16, cylTop + lv); ctx.lineTo(vx + 16, cylTop + lv); ctx.lineTo(vx + 6, cylTop + lv - 8); ctx.lineTo(vx - 6, cylTop + lv - 8); ctx.fill();
      if (lv > 2) { ctx.strokeStyle = col; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { const yy = cylTop + 6 + ((performance.now() / 12 + i * 10) % 30) * (col === '#2a78d6' ? 1 : -1) + (col === '#2a78d6' ? 0 : 30); ctx.beginPath(); ctx.moveTo(vx - 8 + i * 8, yy); ctx.lineTo(vx - 8 + i * 8, yy + 6); ctx.stroke(); } }
    }
    ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('Air in', cx - 44, headY - 14); ctx.textAlign = 'left'; ctx.fillText('Exhaust out', cx + 44, headY - 14); ctx.textAlign = 'center'; ctx.fillText('Fuel injector', cx, headY - 34);
    // piston
    const pg = ctx.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0); pg.addColorStop(0, '#7f8689'); pg.addColorStop(0.4, '#dfe2e3'); pg.addColorStop(1, '#6f7578');
    ctx.fillStyle = pg; ctx.fillRect(cx - bw / 2 + 2, pistonTop, bw - 4, 40);
    ctx.strokeStyle = '#5e6467'; ctx.lineWidth = 1.5; for (const yy of [6, 12, 18]) { ctx.beginPath(); ctx.moveTo(cx - bw / 2 + 2, pistonTop + yy); ctx.lineTo(cx + bw / 2 - 2, pistonTop + yy); ctx.stroke(); }
    // crank + rod
    const cpx = cx + rc * Math.sin(a), cpy = yc - rc * Math.cos(a);
    ctx.fillStyle = '#c4c9cb'; ctx.beginPath(); ctx.arc(cx, yc, rc + 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9aa0a3'; ctx.beginPath(); ctx.arc(cx - (rc * 0.6) * Math.sin(a), yc + (rc * 0.6) * Math.cos(a), 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5e6467'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, pinY); ctx.lineTo(cpx, cpy); ctx.stroke();
    ctx.fillStyle = '#3a3f42'; ctx.beginPath(); ctx.arc(cpx, cpy, 8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(cx, yc, 7, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(cx, pinY, 6, 0, 7); ctx.fill();
    // stroke label + crank indicator
    const sx = w - Math.min(170, w * 0.3);
    ctx.textAlign = 'left'; ctx.fillStyle = '#1e1813'; ctx.font = '650 22px Archivo, sans-serif'; ctx.fillText(stroke, sx, 60);
    ctx.font = '12.5px Archivo, sans-serif'; ctx.fillStyle = '#5a534c';
    const desc = { Intake:'Piston moves down, fresh air is drawn in.', Compression:'Air is squeezed to about 1/' + f0(S.bio.engine.CR) + ' and gets hot.', Power:'Fuel burns, pressure pushes the piston down.', Exhaust:'Piston pushes burnt gas out.' }[stroke];
    const words = desc.split(' '); let line = '', yy = 82; for (const wd of words) { if (ctx.measureText(line + wd).width > 150) { ctx.fillText(line, sx, yy); line = ''; yy += 16; } line += wd + ' '; } ctx.fillText(line, sx, yy);
    const steps = ['Intake', 'Compression', 'Power', 'Exhaust'];
    steps.forEach((s2, i) => { ctx.fillStyle = s2 === stroke ? '#e8590c' : '#e2e1da'; ctx.fillRect(sx + i * 38, 150, 32, 6); });
    ctx.restore();
    $('#eRead').innerHTML = `Crank <b>${f0(((th % 720) + 720) % 720)}°</b><br>Pressure <b>${f1(st.P)} bar</b><br>Gas <b>${f0(st.T - 273)} °C</b>`;
    const ph = $('#ePhase'); if (ph) ph.innerHTML = `<i style="background:${stroke === 'Power' ? '#e8590c' : stroke === 'Intake' ? '#2a78d6' : stroke === 'Compression' ? '#eda100' : '#8c857d'}"></i>${S.bio.blend ? 'B' + S.bio.blend : 'Diesel'}, ${S.bio.load}% load`;
    ['#eP', '#eHRR'].forEach(id => { const n = $(id); if (n && n._setCursor) n._setCursor(th >= -60 && th <= 100 ? th : null); });
  }
};

/* ============================================================
   VIEW: Zero waste — oil → biodiesel, cake + glycerol → briquettes
   ============================================================ */
function zeroBalance() {
  const b = S.bio, kg = b.scale ? b.datesT * 1000 * b.seedPct / 100 : b.zeroKg;
  const B = bioEvaluate(Object.assign({}, b, { seedKg: kg }));
  const gly = B.tr.crudeGlyKg, glyUsed = 0, cake = B.ex.cake;
  const share = b.glyUse / 100, binder = 0.08;
  const glyToBriq = Math.min(gly, cake * share / (1 - share - binder));
  const binderKg = (cake + glyToBriq) * binder / (1 - binder);
  const briqKg = (cake + glyToBriq + binderKg) * 0.985;
  return { kg, B, gly, glyToBriq, glyOther: gly - glyToBriq, cake, binderKg, briqKg, bd: B.tr.bdKg, oil: B.ex.oil, meoh: B.tr.methanolKg,
    recipe: [['date_cake', cake / (cake + glyToBriq + binderKg) * 100], ['crude_glycerol', glyToBriq / (cake + glyToBriq + binderKg) * 100], ['cassava_flour', binder * 100]] };
}
function gj(MJ) { const g = MJ / 1000; return g < 10 ? f1(g) : f0(g); }
function fmtBig(kg) { return kg >= 1e6 ? f1(kg / 1e6) + ' kt' : kg >= 1000 ? f1(kg / 1000) + ' t' : kg >= 1 ? f1(kg) + ' kg' : f0(kg * 1000) + ' g'; }
function sankey(Z) {
  const W = 980, H = 372, total = Z.kg + Z.binderKg + Z.meoh, sc = 220 / total;
  const col = { seed:'#6b4226', oil:'#e0a83a', cake:'#8a5a36', bd:'#1d6b50', gly:'#6250d6', briq:'#b9770e', bind:'#d6c7a8', loss:'#c3c2b7', meoh:'#86b6ef' };
  const band = (x0, y0, x1, y1, wdt, c, lab) => `<path d="M${x0} ${y0}C${(x0 + x1) / 2} ${y0} ${(x0 + x1) / 2} ${y1} ${x1} ${y1}L${x1} ${y1 + wdt}C${(x0 + x1) / 2} ${y1 + wdt} ${(x0 + x1) / 2} ${y0 + wdt} ${x0} ${y0 + wdt}Z" fill="${c}" opacity=".45"><title>${lab}</title></path>`;
  const nodeR = (x, y, hgt, c, lab, val) => `<rect x="${x}" y="${y}" width="14" height="${Math.max(hgt, 2)}" rx="3" fill="${c}"/><text x="${x + 20}" y="${y + Math.max(hgt, 2) / 2 - 2}" font-size="13" font-weight="650" fill="#1e1813">${lab}</text><text x="${x + 20}" y="${y + Math.max(hgt, 2) / 2 + 14}" font-size="12" fill="#5a534c">${val}</text>`;
  const hs = Z.kg * sc, ho = Z.oil * sc, hc = Z.cake * sc, hb = Z.bd * sc, hg = Z.gly * sc, hgb = Z.glyToBriq * sc, hgo = Z.glyOther * sc, hbi = Z.binderKg * sc, hbr = Z.briqKg * sc, hm = Z.meoh * sc;
  const x0 = 20, x1 = 300, x2 = 560, x3 = 820;
  const ySeed = 60, yOil = 30, yCake = 100, yBd = 20, yGly = 70, yBriq = 100, yBind = 318, yMe = 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="sankey" font-family="Archivo, sans-serif" role="img" aria-label="Mass flow from date seeds to biodiesel and briquettes">`;
  s += band(x0 + 14, ySeed, x1, yOil, Math.max(ho, 1.5), col.oil, 'Oil');
  s += band(x0 + 14, ySeed + ho, x1, yCake, hc, col.cake, 'Seed cake');
  s += band(x1 + 14, yOil, x2, yBd, Math.max(hb * ho / (hb + hg || 1), 1.5), col.bd, 'Biodiesel');
  s += band(x1 + 14, yOil + Math.max(hb * ho / (hb + hg || 1), 1.5), x2, yGly, Math.max(ho - hb * ho / (hb + hg || 1), 1), col.gly, 'Glycerol');
  s += band(x1 + 14, yCake, x3, yBriq, hc, col.cake, 'Cake to briquettes');
  if (hgb > 0.3) s += band(x2 + 14, yGly, x3, yBriq + hc, Math.max(hgb, 1), col.gly, 'Glycerol to briquettes');
  s += band(x2 - 240, yBind, x3, yBriq + hc + hgb, Math.max(hbi, 1), col.bind, 'Binder');
  s += nodeR(x0, ySeed, hs, col.seed, 'Date seeds', fmtBig(Z.kg));
  s += nodeR(x1, yOil, Math.max(ho, 3), col.oil, 'Oil', fmtBig(Z.oil));
  s += nodeR(x1, yCake, hc, col.cake, 'Seed cake', fmtBig(Z.cake));
  s += nodeR(x2, yBd, Math.max(hb, 3), col.bd, 'Biodiesel', fmtBig(Z.bd) + ' (' + fmtBig(Z.bd / 0.876).replace(' kg', ' L').replace(' t', ' m³').replace(' g', ' mL') + ')');
  s += nodeR(x2, yGly, Math.max(hg, 3), col.gly, 'Crude glycerol', fmtBig(Z.gly) + (Z.glyOther > Z.gly * 0.05 ? ', ' + fmtBig(Z.glyOther) + ' spare' : ''));
  s += nodeR(x3, yBriq, hbr, col.briq, 'Briquettes', fmtBig(Z.briqKg));
  s += `<rect x="${x2 - 254}" y="${yBind}" width="14" height="${Math.max(hbi, 2)}" rx="3" fill="${col.bind}"/>`;
  s += `<text x="${x2 - 240}" y="${yBind + Math.max(hbi, 1) + 16}" font-size="12" fill="#5a534c">Cassava binder ${fmtBig(Z.binderKg)} (bought in)</text>`;
  s += `<text x="${x1 + 74}" y="${yBd - 7}" font-size="11.5" fill="#2a78d6">+ methanol ${fmtBig(Z.meoh)} (mostly recovered)</text>`;
  return s + '</svg>';
}
VIEWS.zero = {
  render(root) {
    viewHead(root, 'Waste to briquettes', 'Use every part of the seed: oil for biodiesel, and the leftover seed cake plus glycerol for briquettes.');
    const c1 = card(root, 'Where every kilogram goes', 'Band width = mass. Uses your current extraction and reactor settings.');
    c1.insertAdjacentHTML('beforeend', '<div class="flow-wrap" id="zS"></div><p class="swipe-hint">Swipe sideways to see the whole diagram.</p>');
    const cols = node('<div class="cols" style="margin-top:20px"></div>'); root.appendChild(cols);
    const l = node('<div class="stack-v"></div>'), r = node('<div class="stack-v"></div>'); cols.append(l, r);
    const s = card(l, 'Settings', '');
    seg(s, { label:'Amount of seeds', options:[[false, 'Choose an amount'], [true, 'All of Oman']], value:S.bio.scale, onChange: v => { S.bio.scale = v; route(); } });
    if (!S.bio.scale) slider(s, { label:'Date seeds', min:1, max:100000, log:true, value:S.bio.zeroKg, unit:'kg', fmt: v => fsig(v), round: v => v < 10 ? Math.round(v * 10) / 10 : Math.round(v), onInput: v => bioSet('zeroKg', v) });
    else { slider(s, { label:'Dates produced per year', min:100000, max:500000, step:5000, value:S.bio.datesT, unit:'t', fmt: v => f0(v), onInput: v => bioSet('datesT', v), hint:'Oman 2024: 396,775 t (preliminary NCSI figure).' });
      slider(s, { label:'Seed share of the fruit', min:4, max:18, step:0.5, value:S.bio.seedPct, unit:'%', fmt: f1, onInput: v => bioSet('seedPct', v), hint:'Varies with variety; studies report roughly 4–18%.' }); }
    slider(s, { label:'Glycerol added to briquettes', min:0, max:10, step:0.5, value:S.bio.glyUse, unit:'%', fmt: f1, onInput: v => bioSet('glyUse', v), hint:'Above ~8% the briquettes absorb moisture and get sticky.' });
    s.insertAdjacentHTML('beforeend', `<p class="hint muted" style="font-size:12.5px">Variety: <b>${S.B.v.n}</b> (${f1(S.B.v.oil)}% oil), ${EXTRACT_METHODS[S.bio.method].n}. Change them on the biodiesel pages.</p>`);
    const p = card(l, 'Products', ''); p.insertAdjacentHTML('beforeend', '<div class="kpis" id="zK"></div>');
    const b = card(r, 'Briquettes from the waste', 'Seed cake + glycerol + 8% cassava, made with your current process and shape, compared with normal date seed briquettes.');
    b.insertAdjacentHTML('beforeend', '<div id="zB"></div><div class="row" style="margin-top:12px"><button class="btn amber" id="zGo">Make briquettes from the waste</button><span class="muted" style="font-size:12.5px">Loads this recipe into the Mix designer.</span></div>');
    const e = card(r, 'Energy', 'How much of the seeds\' heat ends up as useful fuel.'); e.insertAdjacentHTML('beforeend', '<div id="zE"></div>');
    $('#zGo').addEventListener('click', () => { const Z = zeroBalance(); loadRecipe(Z.recipe.map(([id, pc]) => [id, pc]), 'Zero-waste briquette'); recompute(true); location.hash = 'mix'; });
  },
  update() {
    if (!$('#zS')) return;
    const Z = zeroBalance(); $('#zS').innerHTML = sankey(Z);
    const bdL = Z.bd / 0.876, dieselL = Z.bd * S.B.fp.lhv / (DIESEL.lhv * 0.835);
    const recipe = Z.recipe.map(([id, pct]) => ({ id, pct }));
    const RW = evaluate(recipe, S.proc, S.shape, { calib: S.calib, targets: targets() });
    const RS = evaluate([{ id:'date_seed', pct:90 }, { id:'cassava_flour', pct:10 }], S.proc, S.shape, { calib: S.calib, targets: targets() });
    const briqMJ = Z.briqKg * RW.lhvAr, bdMJ = Z.bd * S.B.fp.lhv, seedMJ = Z.kg * seedHHV(S.B.v);
    $('#zK').innerHTML = kpi('Biodiesel', fmtBig(Z.bd), '', null, f0(bdL) + ' litres') + kpi('Briquettes', fmtBig(Z.briqKg), '', null, f0(Z.briqKg * 1000 / RW.mass) + ' pieces of ' + f0(RW.mass) + ' g') +
      kpi('Diesel replaced', f0(dieselL), 'L', null, 'Same energy') + kpi('Fossil CO₂ avoided', fmtBig(dieselL * 2.68), '', null, 'From diesel replaced') +
      kpi('Charcoal replaced', fmtBig(briqMJ / 28.5), '', null, 'Same heat') + kpi('Glycerol to spare', fmtBig(Z.glyOther), '', null, 'Can be sold or used later');
    const rows = [['Calorific value (MJ/kg)', x => x.hhv, 1, 'hhv'], ['Strength (MPa)', x => x.strength, 2, 'strength'], ['Durability (%)', x => x.durability, 1, 'durability'], ['Crack risk (%)', x => x.dry.crack, 0, 'crack'], ['Ash (%)', x => x.ash, 1, 'ash'], ['Ignition (s)', x => x.tign, 0, 'ignition'], ['Smoke PM2.5 (g/MJ)', x => x.burn.perMJ.PM, 2, null], ['Quality score', x => x.score, 0, null]];
    $('#zB').innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Property</th><th class="num">Seed briquette (report B10)</th><th class="num">Waste briquette</th></tr></thead><tbody>${rows.map(([l, fn, dp, k]) => `<tr><td>${l}</td><td class="num">${(+fn(RS)).toFixed(dp)}</td><td class="num"><span class="row" style="gap:6px;justify-content:flex-end"><b>${(+fn(RW)).toFixed(dp)}</b>${k ? statusIcon(statusOf(k, metricValue(RW, k), targets())) : ''}</span></td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12.5px;margin:8px 0 0">Removing the oil lowers the heating value a little, but oil also weakens binding, so the cake often presses into stronger briquettes. Glycerol adds energy and acts as a glue.</p>`;
    $('#zE').innerHTML = `<table class="tbl"><tbody><tr><td>Heat in the seeds</td><td class="num"><b>${gj(seedMJ)} GJ</b></td></tr><tr><td>Useful heat in the biodiesel</td><td class="num">${gj(bdMJ)} GJ</td></tr><tr><td>Useful heat in the briquettes</td><td class="num">${gj(briqMJ)} GJ</td></tr><tr><td><b>Recovered as fuel</b></td><td class="num"><b>${f0(100 * (bdMJ + briqMJ) / seedMJ)}%</b></td></tr></tbody></table>
      <p class="muted" style="font-size:12.5px;margin:8px 0 0">Briquette heat includes the binder and glycerol added. "Useful heat" is the lower heating value as burned.</p>`;
  }
};

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  loadState();
  rebuildMats(S.custom, S.overrides);
  recompute(true);
  $('#recipeName').addEventListener('input', e => { S.name = e.target.value; saveState(); });
  $('#btnSave').addEventListener('click', () => {
    saveCurrent(); const b = $('#btnSave'); b.textContent = 'Saved'; setTimeout(() => b.textContent = 'Save recipe', 1400);
    if (CUR === 'compare') VIEWS.compare.update();
  });
  $('#btnReset').addEventListener('click', () => {
    const keep = { saved: S.saved, custom: S.custom, overrides: S.overrides, lab: S.lab, calib: S.calib, helpClosed: S.helpClosed };
    S = Object.assign(DEFAULT_STATE(), keep); recompute(true); route();
  });
  window.addEventListener('hashchange', route);
  // mobile menu drawer
  const setMenu = (open) => { document.body.classList.toggle('menu-open', open); $('#menuBtn').setAttribute('aria-expanded', open); };
  $('#menuBtn').addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
  $('#scrim').addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  route();
  // redraw canvases only when the width really changes (phones fire resize while scrolling)
  let rt, lastW = innerWidth; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; if (['press', 'burn', 'heat', 'engine', 'extract', 'reactor', 'zero'].includes(CUR)) route(); }, 300); });
})();
