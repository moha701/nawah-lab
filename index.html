        tip: (i, j, v) => { const c = grid[Ds[i] + '_' + rs[j]]; return `<b>Score ${v}</b><div>${dimText(c.sh)}</div><div>Burn ${fmtTime(c.R.burn.total)}, crack ${f0(c.R.dry.crack)}%</div>`; },
        onClick: (i, j) => { const c = grid[Ds[i] + '_' + rs[j]]; if (c) { Object.assign(S.shape, c.sh); route(); recompute(); } } });
    } else { $('#heatT').textContent = ''; $('#recoHeat').innerHTML = ''; }
  }
};

function makeAnim(step) {
  let id = null, last = 0;
  const a = { running:false,
    start() { if (a.running) return; a.running = true; last = performance.now(); ANIMS.add(a);
      const loop = (now) => { if (!a.running) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); id = requestAnimationFrame(loop); };
      id = requestAnimationFrame(loop); },
    stop() { a.running = false; cancelAnimationFrame(id); } };
  return a;
}
function setupCanvas(cv, h) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.max(280, cv.parentElement.clientWidth);
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
const easeIO = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const playIcon = (on) => on ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>Play';

/* ---------------- COMPACTION ---------------- */
VIEWS.press = {
  render(root) {

    const l = node('<div class="stack-v"></div>'), r = node('<div class="stack-v"></div>'); cols.append(l, r);

      <div class="stage-ctl"><button class="btn primary" id="pPlay">${playIcon(false)}</button><button class="btn" id="pRestart">Restart</button><input type="range" id="pScrub" min="0" max="1000" value="0" aria-label="Animation position"></div>`;

    ctlC.insertAdjacentHTML('beforeend', '<div id="pressKpis" class="kpis" style="margin-top:8px"></div>');
    const ch = card(l, 'Density vs pressure', 'Kawakita compaction curve for this mix (solids only). The dot is your forming pressure.');
    ch.insertAdjacentHTML('beforeend', '<div id="pCurve"></div>');
    const st = card(r, 'Density at each stage', 'From loose powder to the dried briquette.');
    st.insertAdjacentHTML('beforeend', '<div id="pStages"></div><div class="note" id="pNote" style="margin-top:10px"></div>');
    this.t = 0; this.playing = false; this.parts = null;

    $('#pRestart').addEventListener('click', () => { this.t = 0; this.setPlaying(true); });
    $('#pScrub').addEventListener('input', (e) => { this.t = e.target.value / 1000; this.setPlaying(false); this.draw(); });

  },
  setPlaying(on) { this.playing = on; $('#pPlay').innerHTML = playIcon(on); on ? this.anim.start() : this.anim.stop(); },
  update() {
    const R = S.R, c = R.comp;
    if (!$('#pCurve')) return;
    if (this.grind) this.grind.update();
    // particles
    const N = 420; let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cum = []; let acc = 0; S.recipe.forEach((r, i) => { acc += r.pct; cum.push([acc, SLOT[i]]); });
    const g = R.grind, pFine = g.two ? Math.min(0.85, g.f * 1.6) : 0, rFine = g.two ? Math.max(0.3, Math.sqrt(g.df / g.dc)) : 1;
    this.parts = [...Array(N)].map((_, i) => { const u = rnd() * 100, fine = rnd() < pFine; return { x: rnd(), y: (i + rnd()) / N, c: (cum.find(q => u <= q[0]) || cum[cum.length - 1])[1], r: (0.7 + rnd() * 0.6) * (fine ? rFine : 1) }; });
    const Pmax = S.proc.P, rhoL = c.D0 * R.mp.rt;
    const pts = []; for (let i = 0; i <= 60; i++) { const P = Math.min(150, Pmax * 3) * i / 60; pts.push([P, c.curve(P)]); }
    Chart.line($('#pCurve'), { series:[{ name:'Solid density', color:'#2a78d6', data:pts }], xLabel:'Pressure (MPa)', yLabel:'kg/m³', unit:'kg/m³', xName:'Pressure', dots:[{ x:Pmax, y:c.curve(Pmax), label: f0(c.curve(Pmax)) + ' kg/m³' }], height:230 });
    const stages = [
      { label:'Loose powder', value: rhoL, color:'#b5b0a8' },
      { label:'In mould at full pressure', value: c.rhoMax, color:'#2a78d6', tip:'Includes water from the binder paste' },
      { label:'Just ejected', value: c.rhoEject, color:'#2a78d6' },
      { label:'After 24 h (relaxed)', value: c.rho24, color:'#2a78d6' },
      { label:'Dried (final)', value: R.rhoDry, color:'#1d6b50', bold:true },
    ];
    Chart.bars($('#pStages'), { items: stages, unit:'kg/m³', fmt: f0, target:{ value: targets().density.min, label:'target ' + targets().density.min }, labelW: 170 });
    $('#pNote').innerHTML = `Compression ratio <b>${f1(c.rhoMax / (1 + c.X) / rhoL)} : 1</b>. Relaxation ratio <b>${f2(c.RR)}</b> (in-mould density ÷ 24-hour density). ` +
      (c.squeezed > 0.03 ? `<b>Water squeezed out:</b> about ${f0(c.squeezed * R.mass / (1 + c.X))} g per briquette, because the pores filled with water before full pressure.` : 'No water is squeezed out at this pressure.');
    $('#pressKpis').innerHTML = kpi('Final density', f0(R.rhoDry), 'kg/m³', statusOf('density', R.rhoDry, targets())) + kpi('Spring-back', f1((c.RR - 1) * 100), '%') + kpi('Moisture at pressing', f0(c.Mp * 100), '%') + kpi('Strength', f2(R.strength), 'MPa', statusOf('strength', R.strength, targets()));
    this.draw();
  },
  draw() {
    if (!this.parts || !this.cv) return;
    const { ctx, w, h } = this.cv, R = S.R, c = R.comp, t = this.t;
    ctx.clearRect(0, 0, w, h);
    const cx = w * 0.4, mw = Math.min(190, w * 0.36), baseY = h - 44, mh = 236, wall = 16, h0 = mh - 16;
    const rhoL = c.D0 * R.mp.rt, Pmax = S.proc.P;
    const hAt = (P) => h0 * rhoL / c.curve(P);
    const hMax = hAt(Pmax), hRel = hMax * (1 + 0.6 * c.spring), h24 = hMax * c.RR;
    let P = 0, hh = h0, phase = 'Filling', punchY, ejectT = 0, phCol = '#8c857d';
    if (t < 0.08) { phase = 'Loose powder in the mould'; }
    else if (t < 0.52) { const u = easeIO((t - 0.08) / 0.44); P = Pmax * u * u; hh = hAt(Math.max(P, 0.001)); phase = 'Pressing'; phCol = '#2a78d6'; }
    else if (t < 0.68) { P = Pmax; hh = hMax * (1 - 0.012 * (t - 0.52) / 0.16 * Math.min(1, S.proc.dwell / 30)); phase = `Holding ${S.proc.dwell} s`; phCol = '#1d6b50'; }
    else if (t < 0.78) { const u = (t - 0.68) / 0.10; P = Pmax * (1 - u); hh = lerp(hMax, hRel, u); phase = 'Releasing: spring-back'; phCol = '#eb6834'; }
    else { ejectT = easeIO(Math.min(1, (t - 0.78) / 0.14)); hh = lerp(hRel, h24, Math.min(1, (t - 0.78) / 0.22)); phase = 'Ejected briquette'; phCol = '#b9770e'; }
    const lift = ejectT * (mh - hh + 24);
    punchY = baseY - hh - (t >= 0.68 ? (t < 0.78 ? 0 : 30 + ejectT * 60) : 0) - lift * 0;
    // mould body
    ctx.save();
    ctx.globalAlpha = 1 - ejectT * 0.65;
    const steel = ctx.createLinearGradient(cx - mw / 2 - wall, 0, cx + mw / 2 + wall, 0);
    steel.addColorStop(0, '#9da3a6'); steel.addColorStop(0.15, '#e3e6e7'); steel.addColorStop(0.5, '#c4c9cb'); steel.addColorStop(0.85, '#e8eaeb'); steel.addColorStop(1, '#8c9295');
    ctx.fillStyle = steel;
    ctx.fillRect(cx - mw / 2 - wall, baseY - mh, wall, mh); ctx.fillRect(cx + mw / 2, baseY - mh, wall, mh);

    ctx.fillStyle = mixColor(S.recipe, S.proc.pre); ctx.globalAlpha = 0.22 + 0.5 * (1 - hh / h0); ctx.fillRect(cx - mw / 2, bottom - hh, mw, hh); ctx.globalAlpha = 1;

    }

    const pg = ctx.createLinearGradient(cx - mw / 2, 0, cx + mw / 2, 0); pg.addColorStop(0, '#7f8689'); pg.addColorStop(0.4, '#d9dcdd'); pg.addColorStop(1, '#6f7578');
    ctx.fillStyle = pg; ctx.fillRect(cx - mw / 2 + 2, py - 26, mw - 4, 26);
    ctx.fillStyle = '#9aa0a3'; ctx.fillRect(cx - 11, 0, 22, Math.max(0, py - 26));

    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.strokeStyle = '#e5e4dd'; ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.8, Math.PI * 2.2); ctx.stroke();
    ctx.strokeStyle = phCol; ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.8, Math.PI * 0.8 + Math.PI * 1.4 * Math.min(1, P / gmax)); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#1e1813'; ctx.font = '600 22px Archivo, sans-serif'; ctx.fillText(P < 10 ? P.toFixed(1) : Math.round(P), gx, gy + 6);
    ctx.font = '12px Archivo, sans-serif'; ctx.fillStyle = '#8c857d'; ctx.fillText('MPa', gx, gy + 24);
    const rhoNow = R.mp.rt * c.D0 * h0 / hh * (1 + c.X);
    ctx.fillStyle = '#52514e'; ctx.fillText('Pressure', gx, gy + gr + 14);
    ctx.textAlign = 'left'; ctx.fillStyle = '#52514e';
    ctx.fillText('Density now', gx - gr, gy + gr + 50); ctx.font = '600 20px Archivo, sans-serif'; ctx.fillStyle = '#1e1813'; ctx.fillText(f0(rhoNow) + ' kg/m³', gx - gr, gy + gr + 72);
    ctx.font = '12px Archivo, sans-serif'; ctx.fillStyle = '#52514e';
    ctx.fillText('Height', gx - gr, gy + gr + 98); ctx.font = '600 20px Archivo, sans-serif'; ctx.fillStyle = '#1e1813'; ctx.fillText(f0(hh / h0 * 100) + '% of loose', gx - gr, gy + gr + 120);
    const ph = $('#pPhase'); if (ph) ph.innerHTML = `<i style="background:${phCol}"></i>${phase}`;
  }

    const box = $('#gCmp'); box.innerHTML = '<div class="gas-cmp"></div>'; const g = box.firstElementChild;

  drawFrame(dt) {

    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, gy = h - 70;
    // grate

    for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 26, gy + 18); ctx.lineTo(cx + i * 26 + 8, gy + 18); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx - 130, gy + 18); ctx.lineTo(cx + 130, gy + 18); ctx.lineWidth = 3; ctx.stroke();

    // briquette (side view, scaled with remaining size)
    const geo = R.geo, sc = Math.pow(Math.max(f.s, 0.02), 1 / 3);
    const maxW = Math.min(170, w * 0.36), dimW = (S.shape.type === 'brick' ? S.shape.L : S.shape.type === 'cube' ? S.shape.a : S.shape.D || 60), dimH = S.shape.type === 'cube' ? S.shape.a : S.shape.type === 'sphere' ? S.shape.D : S.shape.H || 30;
    const k = Math.min(maxW / dimW, 120 / dimH);
    const bw = dimW * k * sc, bh = dimH * k * sc, top = gy + 16 - bh;
    const base = mixColor(S.recipe, S.proc.pre);
    const charC = '#1d1714', ashC = '#b9b4ac';
    const mixc = (a, b2, t) => rgbToHex(hexToRgb(a).map((x, i) => lerp(x, hexToRgb(b2)[i], t)));
    let col = mixc(base, charC, clamp(f.char * 1.2, 0, 1));
    if (f.phase === 'glow' || f.phase === 'out') col = mixc(col, ashC, clamp(f.ashFrac * 0.85, 0, 0.85));
    const round = ['cyl', 'cylHole', 'multiHole', 'sphere', 'pillow'].includes(S.shape.type);
    const grad = ctx.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
    grad.addColorStop(0, shade(col, -0.35)); grad.addColorStop(0.35, shade(col, 0.12)); grad.addColorStop(1, shade(col, -0.5));
    ctx.fillStyle = grad;
    if (S.shape.type === 'sphere' || S.shape.type === 'pillow') { ctx.beginPath(); ctx.ellipse(cx, top + bh / 2, bw / 2, bh / 2, 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(cx - bw / 2, top); ctx.lineTo(cx - bw / 2, top + bh); if (round) ctx.ellipse(cx, top + bh, bw / 2, bw * 0.13, 0, Math.PI, 0, true); else ctx.lineTo(cx + bw / 2, top + bh); ctx.lineTo(cx + bw / 2, top); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(col, 0.18); ctx.beginPath(); if (round) ctx.ellipse(cx, top, bw / 2, bw * 0.13, 0, 0, Math.PI * 2); else { ctx.moveTo(cx - bw / 2, top); ctx.lineTo(cx - bw / 2 + bw * 0.12, top - bw * 0.12); ctx.lineTo(cx + bw / 2 + bw * 0.12, top - bw * 0.12); ctx.lineTo(cx + bw / 2, top); } ctx.fill();
      if (geo.holeN > 0 && round) { ctx.fillStyle = '#0d0907'; ctx.beginPath(); ctx.ellipse(cx, top, bw * 0.13, bw * 0.035, 0, 0, Math.PI * 2); ctx.fill(); } }
    // embers
    if (f.ember > 0.02) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const n = 26; let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < n; i++) { const ex = cx + (rnd() - 0.5) * bw * 0.9, ey = top + rnd() * bh * 0.95; const fl = 0.55 + 0.45 * Math.sin(performance.now() / (180 + i * 23) + i);
        const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 6 + 7 * f.ember); g.addColorStop(0, `rgba(255,${150 + 60 * fl},60,${0.75 * f.ember * fl})`); g.addColorStop(1, 'rgba(255,80,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 6 + 7 * f.ember, 0, Math.PI * 2); ctx.fill(); }

    }

    if (dt > 0) {

      if (f.smoke > 0.05) spawn(this.smoke, Math.random() < f.smoke ? 1 : 0, () => ({ x: cx + (Math.random() - 0.5) * bw * 0.6, y: top, vx: (Math.random() - 0.5) * 8, vy: -(14 + Math.random() * 12), life: 0, max: 3 + Math.random() * 2, r: 8 + Math.random() * 6 }));
      if (f.ember > 0.3 && Math.random() < 0.06) spawn(this.sparks, 1, () => ({ x: cx + (Math.random() - 0.5) * bw * 0.6, y: top, vx: (Math.random() - 0.5) * 40, vy: -(60 + Math.random() * 60), life: 0, max: 0.8 }));
    }

    this.smoke = upd(this.smoke, dt); this.flames = upd(this.flames, dt); this.sparks = upd(this.sparks, dt);
    for (const p of this.smoke) { const a = (1 - p.life / p.max) * 0.16; ctx.fillStyle = `rgba(170,160,150,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.life * 1.4), 0, Math.PI * 2); ctx.fill(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';

      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, `rgba(255,${235 - 120 * u},${150 - 140 * u},${0.55 * (1 - u)})`); g.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); }

  }
};

    this.sim = conductionSim(k, R.rhoDry, R.th.cp, L, this.hp.Th, this.hp.Tc, this.hp.Tc, tEnd);
    const sim = this.sim, A = Math.PI * 0.065 * 0.065 / 4;
    Chart.line($('#hFlux'), { series:[{ name:'Heat flux', color:'#e8590c', data: sim.frames.map(fr => [fr.t / 60, Math.max(0, fr.qc)]), area:true }], xLabel:'Time (min)', yLabel:'W/m²', unit:'W/m²', xName:'Minute', markers: sim.tss ? [{ x: sim.tss / 60, label:'95% of steady state' }] : [], height:190, yMin:0 });
    $('#hKpis').innerHTML = kpi('Thermal conductivity', k < 0.1 ? k.toFixed(3) : f2(k), 'W/m·K', null, 'Model, from porosity & moisture') + kpi('Porosity', f0(R.th.phi * 100), '%') +
      kpi('Thermal diffusivity', (R.th.alpha * 1e7).toFixed(2), '×10⁻⁷ m²/s') + kpi('Steady heat flow', f2(sim.qss * A), 'W', null, 'Through a Ø65 mm disc') + kpi('Time to steady state', fmtTime(sim.tss), '') +
      kpi('Water rise at 100 mL/min', f2(sim.qss * A / (100 / 60000 * 4186)), 'K', null, 'Tiny: water ΔT needs low flow');

  calc() {
    const g = (k) => parseFloat($('#hc_' + k).value);
    const v = { L: g('L'), D: g('D'), Th: g('Th'), Tc: g('Tc'), flow: g('flow'), dTw: g('dTw') };
    S.lab.heat = v; saveState();
    const A = Math.PI * Math.pow(v.D / 1000, 2) / 4, Q = v.flow / 60000 * 4186 * v.dTw, kk = Q * (v.L / 1000) / (A * (v.Th - v.Tc));
    const R = S.R, Qm = R.th.k * A * (v.Th - v.Tc) / (v.L / 1000), flowNeeded = Qm / (4186 * v.dTw) * 60000;
    $('#hCalcOut').innerHTML = isFinite(kk) && kk > 0 ? `<div class="kpis">${kpi('Heat through specimen Q', f2(Q), 'W')}${kpi('Measured k', kk < 0.1 ? kk.toFixed(3) : f2(kk), 'W/m·K')}${kpi('Model k', f2(R.th.k), 'W/m·K', null, `${f0(100 * (kk - R.th.k) / R.th.k)}% difference`)}</div>
      <p class="note" style="margin-top:10px">With the model's k, only <b>${f2(Qm)} W</b> passes through this disc. Warming the water by ${v.dTw} K with that heat needs a flow of about <b>${f1(flowNeeded)} mL/min</b>. If your flow was much higher, most of the water's warming came from elsewhere in the apparatus, so measure Q this way or insulate the sides.</p>` : '<p class="muted">Enter positive numbers to calculate.</p>';
  },
  draw() {
    if (!this.sim || !this.cv) return;
    const { ctx, w, h } = this.cv, fr = this.sim.frames, f = fr[Math.min(fr.length - 1, Math.round(this.t * (fr.length - 1)))];
    ctx.clearRect(0, 0, w, h);
    const sx = 30, sw = Math.min(150, w * 0.28), sy = 30, sh = h - 70, Th = this.hp.Th, Tc = this.hp.Tc;
    const heatCol = (T) => { const u = clamp((T - Tc) / (Th - Tc), 0, 1); const a = [42, 120, 214], m = [240, 239, 236], b = [227, 73, 72]; const c = u < 0.5 ? a.map((x, i) => lerp(x, m[i], u * 2)) : m.map((x, i) => lerp(x, b[i], (u - 0.5) * 2)); return `rgb(${c.map(Math.round).join(',')})`; };
    ctx.fillStyle = '#d03b3b'; ctx.fillRect(sx, sy - 16, sw, 14); ctx.fillStyle = '#2a78d6'; ctx.fillRect(sx, sy + sh + 2, sw, 14);
    const n = f.T.length;
    for (let i = 0; i < n; i++) { ctx.fillStyle = heatCol(f.T[i]); ctx.fillRect(sx, sy + i / n * sh, sw, sh / n + 1); }
    ctx.strokeStyle = 'rgba(30,24,19,.25)'; ctx.strokeRect(sx, sy, sw, sh);
    ctx.fillStyle = '#52514e'; ctx.font = '12px Archivo, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`Hot plate ${Th} °C`, sx + sw + 10, sy - 5); ctx.fillText(`Cold plate ${Tc} °C`, sx + sw + 10, sy + sh + 13);
    // profile plot
    const px = sx + sw + 120, pw = w - px - 24; if (pw > 80) {
      ctx.strokeStyle = '#e1e0d9'; ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) { const y = sy + i / 4 * sh; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + pw, y); ctx.stroke(); }
      ctx.fillStyle = '#898781'; ctx.textAlign = 'center';
      for (let i = 0; i <= 4; i++) { const T = Tc + (Th - Tc) * i / 4; ctx.fillText(f0(T) + '°', px + i / 4 * pw, sy + sh + 16); }
      ctx.fillText('Temperature through the thickness', px + pw / 2, sy + sh + 34);
      ctx.strokeStyle = '#c3c2b7'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(px + pw, sy); ctx.lineTo(px, sy + sh); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#e8590c'; ctx.lineWidth = 2.5; ctx.beginPath();
      f.T.forEach((T, i) => { const x = px + (T - Tc) / (Th - Tc) * pw, y = sy + i / (n - 1) * sh; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    }
    $('#hTime').textContent = fmtTime(f.t);
    const ph = $('#hPhase'); if (ph) ph.innerHTML = this.sim.tss && f.t >= this.sim.tss ? '<i style="background:#0ca30c"></i>Steady state' : '<i style="background:#e8590c"></i>Heating through';
  }
};

      Chart.line($('#tvc_cv'), { series:[{ name:'Bucket temperature', color:'#e34948', data: pts }], xLabel:'Time (min)', yLabel:'°C', unit:'°C', xName:'Minute', height:170, yMin: 24.8, markers:[{ x:5, label:'fire' }] });

  refreshTest(t) {

    res.vals.forEach((v, i) => { const c = $(`#rv_${t.id}_${i}`); if (c) c.textContent = v == null ? '–' : v.toFixed(t.dp); });
    const st = res.n && t.tKey ? statusOf(t.tKey, res.mean, Object.assign({}, targets(), { [t.tKey]: Object.assign({}, targets()[t.tKey], targets()[t.tKey].dir > 0 ? { min: tgt, good: Math.max(tgt, targets()[t.tKey].good) } : { max: tgt, good: Math.min(tgt, targets()[t.tKey].good) }) })) : null;

      kpi('Predicted', pred == null ? '–' : (+pred).toFixed(t.dp), t.unit, null, res.n ? `${f0(100 * (res.mean - pred) / pred)}% from measured` : 'Model estimate') +

  },
  refreshAll() { TESTS.forEach(t => this.refreshTest(t)); this.table(); this.calibChips(); },

      rows.map(r => `<tr><td>${r.t.n} <span class="muted">(${r.t.unit})</span></td><td class="num">${r.tgt ?? '–'}</td><td class="num">${r.pred == null ? '–' : (+r.pred).toFixed(r.t.dp)}</td><td class="num"><b>${r.res.n ? r.res.mean.toFixed(r.t.dp) + ' ± ' + r.res.sd.toFixed(r.t.dp) : '–'}</b></td><td class="num">${r.res.n || '–'}</td><td class="num">${r.err == null ? '–' : (r.err >= 0 ? '+' : '') + f1(r.err)}</td><td>${r.remark}</td></tr>`).join('') + '</tbody>';

    const apply = (rec) => { S.recipe = rec.map(r => ({ id: r.id, pct: r.pct, lock: false })); S.name = 'Optimised blend'; recompute(true); };
    $('#oUse').addEventListener('click', () => apply(best.recipe));
    Chart.scatter($('#oScatter'), { points: res.slice(0, 1500).map((r, i) => ({ x: r.m.hhv, y: r.m.strength, c: r.score, hi: i === 0, r })), xLabel:'Calorific value (MJ/kg)', yLabel:'Strength (MPa)', height:260,
      tip: p => `<b>Score ${f0(p.c)}</b><div>${esc(recipeText(p.r.recipe))}</div><div>HHV ${f1(p.x)} MJ/kg, strength ${f2(p.y)} MPa, crack ${f0(p.r.m.crack)}%</div>`, onClick: p => apply(p.r.recipe) });

VIEWS.methods = {
  render(root) {
    viewHead(root, 'Methods & sources', 'How every number on this site is estimated, so you can explain it to judges.');
    const c = card(root, '', '');
    c.innerHTML = `<div class="prose">
      <div class="note amber"><b>Please read.</b> These are model estimates built from published correlations and typical material data. They are good for planning and for choosing what to test, but they are not measurements. Real date seeds vary by variety and storage. Confirm every number in the lab, and use the Test lab page to calibrate the model with your own results.</div>
      <h2>1. Mixture properties</h2>
      <p>Calorific value, volatile matter, ash, hydrogen, lignin and oil are averaged by dry mass share. Bulk and particle density are combined by volume. A cross-check uses the Parikh correlation from proximate analysis:</p>
      <span class="eq">HHV = 0.3536 FC + 0.1559 VM − 0.0078 Ash  (MJ/kg, dry)</span>
      <p>The lower heating value as burned subtracts the heat used to evaporate moisture and the water formed from hydrogen:</p>
      <span class="eq">LHV<sub>ar</sub> = HHV (1 − M) − 2.443 [M + 8.936 H (1 − M)]</span>
      <p>Torrefied and carbonised options change the composition using typical mass and energy yields (carbonised: about 30% mass yield at 450–500 °C; HHV then from the Parikh correlation).</p>
      <h2>2. Grinding and mixing two sizes</h2>
      <p>Choose one sieve size (0.1 to 5.6 mm, mesh 140 to 3.5) or mix a fine and a coarse fraction. In a mix, the small particles fill the gaps between the big ones, so the powder packs tighter before pressing. The packing gain is largest when the coarse size is at least four times the fine size and the fine share is about 30–40%; it disappears when the two sizes are equal. The effective size used for bonding is the surface-weighted mean:</p>
      <span class="eq">d<sub>eff</sub> = 1 / (f / d<sub>fine</sub> + (1 − f) / d<sub>coarse</sub>)</span>
      <p>Grinding effort is shown relative to 2 mm using Bond's law (energy ∝ 1/√P − 1/√F, with whole seeds of about 20 mm as feed). Report reference [23] found that combining particle-size fractions improved briquette quality.</p>
      <h2>2b. Compaction</h2>
      <p>Density in the mould follows the Kawakita equation, where C is the volume reduction, P the pressure, a the initial porosity and b a plasticity constant that depends on particle hardness, fibre, size, moisture, binder and hold time:</p>
      <span class="eq">C = a b P / (1 + b P)</span>
      <p>If the pores fill with water before full pressure, the extra water is squeezed out. Spring-back after ejection grows with fibre, hardness, pressure and wetness, and falls with binder and longer hold times. Report Eqs. 3.1–3.2 give the nominal pressure P = F / A.</p>
      <h2>3. Drying and cracking</h2>
      <p>Moisture loss uses the first term of Fick's diffusion solution for a body with half-thickness equal to volume ÷ surface area, with diffusivity rising with temperature (Arrhenius). Sun drying alternates hot days and cool, humid nights. Equilibrium moisture depends on humidity and on sugary binders.</p>
      <span class="eq">dX/dt = −(π² D<sub>eff</sub> / 4L²)(X − X<sub>e</sub>)</span>
      <p>The crack risk index combines drying shrinkage, drying speed, thickness, particle hardness and fibre content. It is a relative index to compare options, not a probability.</p>
      <h2>4. Strength and durability</h2>
      <p>Compressive strength grows with binder bonding (with diminishing returns), relative density (power 2.5), finer particles and natural lignin or fibre interlocking at high pressure. It falls with seed oil, excess moisture and cracks. Durability and shatter index are estimated from strength, briquette mass and edge sharpness. Report Eq. 3.7: σ = F<sub>max</sub> / A<sub>0</sub>.</p>
      <h2>5. Ignition</h2>
      <p>Piloted ignition of a thermally thick solid:</p>
      <span class="eq">t<sub>ig</sub> = (π/4) k ρ c [(T<sub>ig</sub> − T<sub>0</sub>) / q″<sub>net</sub>]²</span>
      <p>adjusted for moisture and volatile matter. Low-volatile chars take much longer to light.</p>
      <h2>6. Combustion</h2>
      <p>The briquette is split into water, volatiles, fixed carbon and ash. Volatiles burn as a flame from the surface, then char burns as glowing combustion, both proportional to the shrinking surface area. A single briquette in open air gets little heat back from its own flame, so the flame can die soon after the igniter is removed and the briquette smoulders. That matches the short flame (about 17 s) in your Phase I trial. Burning rate uses report Eq. 3.8.</p>
      <h2>6b. Gases and smoke</h2>
      <p>Carbon in the fuel is found from the calorific value with the Channiwala–Parikh correlation. As the briquette burns, every gram released is split into CO₂ and CO using a combustion efficiency (MCE) for each phase: flaming in a stove about 95%, in open air about 93%, smouldering about 80%, glowing char about 88%, lower when the briquette is wet. Smoke particles (PM2.5) and methane use emission factors that are low for flaming and high for smouldering, rising with oil and moisture. NOx comes from fuel nitrogen with a conversion that falls as nitrogen rises; SO₂ and HCl come from fuel sulphur and chlorine, with part kept in the ash. Chimney gas composition assumes 2× the minimum air in a stove and 3.5× in open air.</p>
      <p>Levels (per MJ of fuel energy): CO low ≤ 3, moderate ≤ 6 g/MJ; PM2.5 low ≤ 0.25, moderate ≤ 0.6 g/MJ; NOx low ≤ 0.10, moderate ≤ 0.25 g/MJ; SO₂ low ≤ 0.03, moderate ≤ 0.10 g/MJ; HCl low ≤ 0.02, moderate ≤ 0.06 g/MJ. These are guide levels set for this tool from typical cookstove data, not legal limits. Biogenic CO₂ is shown but not rated.</p>
      <h2>7. Heat conduction</h2>
      <p>Effective conductivity is the geometric mean of solid and pore conductivity weighted by porosity, with pores partly filled with water. The transient profile uses an explicit finite-difference solution of the 1-D heat equation. Report Eq. 3.9: k = Q L / [A (T<sub>hot</sub> − T<sub>cold</sub>)], with Q measured from the cooling water as ṁ c<sub>p</sub> ΔT.</p>
      <h2>8. Shape recommendation</h2>
      <p>About 500 shapes and sizes are simulated with your mix. Each is scored on burn time, peak power per gram, ignition, durability, crack risk, drying time, ease of pressing in a die, density evenness (height ÷ diameter) and fit in a household stove. The goal you pick sets the weights.</p>
      <h2>9. Best briquette finder</h2>
      <p>Runs in stages so it stays fast: about 1,500 blends of your ingredients (binder 3–16%), then 200 process combinations for the 3 best blends (5 grinding options, normal or thick paste, 10 or 30 s hold, 5 drying plans), then about 400 shapes and sizes. Options that meet every target are preferred; within those, the quality score and your goal decide. Pressure is set to the highest your press can reach.</p>
      <h2>Sources</h2>
      <ol>
        <li>J. Parikh, S. A. Channiwala and G. K. Ghosal, "A correlation for calculating HHV from proximate analysis of solid fuels," <i>Fuel</i>, vol. 84, pp. 487–494, 2005.</li>
        <li>K. Kawakita and K.-H. Lüdde, "Some considerations on powder compression equations," <i>Powder Technology</i>, vol. 4, pp. 61–68, 1971.</li>
        <li>S. V. Vassilev, D. Baxter, L. K. Andersen and C. G. Vassileva, "An overview of the chemical composition of biomass," <i>Fuel</i>, vol. 89, pp. 913–933, 2010.</li>
        <li>R. A. Nasser et al., "Chemical analysis of different parts of date palm (Phoenix dactylifera L.) using ultimate, proximate and thermo-gravimetric techniques for energy production," <i>Energies</i>, vol. 9, no. 5, 374, 2016.</li>
        <li>J. G. Quintiere, <i>Fundamentals of Fire Phenomena</i>. Chichester, UK: Wiley, 2006 (ignition of thermally thick solids).</li>
        <li>J. Crank, <i>The Mathematics of Diffusion</i>, 2nd ed. Oxford, UK: Clarendon Press, 1975.</li>
        <li>S. A. Channiwala and P. P. Parikh, "A unified correlation for estimating HHV of solid, liquid and gaseous fuels," <i>Fuel</i>, vol. 81, pp. 1051–1063, 2002.</li>
        <li>S. van Loo and J. Koppejan, Eds., <i>The Handbook of Biomass Combustion and Co-firing</i>. London, UK: Earthscan, 2008 (fuel-N to NOx, emissions).</li>
        <li>TNO, "Phyllis2: database for the physico-chemical composition of (treated) lignocellulosic biomass." [Online]. Available: phyllis.nl</li>
        <li>ISO 18134-3, ISO 18122, ISO 18125, ISO 17831-2 (solid biofuels test methods), as listed in the project report.</li>
        <li>Report references [12], [14] and [18] for starch and cassava-type binders and low-pressure presses.</li>
      </ol>
      <h2>About this site</h2>
      <p>Created by <b>Mohammed Hamed Al-Shabibi</b> (Instagram <a href="https://www.instagram.com/mhmd8p/" target="_blank" rel="noopener">@mhmd8p</a>), Mechanical Engineering, University of Technology and Applied Sciences, Ibra, as part of the project "Design and Thermal Evaluation of Biomass Briquettes produced from Waste Date Seeds". Recipes, lab readings and edited materials are saved only in this browser.</p>
    </div>`;
  }
};

/* ============================================================
   VIEW: Best briquette — one-click full optimisation
   recipe → grinding / moisture / pressing / drying → shape & size

const GOAL_MIX_W = {
  allround: { hhv:1, strength:1, crack:1, ash:0.5, cost:0.5, waste:0.5, durability:0.5 },
  fast:     { hhv:1.5, strength:0.6, crack:0.7, ash:0.7, cost:0.3, waste:0.3, durability:0.4 },
  long:     { hhv:1.2, strength:1, crack:1, ash:0.6, cost:0.3, waste:0.3, durability:1 },
  strong:   { hhv:0.5, strength:2, crack:1, ash:0.3, cost:0.3, waste:0.3, durability:1.5 },
  easy:     { hhv:0.6, strength:0.8, crack:1.5, ash:0.3, cost:1, waste:0.6, durability:0.5 },
};
const LOCAL_POOL = [['date_seed', 40, 90], ['palm_fibre', 0, 15], ['palm_frond', 0, 20], ['mesquite', 0, 25], ['wheat_flour', 0, 12], ['rejected_dates', 0, 12], ['cassava_flour', 0, 12]];
const meetsAll = (R, T) => R.strength >= T.strength.min && R.durability >= T.durability.min && R.ash <= T.ash.max && R.dry.crack <= T.crack.max && R.hhv >= T.hhv.min && R.Mf * 100 <= T.moisture.max && R.rhoDry >= T.density.min;
const grindText = (p) => p.grind === 'two' ? `${f0(p.fineShare * 100)}% fine (${p.fine} mm) + ${f0(100 - p.fineShare * 100)}% coarse (${p.coarse} mm)` : `one size, ${p.size} mm sieve`;

VIEWS.best = {
  render(root) {
    viewHead(root, 'Best briquette', 'One button finds the best complete briquette for your goal: the recipe, grinding, mix moisture, pressing, drying, and the shape and size.');
    this.o = Object.assign({ pool:'current', Pmax: 8, goal: S.goal || 'allround' }, this.o || {});
    const cols = node('<div class="cols"></div>'); root.appendChild(cols);
    const l = node('<div class="stack-v"></div>'), r = node('<div class="stack-v"></div>'); cols.append(l, r);
    const c = card(l, 'What do you want?', '');
    seg(c, { label:'Goal', options:Object.entries(GOALS).map(([k, g]) => [k, g.n]), value:this.o.goal, onChange: v => { this.o.goal = v; } });
    seg(c, { label:'Ingredients to use', full:true, options:[['current','My current ingredients'],['local','Date seed + local helpers']], value:this.o.pool, onChange: v => { this.o.pool = v; this.poolNote(); } });
    this.pn = node('<div class="hint" style="font-size:12.5px;color:var(--muted);margin:-6px 0 8px"></div>'); c.appendChild(this.pn); this.poolNote();
    slider(c, { label:'Highest pressure your press can reach', min:1, max:150, log:true, value:this.o.Pmax, unit:'MPa', fmt: v => v < 10 ? f1(v) : f0(v), round: v => v < 10 ? Math.round(v * 10) / 10 : Math.round(v), onInput: v => { this.o.Pmax = v; }, hint:'Your machine design is not final yet. A hand screw press reaches about 3–8 MPa.' });
    const go = node('<button class="btn amber" style="margin-top:10px;font-size:15px;padding:10px 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>Find the best briquette</button>');
    c.appendChild(go); go.addEventListener('click', () => this.run());
    this.prog = node('<div class="best-prog" aria-live="polite"></div>'); c.appendChild(this.prog);
    const how = card(l, 'How it searches', '');
    how.insertAdjacentHTML('beforeend', `<ol class="steps"><li><b>Recipe.</b> Tests 1,500 blends and keeps the ones that meet every target.</li><li><b>Process.</b> For the 3 best blends, tries 5 grinding options, 2 paste thicknesses, 2 hold times and 5 drying plans.</li><li><b>Shape.</b> Tests about 400 shapes and sizes with the winning recipe.</li><li><b>Result.</b> Shows everything side by side with your current briquette. One click applies it to the whole site.</li></ol>`);
    this.out = card(r, 'Recommended briquette', 'Press "Find the best briquette" to start. It takes a few seconds.');
    this.outBody = node('<div></div>'); this.out.appendChild(this.outBody);
    if (this.last) this.show(this.last);
  },
  poolNote() {
    if (!this.pn) return;
    this.pn.innerHTML = this.o.pool === 'current' ? `Uses: ${esc(S.recipe.map(r => getMat(r.id).n).join(', '))}.` : `Uses: ${LOCAL_POOL.map(p => getMat(p[0]).n).join(', ')}. All available in Oman.`;
  },
  step(i, msg) { this.prog.innerHTML = `<div class="bar"><i style="width:${i * 25}%"></i></div><span>${msg}</span>`; },
  run() {
    const T = targets(), goal = this.o.goal, before = S.R;
    const baseProc = Object.assign({}, S.proc, { P: this.o.Pmax }), baseShape = Object.assign({}, S.shape);
    let ids, bounds;
    if (this.o.pool === 'local') { ids = LOCAL_POOL.map(p => p[0]); bounds = LOCAL_POOL.map(p => [p[1], p[2]]); }
    else { ids = S.recipe.map(r => r.id); bounds = S.recipe.map(r => { const m = getMat(r.id); return isBinder(m) ? [3, 15] : r.id === 'date_seed' ? [40, 95] : [0, 40]; }); }
    const tick = (fn) => setTimeout(fn, 20);
    this.step(1, 'Step 1 of 4: testing blends…');
    tick(() => {
      let recs;
      if (ids.length < 2) recs = [{ recipe: [{ id: ids[0], pct: 100 }] }];
      else {
        let res = optimiseMix(ids, bounds, baseProc, baseShape, GOAL_MIX_W[goal], S.calib, 1500);
        res = res.filter(r => { const b = r.recipe.reduce((s, x) => s + (isBinder(getMat(x.id)) ? x.pct : 0), 0); return b >= 3 && b <= 16; });
        const ok = res.filter(r => meetsAll(r.R, T));
        recs = (ok.length ? ok : res).slice(0, 3);
      }
      this.step(2, 'Step 2 of 4: tuning grinding, paste and drying…');
      tick(() => {
        const grinds = [{ grind:'one', size:2 }, { grind:'one', size:1 }, { grind:'one', size:0.5 }, { grind:'two', fine:0.5, coarse:2, fineShare:0.35 }, { grind:'two', fine:0.25, coarse:2.8, fineShare:0.35 }];
        const drys = [{ dry:'shade', dryH:72 }, { dry:'shade', dryH:120 }, { dry:'sun', dryH:48 }, { dry:'oven60', dryH:24 }, { dry:'oven105', dryH:8 }];
        let best = null;
        for (const rc of recs) for (const g of grinds) for (const d of drys) for (const dwell of [10, 30]) for (const mm of ['auto', 'thick']) {
          const proc = Object.assign({}, baseProc, g, d, { dwell });
          if (mm === 'thick') { const mp = mixProps(rc.recipe, proc.pre); proc.moistMode = 'manual'; proc.moist = clamp(mp.Mopt, 0.10, 0.4); } else proc.moistMode = 'auto';
          const R = evaluate(rc.recipe, proc, baseShape, { quick: true, noBurn: true, calib: S.calib, targets: T });
          const eff = R.grind.effort;
          let sc = R.score + (meetsAll(R, T) ? 30 : 0) - (goal === 'easy' ? 4 * (eff - 1) + d.dryH / 30 + (g.grind === 'two' ? 2 : 0) : 1.5 * Math.max(0, eff - 1.5) + d.dryH / 120);
          sc += 2 * Math.min(R.strength, 4) + (40 - R.dry.crack) / 10 + (R.durability - 90) / 4;   // tie-breakers once the score reaches 100
          if (goal === 'strong') sc += 8 * R.strength; if (goal === 'fast') sc += 0.5 * (60 - R.tign) / 6;
          if (!best || sc > best.sc) best = { sc, recipe: rc.recipe, proc, R };
        }
        this.step(3, 'Step 3 of 4: finding the best shape and size…');
        tick(() => {
          const rec = recommendShapes(best.recipe, best.proc, baseShape, goal, S.calib);
          const top = Object.values(rec.bestByType).sort((a, b) => b.score - a.score)[0];
          const shape = Object.assign({}, baseShape, top.sh);
          this.step(4, 'Step 4 of 4: final check…');
          tick(() => {
            const R = evaluate(best.recipe, best.proc, shape, { calib: S.calib, targets: T });
            this.last = { recipe: best.recipe, proc: best.proc, shape, R, before, goal, meets: meetsAll(R, T), shapeScore: top.score };
            this.prog.innerHTML = '';
            this.show(this.last);
          });
        });
      });
    });
  },
  show(B) {
    if (!this.outBody) return;
    const R = B.R, P = B.proc, b0 = B.before, T = targets();
    this.out.querySelector('.sub').innerHTML = `Goal: <b>${GOALS[B.goal].n}</b>. ${B.meets ? 'Meets every target.' : 'No option met every target; this is the closest. Try a higher pressure or other ingredients.'}`;
    const binder = B.recipe.filter(r => isBinder(getMat(r.id))).reduce((s, r) => s + r.pct, 0);
    const rows = [
      ['Calorific value', 'MJ/kg', x => x.hhv, 1, 'hhv'], ['Dry density', 'kg/m³', x => x.rhoDry, 0, 'density'], ['Strength', 'MPa', x => x.strength, 2, 'strength'],
      ['Durability', '%', x => x.durability, 1, 'durability'], ['Crack risk', '%', x => x.dry.crack, 0, 'crack'], ['Ash', '%', x => x.ash, 1, 'ash'],
      ['Ignition', 's', x => x.tign, 0, 'ignition'], ['Burn time', 'min', x => x.burn.total / 60, 0, null], ['Final moisture', '%', x => x.Mf * 100, 1, 'moisture'],
      ['Mass per briquette', 'g', x => x.mass, 0, null], ['Material cost', 'OMR/kg', x => x.cost, 3, null], ['Quality score', '/100', x => x.score, 0, null],
    ];
    const better = (k, a, c) => { if (!k || !TARGETS[k] || k === 'moisture') return ''; const up = TARGETS[k].dir > 0; const d = c - a; if (Math.abs(d) <= 0.02 * Math.max(Math.abs(a), 1e-9)) return ''; return (up ? d > 0 : d < 0) ? 'up' : 'down'; };
    this.outBody.innerHTML = `
      <div class="best-hero"><div class="best-shape">${shapeSVG(B.shape, mixColor(B.recipe, P.pre), 340, 210)}</div>
        <div><div class="best-score">${R.score}<small>/100</small></div><div class="muted" style="font-size:13px">quality score, was ${b0.score}</div>
        <div style="margin-top:10px;font-weight:650">${SHAPES[B.shape.type].n}</div><div class="ink2" style="font-size:13.5px">${dimText(B.shape)}, about ${f0(R.mass)} g</div></div></div>
      <h3>Recipe (dry mass)</h3><div id="bestStack"></div>
      <h3>How to make it</h3>
      <table class="tbl recipe-steps"><tbody>
        <tr><td class="ink2">Grinding</td><td><b>${grindText(P)}</b></td></tr>
        <tr><td class="ink2">Binder</td><td><b>${f1(binder)}%</b> of dry mass${binder > 0 ? `, cooked into paste` : ''}</td></tr>
        <tr><td class="ink2">Mix moisture</td><td><b>${f0(R.comp.M0 * 100)}%</b>${P.moistMode === 'manual' ? ' (make the paste thicker than usual)' : ' (normal paste)'}</td></tr>
        <tr><td class="ink2">Pressing</td><td><b>${P.P < 10 ? f1(P.P) : f0(P.P)} MPa</b>, hold <b>${P.dwell} s</b></td></tr>
        <tr><td class="ink2">Drying</td><td><b>${DRY_METHODS[P.dry].n}</b> for <b>${fmtHours(P.dryH)}</b></td></tr>
        <tr><td class="ink2">Shape</td><td><b>${SHAPES[B.shape.type].n}</b>, ${dimText(B.shape)}</td></tr>
      </tbody></table>
      <div class="row" style="margin:14px 0 4px"><button class="btn primary" id="bestApply">Apply to the whole site</button><span class="muted" style="font-size:13px">Your current recipe is saved first so you can go back.</span></div>
      <h3>Compared with your current briquette</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Property</th><th class="num">Current</th><th class="num">Recommended</th><th class="num">Change</th></tr></thead><tbody>
      ${rows.map(([l, u, fn, dp, k]) => { const a = fn(b0), c = fn(R), dir = better(k, a, c); const st = k && TARGETS[k] ? statusIcon(statusOf(k, c, T)) : '';
        return `<tr><td>${l} <span class="muted">(${u})</span></td><td class="num">${(+a).toFixed(dp)}</td><td class="num"><span class="row" style="gap:6px;justify-content:flex-end"><b>${(+c).toFixed(dp)}</b>${st}</span></td><td class="num chg ${dir}">${dir === 'up' ? '▲ better' : dir === 'down' ? '▼ worse' : ''}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">Estimates from the model. Make a small batch and check it in the Test lab before you rely on it.</p>`;
    Chart.stack($('#bestStack'), { segments: B.recipe.map((r, i) => ({ label: getMat(r.id).n, value: r.pct, color: SLOT[i] })), dp: 1 });
    $('#bestApply').addEventListener('click', () => {
      saveCurrent((S.name || 'My mix') + ' (before best)');
      S.recipe = B.recipe.map(r => ({ id: r.id, pct: r.pct, lock: false }));
      S.proc = Object.assign({}, S.proc, B.proc); S.shape = Object.assign({}, B.shape); S.goal = B.goal;
      S.name = 'Best briquette (' + GOALS[B.goal].n.toLowerCase() + ')';
      recompute(true);
      const btn = $('#bestApply'); btn.textContent = 'Applied'; btn.disabled = true;
    });
  },
  update() {}
};

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  loadState();
  rebuildMats(S.custom, S.overrides);
  recompute(true);
  $('#recipeName').addEventListener('input', e => { S.name = e.target.value; saveState(); });
  $('#btnSave').addEventListener('click', () => {
    saveCurrent(); const b = $('#btnSave'); b.textContent = 'Saved'; setTimeout(() => b.textContent = 'Save recipe', 1400);
    if (CUR === 'compare') VIEWS.compare.update();
  });
  $('#btnReset').addEventListener('click', () => {
    const keep = { saved: S.saved, custom: S.custom, overrides: S.overrides, lab: S.lab, calib: S.calib };
    S = Object.assign(DEFAULT_STATE(), keep); recompute(true); route();
  });
  window.addEventListener('hashchange', route);
  // footer credit for small screens
  document.querySelector('.shell').insertAdjacentHTML('afterend', '<div class="m-credit">Created by <b>Mohammed Hamed Al-Shabibi</b>, Instagram <a href="https://www.instagram.com/mhmd8p/" target="_blank" rel="noopener">@mhmd8p</a></div>');
  route();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (['press', 'burn', 'heat'].includes(CUR)) route(); }, 300); });
})();
</script>
</body>
</html>
